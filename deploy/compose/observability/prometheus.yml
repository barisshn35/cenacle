global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Every instance of the chat server (docker compose up --scale server=N).
  - job_name: cenacle-server
    dns_sd_configs:
      - names: [server]
        type: A
        port: 9090
  - job_name: cenacle-idp
    dns_sd_configs:
      - names: [idp]
        type: A
        port: 9091
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
