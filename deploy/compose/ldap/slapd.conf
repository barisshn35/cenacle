# Minimal test directory for Cenacle development. Not for production use.
include   /etc/openldap/schema/core.schema
include   /etc/openldap/schema/cosine.schema
include   /etc/openldap/schema/inetorgperson.schema
include   /etc/openldap/schema/nis.schema

pidfile   /run/openldap/slapd.pid
argsfile  /run/openldap/slapd.args
modulepath /usr/lib/openldap
moduleload back_mdb.so

# Users can read the directory and change their own password; anonymous binds
# may only authenticate.
access to attrs=userPassword
  by self write
  by anonymous auth
  by * none
access to *
  by users read
  by * none

database  mdb
maxsize   104857600
suffix    "dc=cenacle,dc=test"
rootdn    "cn=admin,dc=cenacle,dc=test"
rootpw    @ROOTPW@
directory /var/lib/openldap/data
index     objectClass eq
index     uid,cn,mail eq,sub
index     member eq
