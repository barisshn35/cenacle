# Opt-in overlay: prod.yml + calls.yml; never loaded by default.
# The media image follows the other images (CENACLE_IMAGE_PREFIX, CENACLE_VERSION);
# CENACLE_MEDIA_IMAGE overrides it, for example with an @sha256 digest.
services:
  proxy:
    environment:
      CENACLE_CALLS: 'on'
  server:
    environment:
      CENACLE_CALLS: 'on'
      CENACLE_CALLS_INTERNAL_ADDR: ':7883'
      CENACLE_MEDIA_INTERNAL_CIDRS: '172.29.88.2/32'
      CENACLE_CALLS_PRIVATE_KEY_FILE: /run/secrets/calls_private_key
      CENACLE_MEDIA_CONTROL_PUBLIC_KEY_FILE: /run/secrets/media_control_public_key
      CENACLE_MEDIA_NODE_ID: media-1
    secrets: [calls_private_key, media_control_public_key]
    networks:
      edge: {}
      data: {}
      files: {}
      calls-control:
        aliases: [calls-control-server]
  valkey:
    networks:
      data: {}
      calls-control: {}
  media:
    image: ${CENACLE_MEDIA_IMAGE:-${CENACLE_IMAGE_PREFIX:-ghcr.io/cenacle-tr/cenacle-}media:${CENACLE_VERSION}}
    user: '65532:65532'
    init: false
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs: [/tmp:size=16m, noexec, nosuid]
    environment:
      CENACLE_PUBLIC_URL: https://${CENACLE_DOMAIN}
      CENACLE_MEDIA_PUBLIC_IP: ${CENACLE_MEDIA_PUBLIC_IP:?set the media node public IP explicitly}
      CENACLE_MEDIA_NODE_ID: media-1
      CENACLE_MEDIA_CONTROL_URL: http://calls-control-server:7883/control
      CENACLE_MEDIA_CONTROL_PRIVATE_KEY_FILE: /run/secrets/media_control_private_key
      CENACLE_CALLS_PUBLIC_KEY_FILE: /run/secrets/calls_public_key
      CENACLE_VALKEY_ADDR: valkey:6379
      CENACLE_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
    secrets: [calls_public_key, media_control_private_key, valkey_password]
    networks:
      edge: {}
      calls-control:
        ipv4_address: 172.29.88.2
    ports: ['7882:7882/udp', '7881:7881/tcp']
    depends_on:
      server: { condition: service_started }
      valkey: { condition: service_healthy }
    logging:
      driver: local
      options: { max-size: 10m, max-file: '3' }
networks:
  calls-control:
    internal: true
    ipam:
      config: [{ subnet: 172.29.88.0/28 }]
secrets:
  calls_private_key: { file: ./secrets/calls_private.pem }
  calls_public_key: { file: ./secrets/calls_public.pem }
  media_control_private_key: { file: ./secrets/media_control_private.pem }
  media_control_public_key: { file: ./secrets/media_control_public.pem }
