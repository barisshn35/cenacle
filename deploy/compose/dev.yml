#
# Local development stack. Start with `make up` (uses .env, project "cenacle").
# Infrastructure only by default; the application containers are in the
# optional "apps" profile: `docker compose ... --profile apps up -d --build`.
# All ports are bound to 127.0.0.1 and configurable in .env.

name: cenacle

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CHAT_DB_NAME: ${CHAT_DB_NAME:-cenacle_chat}
      CHAT_DB_USER: ${CHAT_DB_USER:-cenacle_chat}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?set CHAT_DB_PASSWORD in .env}
      IDP_DB_NAME: ${IDP_DB_NAME:-cenacle_idp}
      IDP_DB_USER: ${IDP_DB_USER:-cenacle_idp}
      IDP_DB_PASSWORD: ${IDP_DB_PASSWORD:?set IDP_DB_PASSWORD in .env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-15432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
      - ./postgres/dev/02-test-databases.sh:/docker-entrypoint-initdb.d/02-test-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  valkey:
    <<: *restart
    image: valkey/valkey:9.0.6-alpine
    command: [valkey-server, --save, '60', '1', --appendonly, 'no']
    ports:
      - 127.0.0.1:${VALKEY_PORT:-16379}:6379
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  ldap:
    <<: *restart
    build: ./ldap
    image: cenacle-dev-ldap:local
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?set LDAP_ADMIN_PASSWORD in .env}
    ports:
      - 127.0.0.1:${LDAP_PORT:-13389}:3389
    volumes:
      - ldap-data:/var/lib/openldap/data

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.31.6
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_DISABLE_VERSION_CHECK: 'true'
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Application containers (profile "apps") ---------------------------

  migrate:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: cenacle-server:dev
    command: [migrate, up]
    environment: &server-env
      CENACLE_ENV: development
      CENACLE_LOG_FORMAT: json
      CENACLE_DATABASE_URL: postgres://${CHAT_DB_USER:-cenacle_chat}:${CHAT_DB_PASSWORD}@postgres:5432/${CHAT_DB_NAME:-cenacle_chat}?sslmode=disable
      CENACLE_VALKEY_ADDR: valkey:6379
      # Container smoke test of the server; signing in end to end needs the
      # /api proxy of the Vite dev server or of the production stack.
      CENACLE_OIDC_ISSUER: http://localhost:${IDP_APP_PORT:-18190}
      CENACLE_OIDC_BACKCHANNEL_URL: http://idp:8190
      CENACLE_OIDC_CLIENT_SECRET_FILE: /etc/cenacle/chat-client-secret.txt
    volumes:
      - ../../idp/dev:/etc/cenacle:ro
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *restart
    profiles: [apps]
    image: cenacle-server:dev
    command: [serve]
    environment: *server-env
    ports:
      - 127.0.0.1:${SERVER_APP_PORT:-18180}:8180
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/bin/cenacle-server, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 10

  idp-migrate:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: idp/Dockerfile
    image: cenacle-idp:dev
    command: [node, dist/cli.js, migrate, up]
    environment: &idp-env
      IDP_ENV: development
      IDP_HOST: 0.0.0.0
      IDP_ISSUER: http://localhost:${IDP_APP_PORT:-18190}
      IDP_DATABASE_URL: postgres://${IDP_DB_USER:-cenacle_idp}:${IDP_DB_PASSWORD}@postgres:5432/${IDP_DB_NAME:-cenacle_idp}
      IDP_KEY_ENCRYPTION_KEY: ${IDP_KEY_ENCRYPTION_KEY}
      IDP_COOKIE_KEYS: ${IDP_COOKIE_KEYS}
      IDP_CLIENTS_FILE: /etc/cenacle/clients.json
    volumes:
      - ../../idp/dev:/etc/cenacle:ro
    depends_on:
      postgres:
        condition: service_healthy

  idp:
    <<: *restart
    profiles: [apps]
    image: cenacle-idp:dev
    environment: *idp-env
    volumes:
      - ../../idp/dev:/etc/cenacle:ro
    ports:
      - 127.0.0.1:${IDP_APP_PORT:-18190}:8190
    depends_on:
      idp-migrate:
        condition: service_completed_successfully

  web:
    <<: *restart
    profiles: [apps]
    build:
      context: ../..
      dockerfile: web/Dockerfile
    image: cenacle-web:dev
    ports:
      - 127.0.0.1:${WEB_APP_PORT:-18080}:8080

volumes:
  postgres-data:
  valkey-data:
  ldap-data:
