# Garage (S3-compatible object store for files) in production: one node.
# For redundancy, run a Garage cluster (or any S3 service) and point
# CENACLE_S3_ENDPOINT at it instead (docs/install).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# SQLite survives power loss better than LMDB; files are not hot data.
db_engine = "sqlite"
metadata_auto_snapshot_interval = "6h"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret comes from GARAGE_RPC_SECRET (secrets/garage.env).

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.internal"
