# SPDX-License-Identifier: AGPL-3.0-only
#
# Production stack. Single host, automatic TLS via Caddy.
#
#   cd deploy/compose
#   ./gen-secrets.sh                   # random passwords into ./secrets
#   cp .env.prod.example .env.prod     # set domains, e-mail, version
#   docker compose -f prod.yml --env-file .env.prod up -d
#
# Everything runs as non-root, with dropped capabilities and read-only root
# file systems where possible. Databases are only on the internal network.
# Images can be pre-pulled for air-gapped installs (docker save / load).

name: cenacle

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: local
    options: { max-size: 20m, max-file: '5' }

x-images:
  server: &server-image ${CENACLE_IMAGE_PREFIX:-ghcr.io/cenacle-tr/cenacle-}server${CENACLE_IMAGE_VARIANT:-}:${CENACLE_VERSION:?set CENACLE_VERSION}

services:
  proxy:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/compose/caddy/Dockerfile
    image: ${CENACLE_IMAGE_PREFIX:-ghcr.io/cenacle-tr/cenacle-}proxy${CENACLE_IMAGE_VARIANT:-}:${CENACLE_VERSION}
    read_only: true
    # Caddy exits without a message on a configuration error, so the missing
    # e-mail address is named here first.
    command:
      - sh
      - -c
      - |
        case "$$CENACLE_TLS_MODE" in acme | acme-ca)
          if [ -z "$$ACME_EMAIL" ]; then
            echo "set ACME_EMAIL in .env.prod: it is required with CENACLE_TLS_MODE=$$CENACLE_TLS_MODE" >&2
            exit 1
          fi ;;
        esac
        if [ "$$CENACLE_TLS_MODE" = acme-ca ] && [ -z "$$CENACLE_ACME_CA" ]; then
          echo "set CENACLE_ACME_CA in .env.prod: the ACME directory URL of CENACLE_TLS_MODE=acme-ca" >&2
          exit 1
        fi
        if [ "$${CENACLE_ACME_CA_ROOT:-system}" = file ] && [ ! -s /certs/acme-ca.pem ]; then
          echo "put the ACME service's root certificate into certs/acme-ca.pem (CENACLE_ACME_CA_ROOT=file)" >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    environment:
      CENACLE_DOMAIN: ${CENACLE_DOMAIN:?set CENACLE_DOMAIN, e.g. chat.example.com}
      CENACLE_ID_DOMAIN: ${CENACLE_ID_DOMAIN:?set CENACLE_ID_DOMAIN, e.g. id.example.com}
      # Required with CENACLE_TLS_MODE=acme and acme-ca only (the proxy does not start without it).
      ACME_EMAIL: ${ACME_EMAIL:-}
      CENACLE_TLS_MODE: ${CENACLE_TLS_MODE:-acme}
      # CENACLE_TLS_MODE=acme-ca only: the ACME directory, and file for certs/acme-ca.pem.
      CENACLE_ACME_CA: ${CENACLE_ACME_CA:-}
      CENACLE_ACME_CA_ROOT: ${CENACLE_ACME_CA_ROOT:-system}
      CENACLE_S3_BUCKET: ${CENACLE_S3_BUCKET:-cenacle-files}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Own certificates for CENACLE_TLS_MODE=files (tls.crt, tls.key), or the root of the
      # ACME service of acme-ca (acme-ca.pem).
      - ./certs:/certs:ro
    tmpfs: [/tmp]
    networks: [edge, files]
    depends_on: [web, server, idp, garage]
    # Caddy is running with its configuration (a listener inside the container
    # only); it does not check the certificates or the services behind it.
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/healthz]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    <<: *hardening
    image: ${CENACLE_IMAGE_PREFIX:-ghcr.io/cenacle-tr/cenacle-}web:${CENACLE_VERSION}
    read_only: true
    tmpfs: [/tmp, /data, /config]
    environment:
      # An upload origin other than the app's (CENACLE_S3_UPLOAD_URL), allowed in
      # the content security policy, e.g. https://s3.example.com.
      CENACLE_UPLOAD_ORIGIN: ${CENACLE_UPLOAD_ORIGIN:-}
    # The desktop app's installers and update files (docs/install/desktop.md).
    volumes:
      - ${CENACLE_DOWNLOADS_DIR:-./downloads}:/downloads:ro
    networks: [edge]

  migrate:
    <<: *hardening
    restart: 'no'
    image: *server-image
    command: [migrate, up]
    read_only: true
    tmpfs: [/tmp]
    environment: &server-env
      CENACLE_ENV: production
      CENACLE_DATABASE_URL_FILE: /run/secrets/chat_database_url
      CENACLE_VALKEY_ADDR: valkey:6379
      CENACLE_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
    secrets: &server-secrets [chat_database_url, valkey_password]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  server:
    <<: *hardening
    image: *server-image
    command: [serve]
    # The drain delay plus the graceful shutdown.
    stop_grace_period: 30s
    read_only: true
    # Archive exports and imports are staged in /tmp (memory); raise the size for
    # large ones or mount a volume there (docs/install).
    tmpfs: ['/tmp:size=${CENACLE_TMP_SIZE:-1g}']
    environment:
      <<: *server-env
      CENACLE_PUBLIC_URL: https://${CENACLE_DOMAIN}
      CENACLE_TRUST_PROXY: 'true'
      CENACLE_OIDC_ISSUER: https://${CENACLE_ID_DOMAIN}
      # Server-to-IdP requests stay inside the Compose network.
      CENACLE_OIDC_BACKCHANNEL_URL: http://idp:8190
      CENACLE_OIDC_CLIENT_SECRET_FILE: /run/secrets/chat_client_secret
      CENACLE_LOG_LEVEL: ${CENACLE_LOG_LEVEL:-info}
      CENACLE_SESSION_IDLE_TIMEOUT: ${CENACLE_SESSION_IDLE_TIMEOUT:-none}
      CENACLE_SESSION_MAX_AGE: ${CENACLE_SESSION_MAX_AGE:-none}
      CENACLE_AUDIT_RETENTION: ${CENACLE_AUDIT_RETENTION:-none}
      CENACLE_AI_REQUEST_RETENTION: ${CENACLE_AI_REQUEST_RETENTION:-none}
      CENACLE_LINK_PREVIEW_RETENTION: ${CENACLE_LINK_PREVIEW_RETENTION:-none}
      CENACLE_WEB_APP: ${CENACLE_WEB_APP:-}
      CENACLE_DESKTOP_MIN_VERSION: ${CENACLE_DESKTOP_MIN_VERSION:-}
      CENACLE_ADMIN_EMAIL: ${CENACLE_ADMIN_EMAIL:-}
      CENACLE_ANNOUNCEMENT_CHANNEL: ${CENACLE_ANNOUNCEMENT_CHANNEL-Central}
      CENACLE_DEFAULT_CHANNELS: ${CENACLE_DEFAULT_CHANNELS-General}
      # Private networks bots may be reached in (slash commands, event deliveries).
      CENACLE_EGRESS_ALLOW: ${CENACLE_EGRESS_ALLOW:-}
      # Plain http:// addresses for those requests (off: https only).
      CENACLE_EGRESS_ALLOW_HTTP: ${CENACLE_EGRESS_ALLOW_HTTP:-false}
      # Previews of links in messages; turn off for servers without internet access.
      CENACLE_LINK_PREVIEWS: ${CENACLE_LINK_PREVIEWS:-true}
      CENACLE_DATABASE_MAX_CONNS: ${CENACLE_DATABASE_MAX_CONNS:-25}
      CENACLE_AI_URL: ${CENACLE_AI_URL:-}
      CENACLE_AI_MODEL: ${CENACLE_AI_MODEL:-}
      CENACLE_AI_EMBEDDING_MODEL: ${CENACLE_AI_EMBEDDING_MODEL:-}
      CENACLE_AI_API_KEY: ${CENACLE_AI_API_KEY:-}
      CENACLE_AI_API_KEY_FILE: /run/secrets/ai_api_key
      CENACLE_AI_TIMEOUT: ${CENACLE_AI_TIMEOUT:-2m}
      CENACLE_AI_POLICY_URL: ${CENACLE_AI_POLICY_URL:-}
      CENACLE_PRIVACY_URL: ${CENACLE_PRIVACY_URL:-}
      CENACLE_SOURCE_URL: ${CENACLE_SOURCE_URL:-https://github.com/Cenacle-TR/cenacle}
      # Files: the bundled Garage (or set an S3 service of your own), Azure Blob
      # Storage (CENACLE_FILES_BACKEND=azure) or a directory (dir).
      CENACLE_FILES_BACKEND: ${CENACLE_FILES_BACKEND:-}
      CENACLE_AZURE_ACCOUNT: ${CENACLE_AZURE_ACCOUNT:-}
      CENACLE_AZURE_CONTAINER: ${CENACLE_AZURE_CONTAINER:-cenacle-files}
      CENACLE_AZURE_ENDPOINT: ${CENACLE_AZURE_ENDPOINT:-}
      CENACLE_AZURE_KEY_FILE: /run/secrets/azure_key
      # The dir backend keeps files on the files-data volume.
      CENACLE_FILES_DIR: ${CENACLE_FILES_DIR:-/data/files}
      CENACLE_S3_ENDPOINT: ${CENACLE_S3_ENDPOINT-http://garage:3900}
      CENACLE_S3_REGION: ${CENACLE_S3_REGION:-garage}
      CENACLE_S3_BUCKET: ${CENACLE_S3_BUCKET:-cenacle-files}
      CENACLE_S3_UPLOAD_URL: ${CENACLE_S3_UPLOAD_URL:-}
      CENACLE_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      CENACLE_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      CENACLE_FILES_MAX_SIZE_MB: ${CENACLE_FILES_MAX_SIZE_MB:-100}
      # Optional virus scanning with a clamd (e.g. the "clamav" profile).
      CENACLE_CLAMAV_ADDR: ${CENACLE_CLAMAV_ADDR:-}
      # Rolling restarts: /readyz fails this long before the server stops.
      CENACLE_DRAIN_DELAY: ${CENACLE_DRAIN_DELAY:-5s}
      # E-mail about missed mentions and direct messages (empty host: no e-mail).
      CENACLE_SMTP_HOST: ${CENACLE_SMTP_HOST:-}
      CENACLE_SMTP_PORT: ${CENACLE_SMTP_PORT:-587}
      CENACLE_SMTP_SECURITY: ${CENACLE_SMTP_SECURITY:-starttls}
      CENACLE_SMTP_USERNAME: ${CENACLE_SMTP_USERNAME:-}
      CENACLE_SMTP_PASSWORD: ${CENACLE_SMTP_PASSWORD:-}
      CENACLE_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      CENACLE_SMTP_FROM: ${CENACLE_SMTP_FROM:-}
      # Web push through the browsers' push services (needs internet access).
      CENACLE_WEB_PUSH: ${CENACLE_WEB_PUSH:-false}
      CENACLE_WEB_PUSH_SUBJECT: ${CENACLE_WEB_PUSH_SUBJECT:-}
    secrets:
      [
        chat_database_url,
        valkey_password,
        chat_client_secret,
        s3_access_key,
        s3_secret_key,
        smtp_password,
        ai_api_key,
        azure_key,
      ]
    volumes:
      # Files of CENACLE_FILES_BACKEND=dir (unused otherwise).
      - files-data:/data/files
    networks: [edge, data, files]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      garage: { condition: service_healthy }

  idp-migrate:
    <<: *hardening
    restart: 'no'
    image: &idp-image ${CENACLE_IMAGE_PREFIX:-ghcr.io/cenacle-tr/cenacle-}idp${CENACLE_IMAGE_VARIANT:-}:${CENACLE_VERSION}
    command: [node, dist/cli.js, migrate, up]
    read_only: true
    environment:
      IDP_DATABASE_URL_FILE: /run/secrets/idp_database_url
    secrets: [idp_database_url]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  idp:
    <<: *hardening
    image: *idp-image
    read_only: true
    tmpfs: [/tmp]
    environment:
      IDP_ENV: production
      IDP_ISSUER: https://${CENACLE_ID_DOMAIN}
      IDP_COOKIE_DOMAIN: ${IDP_COOKIE_DOMAIN:-}
      # One proxy (Caddy) in front of Cenacle ID.
      IDP_TRUST_PROXY: '1'
      IDP_DATABASE_URL_FILE: /run/secrets/idp_database_url
      IDP_KEY_ENCRYPTION_KEY_FILE: /run/secrets/idp_key_encryption_key
      IDP_COOKIE_KEYS_FILE: /run/secrets/idp_cookie_keys
      IDP_CLIENTS_FILE: /etc/cenacle/clients.json
      IDP_LOGIN_RATE_LIMIT: ${IDP_LOGIN_RATE_LIMIT:-10}
      # A notice people accept before signing in (STIG notice and consent banner).
      IDP_SIGNIN_NOTICE: ${IDP_SIGNIN_NOTICE:-}
      # The privacy policy linked at the foot of the sign-in and account pages.
      IDP_PRIVACY_URL: ${IDP_PRIVACY_URL:-${CENACLE_PRIVACY_URL:-}}
      IDP_LOG_LEVEL: ${IDP_LOG_LEVEL:-info}
      IDP_DATABASE_POOL_MAX: ${IDP_DATABASE_POOL_MAX:-}
      IDP_KEY_RETIRED_GRACE_SECONDS: ${IDP_KEY_RETIRED_GRACE_SECONDS:-}
      # Used inside clients.json (${CENACLE_DOMAIN}).
      CENACLE_DOMAIN: ${CENACLE_DOMAIN}
    secrets: [idp_database_url, idp_key_encryption_key, idp_cookie_keys, chat_client_secret]
    volumes:
      - ./idp/clients.json:/etc/cenacle/clients.json:ro
    networks: [edge, data]
    depends_on:
      idp-migrate: { condition: service_completed_successfully }

  postgres:
    <<: *hardening
    # PostgreSQL with pgvector (deploy/compose/postgres/Dockerfile, ADR 0055).
    image: ${CENACLE_IMAGE_PREFIX:-ghcr.io/cenacle-tr/cenacle-}postgres:${CENACLE_VERSION}
    # The entrypoint drops to the postgres user; it needs these capabilities to do so.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      CHAT_DB_NAME: cenacle_chat
      CHAT_DB_USER: cenacle_chat
      CHAT_DB_PASSWORD_FILE: /run/secrets/chat_db_password
      IDP_DB_NAME: cenacle_idp
      IDP_DB_USER: cenacle_idp
      IDP_DB_PASSWORD_FILE: /run/secrets/idp_db_password
    secrets: [postgres_password, chat_db_password, idp_db_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    <<: *hardening
    image: valkey/valkey:9.0.6-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
    user: '999:1000'
    read_only: true
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$(cat /run/secrets/valkey_password)" --save 60 1 --appendonly yes
    secrets: [valkey_password]
    volumes:
      - valkey-data:/data
    networks: [data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'valkey-cli -a "$$(cat /run/secrets/valkey_password)" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # Files. The data volume is given to Garage's non-root user first.
  garage-volume:
    image: valkey/valkey:9.0.6-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
    restart: 'no'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    user: '0:0'
    entrypoint: [chown, -R, '10003:10003', /var/lib/garage]
    volumes:
      - garage-data:/var/lib/garage
    network_mode: none

  garage:
    <<: *hardening
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    user: '10003:10003'
    read_only: true
    command: [/garage, server, --single-node, --default-bucket]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_BUCKET: ${CENACLE_S3_BUCKET:-cenacle-files}
    # GARAGE_RPC_SECRET, GARAGE_DEFAULT_ACCESS_KEY and GARAGE_DEFAULT_SECRET_KEY
    # (gen-secrets.sh).
    env_file: [secrets/garage.env]
    volumes:
      - ./garage/prod.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    networks: [files]
    depends_on:
      garage-volume: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /garage, status]
      interval: 10s
      timeout: 5s
      retries: 30

  # Optional virus scanning: `--profile clamav` and CENACLE_CLAMAV_ADDR=clamav:3310.
  # ClamAV (GPL) runs as its own service; it downloads signatures from the internet
  # (for air-gapped installs, mirror them; see docs/install).
  clamav:
    <<: *hardening
    profiles: [clamav]
    image: clamav/clamav:1.5.4@sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
    # The entrypoint prepares its directories and drops to the clamav user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    volumes:
      - clamav-data:/var/lib/clamav
    networks: [edge, files]

networks:
  edge: {}
  # Object store traffic: the proxy (uploads), the server and Garage.
  files:
    internal: true
  # No route to the outside world for the databases.
  data:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  valkey-data:
  garage-data:
  files-data:
  clamav-data:

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  chat_db_password: { file: ./secrets/chat_db_password }
  idp_db_password: { file: ./secrets/idp_db_password }
  valkey_password: { file: ./secrets/valkey_password }
  chat_database_url: { file: ./secrets/chat_database_url }
  idp_database_url: { file: ./secrets/idp_database_url }
  idp_key_encryption_key: { file: ./secrets/idp_key_encryption_key }
  idp_cookie_keys: { file: ./secrets/idp_cookie_keys }
  chat_client_secret: { file: ./secrets/chat_client_secret }
  s3_access_key: { file: ./secrets/s3_access_key }
  s3_secret_key: { file: ./secrets/s3_secret_key }
  # Optional (empty unless used): instead of CENACLE_SMTP_PASSWORD / CENACLE_AI_API_KEY.
  smtp_password: { file: ./secrets/smtp_password }
  ai_api_key: { file: ./secrets/ai_api_key }
  # Optional: the account key of Azure Blob Storage (CENACLE_FILES_BACKEND=azure).
  azure_key: { file: ./secrets/azure_key }
