# SPDX-License-Identifier: AGPL-3.0-only
# Cenacle on Kubernetes. PostgreSQL, Valkey and the S3 object store are
# external (operators or managed services); see docs/install/kubernetes.md.

image:
  registry: ghcr.io/cenacle-tr
  # Images are <registry>/<prefix><component>:<tag>.
  prefix: cenacle-
  # Defaults to the chart's appVersion.
  tag: ''
  # FIPS 140-3 images of the server and Cenacle ID (<component>-fips; docs/security/fips.md).
  fips: false
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Single media node only. Calls remain disabled in every workspace after install.
calls:
  enabled: false
  # Empty: <image.registry>/<image.prefix>media:<tag>, like the other images.
  # Any reference works, for example one pinned with @sha256:<digest>.
  image: ''
  publicIP: ''
  # How users reach the media ports (7882/udp, 7881/tcp; TURN's when on):
  #   hostPort     the node's ports, through the CNI's port mapping (default)
  #   loadBalancer a LoadBalancer Service with these ports; its address must be publicIP
  #   hostNetwork  the pod on the node's network (no NAT; filter on the node)
  exposure: hostPort
  loadBalancer:
    loadBalancerIP: ''
    annotations: {}
  # Pin to the node reached by publicIP (not needed with exposure: loadBalancer,
  # but harmless; the pod still runs once).
  nodeSelector: {}
  # Actual media-pod source CIDRs; never 0.0.0.0/0 or ::/0.
  callbackCIDRs: []
  existingSecret: cenacle-calls
  nodeID: media-1
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: '2', memory: 2Gi }
  turn:
    enabled: false
    relayMin: 49152
    relayMax: 49407
    maxAllocations: 256

# Host names (any domain or subdomain).
domain: chat.example.com
idDomain: id.example.com

# A Secret you create with these keys (see docs/install/kubernetes.md):
#   chat-database-url, idp-database-url, valkey-password (may be empty),
#   chat-client-secret, idp-key-encryption-key, idp-cookie-keys,
#   s3-access-key, s3-secret-key (files.backend s3), azure-key (azure)
# and, when used: smtp-password, ai-api-key
# The pods read the required keys as files (/run/secrets/cenacle/<key>); the
# optional ones (valkey-password, smtp-password, ai-api-key) as variables.
existingSecret: cenacle

valkey:
  addr: valkey:6379

s3:
  # Empty: files are off.
  endpoint: ''
  region: garage
  bucket: cenacle-files
  # Where browsers post uploads. Empty: https://<domain>/<bucket>/ through the
  # ingress (s3.ingressBackend must then name the S3 service).
  uploadURL: ''
  # The in-cluster S3 service the ingress sends uploads to (POST /<bucket>/).
  ingressBackend:
    service: ''
    port: 3900

# Azure Blob Storage (files.backend: azure). The account key is the
# "azure-key" key of existingSecret. Browsers upload through the chat server.
azure:
  account: ''
  container: cenacle-files
  # Empty: https://<account>.blob.core.windows.net (set it for other clouds).
  endpoint: ''

admin:
  # The instance administrator's verified e-mail address at Cenacle ID.
  email: ''
  announcementChannel: Central
  defaultChannels: General

files:
  # Where files are kept: s3 (s3.* above), azure (azure.* above), dir (a
  # volume, files.dir below) or off. Empty: s3 when s3.endpoint is set, else off.
  backend: ''
  dir:
    # With backend dir: a ReadWriteMany PersistentVolumeClaim you create, which
    # every server replica mounts at /data/files.
    existingClaim: ''
  maxSizeMB: 100
  # A clamd address (host:port) to scan files; empty: no scanning.
  clamavAddr: ''

# Private networks bots may be reached in (comma-separated).
egressAllow: ''
# Plain http:// addresses for bots' servers, too (false: https only).
egressAllowHTTP: false
# Previews of links in messages (public addresses only); false for air-gapped installs.
linkPreviews: true
# Database connections one chat server keeps (keep replicas × this below max_connections).
databaseMaxConns: 25
# Optional AI: an OpenAI-compatible API of a model you run (empty: no AI).
# Its API key, if it wants one, is the "ai-api-key" key of existingSecret.
ai:
  url: ''
  model: ''
  # Longest wait for an answer.
  timeout: 2m
  # Your page on how the model server keeps requests, linked from the AI notice.
  policyUrl: ''

# E-mail about missed mentions and direct messages; empty host: no e-mail.
# The password is the "smtp-password" key of existingSecret (optional).
smtp:
  host: ''
  port: 587
  # starttls (587), tls (465) or none (a relay on a trusted network)
  security: starttls
  username: ''
  from: ''

# Web push through the browsers' push services (needs internet access).
webPush:
  enabled: false
  # A contact for the push services: mailto: or https: (default: the admin's e-mail)
  subject: ''

server:
  replicas: 2
  # /readyz fails this long before a pod stops (rolling upgrades).
  drainDelay: 10s
  # debug, info, warn or error
  logLevel: info
  # Signed-in devices end after this long unused, and at the latest after the
  # maximum age (durations such as 168h and 720h); none: until people sign out.
  sessionIdleTimeout: none
  sessionMaxAge: none
  # How long the audit log, records of AI requests and link previews are kept
  # (durations such as 8760h); none: kept. An hourly job deletes older ones.
  auditRetention: none
  aiRequestRetention: none
  linkPreviewRetention: none
  # on or off overrides the administrators' web app setting (recovery); empty
  # leaves it to them.
  webApp: ''
  # The oldest desktop app accepted, e.g. 0.30.0; empty: any.
  desktopMinVersion: ''
  # Your privacy policy for this server, linked from Settings in the apps.
  privacyUrl: ''
  # The source code of this server, linked from Settings (AGPL-3.0 section 13); change
  # it only if you run a changed Cenacle.
  sourceUrl: https://github.com/Cenacle-TR/cenacle
  # The largest /tmp, where archive exports and imports are staged.
  tmpSize: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  # Empty: replicas prefer different nodes.
  affinity: {}

# The migration jobs that run before installs and upgrades.
migrations:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

idp:
  replicas: 1
  loginRateLimit: 10
  # fatal, error, warn, info, debug or trace
  logLevel: info
  # Database connections each Cenacle ID pod keeps.
  databasePoolMax: 10
  # How long a rotated-out signing key stays published, in seconds (7 days).
  keyRetiredGraceSeconds: 604800
  # A notice people accept before signing in (STIG notice and consent banner).
  signinNotice: ''
  # The privacy policy linked at the foot of the sign-in and account pages; empty:
  # server.privacyUrl.
  privacyUrl: ''
  # Share Cenacle ID cookies across subdomains, e.g. example.com.
  cookieDomain: ''
  # The proxies in front of Cenacle ID whose X-Forwarded-For counts: the number
  # of hops (1: the ingress controller; 2 with a load balancer that appends to
  # it in front), or their addresses and CIDR ranges, comma-separated.
  trustProxy: '1'
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  # Empty: replicas prefer different nodes.
  affinity: {}

web:
  replicas: 2
  # The desktop app's installers and update files, served at /downloads/
  # (docs/install/desktop.md): the name of a PersistentVolumeClaim holding a
  # desktop/ folder, mounted read-only. Empty: no downloads.
  downloadsClaim: ''
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  nodeSelector: {}
  tolerations: []
  # Empty: replicas prefer different nodes.
  affinity: {}

ingress:
  enabled: true
  className: ''
  annotations: {}
  # e.g. [{ secretName: cenacle-tls, hosts: [chat.example.com, id.example.com] }]
  tls: []

metrics:
  # Prometheus metrics on port 9090 (server) and 9091 (Cenacle ID).
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s

# OTLP endpoint for traces, e.g. http://tempo:4318; empty: no tracing.
otlpEndpoint: ''
traceSampleRatio: '0.1'

podDisruptionBudget:
  enabled: true

networkPolicy:
  # Only the ingress controller reaches the pods. With enabled, set the labels of its
  # namespace (required), e.g. Traefik of k3s:
  #   matchLabels: { kubernetes.io/metadata.name: kube-system }
  # Traefik's own chart: traefik; ingress-nginx: ingress-nginx.
  enabled: false
  ingressNamespaceSelector: {}
