{{- $name := printf "%s-web" (include "cenacle.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "cenacle.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "cenacle.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cenacle.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # No Kubernetes API access: no service account token in the pod.
      automountServiceAccountToken: false
      securityContext:
        {{- include "cenacle.podSecurity" 10001 | nindent 8 }}
      containers:
        - name: web
          image: {{ include "cenacle.image" (dict "root" . "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "cenacle.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          {{- if and (eq (include "cenacle.filesBackend" .) "s3") .Values.s3.uploadURL }}
          {{- $upload := urlParse .Values.s3.uploadURL }}
          env:
            # Browsers upload to another origin: the content security policy allows it.
            - { name: CENACLE_UPLOAD_ORIGIN, value: {{ printf "%s://%s" $upload.scheme $upload.host | quote }} }
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.web.downloadsClaim }}
            - { name: downloads, mountPath: /downloads, readOnly: true }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - { name: data, emptyDir: {} }
        - { name: config, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        {{- if .Values.web.downloadsClaim }}
        - name: downloads
          persistentVolumeClaim: { claimName: {{ .Values.web.downloadsClaim | quote }}, readOnly: true }
        {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "cenacle.affinity" (dict "root" . "component" "web") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "cenacle.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "cenacle.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
