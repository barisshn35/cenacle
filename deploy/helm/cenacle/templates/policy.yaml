{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "server" "web" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-%s" (include "cenacle.fullname" $) $component }}
  labels:
    {{- include "cenacle.labels" $ | nindent 4 }}
spec:
  maxUnavailable: 1
  # A pod that is not ready may always be evicted: it cannot block draining a node.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "cenacle.selector" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.ingressNamespaceSelector }}
{{- fail "networkPolicy.ingressNamespaceSelector: set the labels of your ingress controller's namespace (docs/install/kubernetes.md)" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cenacle.fullname" . }}
  labels:
    {{- include "cenacle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    # The ingress controller reaches the web, server and Cenacle ID.
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports: [{ port: 8180 }, { port: 8190 }, { port: 8080 }, { port: 7880 }]
    # The pods reach each other (back-channel logout, metrics scraping in-release).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{ port: 8180 }, { port: 8190 }, { port: 8080 }, { port: 9090 }, { port: 7880 }]
{{- end }}
{{- if and .Values.calls.enabled .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cenacle.fullname" . }}-call-control
spec:
  podSelector:
    matchLabels:
      {{- include "cenacle.selector" (dict "root" . "component" "server") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cenacle.selector" (dict "root" . "component" "media") | nindent 14 }}
      ports: [{ port: 7883 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cenacle.fullname" . }}-media-peers
spec:
  podSelector:
    matchLabels:
      {{- include "cenacle.selector" (dict "root" . "component" "media") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Public media peers are expected endpoints, not third-party services.
    - ports:
        - { port: 7881, protocol: TCP }
        - { port: 7882, protocol: UDP }
        {{- if .Values.calls.turn.enabled }}
        - { port: 3478, protocol: UDP }
        - { port: 5349, protocol: TCP }
        - { port: {{ .Values.calls.turn.relayMin }}, endPort: {{ .Values.calls.turn.relayMax }}, protocol: UDP }
        {{- end }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- range $component := list "server" "idp" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "%s-%s" (include "cenacle.fullname" $) $component }}
  labels:
    {{- include "cenacle.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cenacle.selector" (dict "root" $ "component" $component) | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ $.Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
