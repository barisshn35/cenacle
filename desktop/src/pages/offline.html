<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'"
    />
    <title>Cenacle</title>
    <link rel="stylesheet" href="style.css" />
    <script src="offline.js" defer></script>
  </head>
  <body>
    <div class="si">
      <header class="top">
        <svg aria-hidden="true" viewBox="0 0 48 48">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="6.5"
            stroke-linecap="round"
            d="M10 41V22A14 14 0 0 1 38 22V41"
          />
          <path
            fill="#C9A24B"
            d="M17.5 33V25.5A5.5 5.5 0 0 1 23 20H25A5.5 5.5 0 0 1 30.5 25.5V27.5A5.5 5.5 0 0 1 25 33Z"
          /></svg
        ><span>Cenacle</span>
      </header>
      <main>
        <section role="status">
          <h1 id="title"></h1>
          <p class="lede" id="lede"></p>
          <div class="actions">
            <button class="primary" id="retry" type="button"></button>
            <button class="secondary" id="change" type="button"></button>
          </div>
        </section>
      </main>
      <footer>Cenacle</footer>
    </div>
  </body>
</html>
