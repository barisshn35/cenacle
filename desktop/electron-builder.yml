# SPDX-License-Identifier: AGPL-3.0-only
# Packages of the desktop app: Windows (NSIS) and Linux (AppImage, deb, rpm),
# x64 and arm64. macOS comes later. Updates are published under the paired
# server's /downloads/desktop/ (see docs/install/desktop.md).
appId: org.cenacle.desktop
productName: Cenacle
copyright: Cenacle contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - assets/**
  - package.json
asar: true
# Cenacle's license and those of the packages inside the app, next to Electron's
# own (LICENSE.electron.txt, LICENSES.chromium.html).
extraResources:
  - from: ../LICENSE
    to: LICENSE.txt
  - from: dist/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  # Spell checker dictionaries (src/spellcheck.ts): nothing is downloaded.
  - from: dictionaries
    to: dictionaries
    filter: ['*.bdic', NOTICE.txt]
afterPack: scripts/fuses.mjs
protocols:
  - name: Cenacle
    schemes: [cenacle]
publish:
  provider: generic
  url: https://example.invalid/downloads/desktop
win:
  executableName: Cenacle
  # One installer for both architectures: it installs the one of the computer
  # (and latest.yml names one file for the updater).
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: Cenacle-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Uninstalling removes the app's data (%APPDATA%\Cenacle: server, settings,
  # session), so a reinstall asks to sign in again; updates keep it.
  deleteAppDataOnUninstall: true
  installerLanguages: [en_US, tr_TR]
  # Pictures from scripts/installer-art.mjs; additions in build/installer.nsh.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
linux:
  executableName: cenacle
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  category: Network;InstantMessaging
  icon: build/icons
  maintainer: Cenacle contributors
  synopsis: Team chat on your own server
  artifactName: Cenacle-${version}-${arch}.${ext}
  desktop:
    entry:
      MimeType: x-scheme-handler/cenacle
# Setting depends replaces electron-builder's list, so it is all here: what
# Electron needs on a minimal system, notifications and the keyring. The
# 64-bit time names come first, or apt may take an ALSA stand-in (Ubuntu 24.04).
deb:
  depends:
    [
      libgtk-3-0t64 | libgtk-3-0,
      libnss3,
      libxss1,
      libxtst6,
      libatspi2.0-0t64 | libatspi2.0-0,
      libuuid1,
      libgbm1,
      libasound2t64 | libasound2,
      xdg-utils,
      libnotify4,
      libsecret-1-0,
    ]
rpm:
  depends:
    [
      gtk3,
      nss,
      libXScrnSaver,
      libXtst,
      at-spi2-core,
      libuuid,
      mesa-libgbm,
      alsa-lib,
      xdg-utils,
      libnotify,
      libsecret,
    ]
