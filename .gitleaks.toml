# gitleaks configuration: the default rules plus exact-match exceptions for
# values that are public on purpose. Each exception matches one full finding,
# so any other secret (even in the same file) is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Development-only values in .env.example"
regexTarget = "match"
regexes = [
  # base64 of "dev-only-key-encryption-key-32b!"
  '''^IDP_KEY_ENCRYPTION_KEY=ZGV2LW9ubHkta2V5LWVuY3J5cHRpb24ta2V5LTMyYiE=$''',
]

[[allowlists]]
description = "Fake secrets returned by mocked APIs in end-to-end tests"
regexTarget = "line"
regexes = [
  '''json: \{ token, secret: 'cnb_rotated-0123456789' \}''',
]

[[allowlists]]
description = "Azurite's published development account key (the Azure Storage emulator)"
regexTarget = "match"
regexes = [
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
]

[[allowlists]]
description = "Test vector of the escrow format (a key made for the test only)"
regexTarget = "match"
regexes = [
  '''25f93aaaba1ce1fc4a0577859c7916c997fbca9856b3aee62b1fa084abad2721''',
]
