version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        json_tags_case_style: snake
        overrides:
          - db_type: timestamptz
            go_type: time.Time
