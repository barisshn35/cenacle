      operationId: createGuestLink
      summary: Let someone from outside join this channel for a while, with a password
      description: |
        The channel's managers, when the workspace's permission scheme lets their role
        (guest_links). The link is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expires_in_hours, password]
              properties:
                name: { type: string, maxLength: 80, description: Who or what the link is for. }
                expires_in_hours: { type: integer, minimum: 1, maximum: 720 }
                password: { type: string, minLength: 8, maxLength: 200 }
                max_uses: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '201':
          description: The link, with its token (shown only now).
          content:
            application/json:
              schema:
                type: object
                required: [link, token]
                properties:
                  link: { $ref: '#/components/schemas/GuestLink' }
                  token: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/channels/{channel_id}/guest-links/{link_id}:
    parameters:
      - { name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: link_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [chat]
      operationId: revokeGuestLink
      summary: End a guest link; the people who came with it leave
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/guest-links/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, maxLength: 100 } }
    get:
      tags: [chat]
      operationId: getGuestLink
      summary: What a guest link leads to (no sign-in)
      security: []
      responses:
        '200':
          description: The channel and whether the link can be used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestLinkPreview' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [chat]
      operationId: joinGuestLink
      summary: Join the channel of a guest link with its password (no sign-in)
      description: |
        Starts a session that ends with the link (its expiry or revocation). Wrong
        passwords are limited per link and address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, description: Your name as others see it. }
                password: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Joined; the session cookie is set.
          content:
            application/json:
              schema:
                type: object
                required: [channel_id]
                properties:
                  channel_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/e2e/devices:
    get:
      tags: [chat]
      operationId: listE2EDevices
      summary: This person's devices that hold end-to-end encryption keys
      responses:
        '200':
          description: Active devices, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/E2EDevice' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [chat]
      operationId: registerE2EDevice
      summary: Register this device's signing key for encrypted channels
      description: |
        The private key stays on the device. Up to 20 active devices per person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, signature_key]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, description: 'How the device is called, e.g. "Firefox on Linux".' }
                signature_key: { type: string, format: byte, description: The Ed25519 public key (32 bytes). }
      responses:
        '201':
          description: The device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E2EDevice' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/e2e/devices/{device_id}:
    parameters:
      - { name: device_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [chat]
      operationId: revokeE2EDevice
      summary: Remove a device; the groups it is in remove it with their next change
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/users/{user_id}/e2e/devices:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [chat]
      operationId: listUserE2EDevices
      summary: Someone's devices and their public keys (to verify them)
      responses:
        '200':
          description: Devices, oldest first, removed ones with revoked_at.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/E2EDevice' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/channels/{channel_id}/e2e:
    parameters:
      - { name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [chat]
      operationId: getMLSGroup
      summary: The channel's MLS group as the delivery service keeps it (members)
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MLSGroup' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [chat]
      operationId: enableMLS
      summary: Turn on end-to-end encryption with device keys (cannot be turned off)
      description: |
        The channel's managers (in conversations, any participant). The device that
        turns it on made the group (epoch 0) and sends its GroupInfo; the others
        join on their own with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, group_info]
              properties:
                device_id: { type: string, format: uuid }
                group_info: { type: string, format: byte, maxLength: 700000 }
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MLSGroup' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/channels/{channel_id}/e2e/commits:
    parameters:
      - { name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [chat]
      operationId: listMLSCommits
      summary: The group's commits from an epoch on, in order (up to 100)
      parameters:
        - { name: from_epoch, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: Commits.
          content:
            application/json:
              schema:
                type: object
                required: [commits]
                properties:
                  commits:
                    type: array
                    items: { $ref: '#/components/schemas/MLSCommit' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [chat]
      operationId: sendMLSCommit
      summary: Move the group to the next epoch
      description: |
        Accepted only while the group is at `epoch`; otherwise 409 (another commit came
        first: apply it and try again). `joined` is set for an external commit by which
        `device_id` joins; `removed` lists the devices the commit removes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, epoch, commit, group_info]
              properties:
                device_id: { type: string, format: uuid }
                epoch: { type: integer, format: int64, minimum: 0 }
                commit: { type: string, format: byte, maxLength: 700000 }
                group_info: { type: string, format: byte, maxLength: 700000 }
                joined: { type: boolean, default: false }
                removed:
                  type: array
                  maxItems: 1000
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: The group at its new epoch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MLSGroup' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/channels/{channel_id}/e2e/backups:
    parameters:
      - { name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [chat]
      operationId: listE2EBackups
      summary: This person's history backups of the channel (sealed with their recovery key)
      parameters:
        - { name: after, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Up to 50 backups, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  backups:
                    type: array
                    items:
                      type: object
                      required: [id, data]
                      properties:
                        id: { type: string, format: uuid }
                        data: { type: string, format: byte }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [chat]
      operationId: addE2EBackup
      summary: Keep texts this device read, sealed with the recovery key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, format: byte, maxLength: 1400000 }
      responses:
        '204': { description: Kept. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
  /api/e2e/recovery:
    get:
      tags: [chat]
      operationId: getE2ERecovery
      summary: Whether this person has a recovery key, and the organization's escrow key
      responses:
        '200':
          description: The recovery state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E2ERecovery' }
        '401': { $ref: '#/components/responses/Problem' }
    put:
      tags: [chat]
      operationId: setE2ERecovery
      summary: Set a new recovery key (earlier backups are deleted)
      description: |
        `verifier` is HMAC-SHA-256(recovery key, "cenacle-recovery-check"). With an
        escrow key, `escrow` is the recovery key sealed for it and is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verifier]
              properties:
                verifier: { type: string, format: byte }
                escrow: { type: string, format: byte }
                escrow_key_id: { type: string, maxLength: 64 }
      responses:
        '200':
          description: The recovery state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E2ERecovery' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [chat]
      operationId: deleteE2ERecovery
      summary: Forget the recovery key and delete its backups
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
  /api/admin/e2e/escrow:
    put:
      tags: [admin]
      operationId: setE2EEscrowKey
      summary: Require recovery keys to be sealed for the organization's key (instance administrators)
      description: |
        A P-256 public key (SPKI, DER). People set a new recovery key after it changes.
        The private key stays offline; server e2e-escrow opens backups with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_id, public_key]
              properties:
                key_id: { type: string, minLength: 1, maxLength: 64 }
                public_key: { type: string, format: byte, maxLength: 700 }
      responses:
        '200':
          description: The escrow key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E2EEscrowKey' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [admin]
      operationId: deleteE2EEscrowKey
      summary: Stop requiring escrow (instance administrators)
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/channels/{channel_id}/messages/{message_id}/spillage:
    parameters:
      - { name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: message_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [compliance]
      operationId: reportSpillage
      summary: Report that a message holds what must not be here (data spillage)
      description: The workspace's spillage reviewers decide; the message stays until then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Reported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpillageReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/workspaces/{workspace_id}/spillage:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [compliance]
      operationId: listSpillageReports
      summary: Spillage reports of the workspace (its spillage reviewers)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, removed, dismissed] } }
      responses:
        '200':
          description: Reports, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports:
                    type: array
                    items: { $ref: '#/components/schemas/SpillageReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/workspaces/{workspace_id}/spillage-reviewers:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [compliance]
      operationId: setSpillageReviewers
      summary: Choose who reviews spillage reports (owners); empty means the owners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Changed. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/spillage/{report_id}/decision:
    parameters:
      - { name: report_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [compliance]
      operationId: decideSpillage
      summary: Remove the message everywhere, or dismiss the report (spillage reviewers)
      description: |
        Removal empties the message, its edits, reactions, mentions, saved copies and
        files, also where a legal hold would keep it, tells every device and shared
        server to drop it, and writes the incident report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [remove, dismiss] }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpillageReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/spillage/{report_id}/incident:
    parameters:
      - { name: report_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [compliance]
      operationId: getSpillageIncident
      summary: The incident report of a decided spillage report (spillage reviewers)
      responses:
        '200':
          description: What happened, who could see it and what was removed (never the content).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/workspaces/{workspace_id}/archive:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [compliance]
      operationId: exportArchive
      summary: The workspace's messages of a period in an archive format (owners)
      parameters:
        - { name: format, in: query, required: true, schema: { $ref: '#/components/schemas/ArchiveFormat' } }
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: until, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: CSV, Actiance XML, or a ZIP of EML files.
          content:
            text/csv: { schema: { type: string } }
            application/xml: { schema: { type: string } }
            application/zip: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/workspaces/{workspace_id}/archive-schedule:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [compliance]
      operationId: getArchiveSchedule
      summary: Daily archive exports of the workspace and the files made (owners)
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveSchedule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [compliance]
      operationId: setArchiveSchedule
      summary: Turn daily archive exports on (in a format) or off (owners)
      description: Needs the object store; each day's file is written after the day ends (UTC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [off, csv, actiance, eml] }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveSchedule' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/archive-exports/{export_id}:
    parameters:
      - { name: export_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [compliance]
      operationId: downloadArchiveExport
      summary: Download a daily archive export (owners)
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
    get:
      tags: [workspaces]
      operationId: getInvite
      summary: What an invitation leads to
      responses:
        '200':
          description: The workspace and whether the invitation can be used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/invites/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
    post:
      tags: [workspaces]
      operationId: acceptInvite
      summary: Join the workspace of an invitation
      responses:
        '200':
          description: Member (also when already one).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
  /api/auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Start sign-in with Cenacle ID
      description: |
        Redirects the browser to Cenacle ID (authorization code flow with PKCE).
        After sign-in the browser returns to `return_to`. If Cenacle ID cannot be
        reached, it redirects to `/signin?error=unavailable` instead.
      security: []
      parameters:
        - name: return_to
          in: query
          description: Path inside the app to open after sign-in (default `/`).
          schema: { type: string, maxLength: 2048 }
        - name: desktop
          in: query
          description: |
            Sign-in of the desktop app, in its own window: the S256 challenge
            (base64url, 43 characters) of a verifier the app keeps. Instead of a
            cookie, the sign-in ends at `/desktop/signed-in?code=<code>`, which the
            app exchanges at `POST /api/auth/desktop/token`. Allowed while the web
            app is turned off.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '302':
          description: Redirect to the authorization endpoint of Cenacle ID.
  /api/auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: Finish sign-in (redirect target of Cenacle ID)
      description: |
        Exchanges the authorization code, creates the session and sets the
        session cookie, then redirects to the saved `return_to`. On failure it
        redirects to `/signin?error=<code>`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirect into the app.
  /api/auth/desktop/token:
    post:
      tags: [auth]
      operationId: desktopToken
      summary: The desktop app's session for the code of its sign-in
      description: |
        Exchanges the one-time code of a desktop sign-in (valid for a minute)
        with the verifier of the challenge given at `/api/auth/login?desktop=`.
        The session token is sent as `Authorization: Bearer` from then on.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, verifier]
              properties:
                code: { type: string, maxLength: 128 }
                verifier: { type: string, minLength: 43, maxLength: 128 }
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Problem' }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: |
        Ends the session and clears the cookie. The response names the
        Cenacle ID sign-out page, which the browser can open to end the
        single sign-on session too. Without a session it succeeds as well.
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Logout' }
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The current session and its user
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: Your signed-in devices
      responses:
        '200':
          description: Usable sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceSession' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [auth]
      operationId: endSession
      summary: Sign out one device
      responses:
        '204':
          description: Ended (open connections of that device close).
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/sessions/end-all:
    post:
      tags: [auth]
      operationId: endAllSessions
      summary: Sign out everywhere
      description: Ends every session of the user, or every other one with `keep_current`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep_current]
              properties:
                keep_current: { type: boolean }
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema:
                type: object
                required: [ended]
                properties:
                  ended: { type: integer }
        '401':
          $ref: '#/components/responses/Problem'
  /api/auth/backchannel-logout:
    post:
      tags: [auth]
      operationId: backchannelLogout
      summary: OpenID Connect Back-Channel Logout (called by Cenacle ID)
      description: |
        Cenacle ID posts a signed logout token when a sign-in ends there; the sessions
        that came from that sign-in (`sid`), or from that identity when the token names
        none, end. Not for browsers.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token: { type: string }
      responses:
        '200':
          description: Accepted.
        '400':
          description: The logout token is invalid.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  error_description: { type: string }
  /api/workspaces/{workspace_id}/audit:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listWorkspaceAudit
      summary: The workspace's audit log (owners and admins)
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
          description: Events older than this one (cursor).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: prefix
          in: query
          schema: { type: string, maxLength: 60 }
          description: Only actions starting with this (federation. for the federation activity).
      responses:
        '200':
          description: Events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [events, has_more]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  has_more: { type: boolean }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/bots:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listBots
      summary: The workspace's bots (owners and admins)
      responses:
        '200':
          description: Bots.
          content:
            application/json:
              schema:
                type: object
                required: [bots]
                properties:
                  bots:
                    type: array
                    items: { $ref: '#/components/schemas/Bot' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createBot
      summary: Create a bot (owners and admins)
      description: A bot is a member of the workspace that posts through tokens and webhooks; add it to channels like a person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 250 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bot' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [bots]
      operationId: updateBot
      summary: Rename, describe, disable or enable a bot
      description: A disabled bot's tokens and webhooks stop working until it is enabled again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 250 }
                disabled: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bot' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/tokens:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listBotTokens
      summary: The bot's tokens (not their secrets)
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/BotToken' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createBotToken
      summary: Create a token (shown once)
      description: |
        The bot uses it as `Authorization: Bearer cnb_...`. Scopes: `messages:read` (list
        its channels and their messages), `messages:write` (send, react).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: ['messages:read', 'messages:write'] }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [token, secret]
                properties:
                  token: { $ref: '#/components/schemas/BotToken' }
                  secret: { type: string, description: Shown only now. }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/tokens/{token_id}:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: token_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [bots]
      operationId: revokeBotToken
      summary: Revoke a token
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/webhooks:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listWebhooks
      summary: The bot's incoming webhooks
      responses:
        '200':
          description: Webhooks.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createWebhook
      summary: Create an incoming webhook (URL shown once)
      description: The bot joins the channel. `jira` reads Jira's issue and comment events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, channel_id, kind]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                channel_id: { type: string, format: uuid }
                kind: { type: string, enum: [generic, jira, gitlab, alertmanager, github, email] }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, url]
                properties:
                  webhook: { $ref: '#/components/schemas/Webhook' }
                  url: { type: string, description: The secret address; shown only now. }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/webhooks/{webhook_id}:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: webhook_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [bots]
      operationId: deleteWebhook
      summary: Delete a webhook (its URL stops working)
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/hooks/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [bots]
      operationId: postWebhook
      summary: Post into a channel through an incoming webhook
      description: |
        No session: the URL is the secret. A `generic` webhook takes
        `{"text": "Markdown", "attachments": [...]}`; a `jira` webhook takes Jira's
        webhook payloads (issue created, updated, deleted; comment created).
        The message is held to the rules of one the bot sends with its token:
        the channel's broadcast rights, slow mode, the bot's timeout and AutoMod.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Posted (or ignored, for events that say nothing worth posting).
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/commands:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: runCommand
      summary: Run a slash command in a channel
      description: |
        Built-in commands: `/remind`, `/join`, `/leave`, `/topic`, `/shrug`, `/me`. Other
        commands go to the bot that registered them, which answers either only to the
        caller (`ephemeral`) or with a message in the channel (`in_channel`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, description: 'Without the slash, e.g. "remind".' }
                text: { type: string, maxLength: 4000 }
                timezone: { type: string, description: The caller's IANA time zone, for times in /remind. }
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/commands:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listCommands
      summary: Slash commands available in a workspace (for suggestions)
      responses:
        '200':
          description: Commands.
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items: { $ref: '#/components/schemas/CommandInfo' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/commands:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listBotCommands
      summary: A bot's slash commands
      responses:
        '200':
          description: Commands.
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items: { $ref: '#/components/schemas/SlashCommand' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createBotCommand
      summary: Register a slash command (signing secret shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger, url]
              properties:
                trigger: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$' }
                url: { type: string, maxLength: 2000 }
                description: { type: string, maxLength: 200 }
                hint: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [command, secret]
                properties:
                  command: { $ref: '#/components/schemas/SlashCommand' }
                  secret: { type: string }
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/commands/{command_id}:
    parameters:
