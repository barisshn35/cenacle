# SPDX-License-Identifier: Apache-2.0
openapi: 3.0.3
info:
  title: Cenacle chat API
  version: 0.3.0
  description: |
    HTTP API of the Cenacle chat server. Every error is an RFC 9457 problem
    (`application/problem+json`) with a stable `code` and the `request_id`.

    Authentication: the web app uses the `HttpOnly` session cookie set at the end
    of sign-in; other clients send `Authorization: Bearer <session token>`.
    Cookie-authenticated requests that change state must come from the app's own
    origin (`Origin` or `Sec-Fetch-Site: same-origin`).
  license:
    name: Apache-2.0
servers:
  - url: /
tags:
  - name: auth
    description: Sign-in with Cenacle ID and sessions
  - name: chat
    description: Channels and messages
  - name: realtime
    description: Live events over WebSocket
paths:
  /api/auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Start sign-in with Cenacle ID
      description: |
        Redirects the browser to Cenacle ID (authorization code flow with PKCE).
        After sign-in the browser returns to `return_to`. If Cenacle ID cannot be
        reached, it redirects to `/signin?error=unavailable` instead.
      security: []
      parameters:
        - name: return_to
          in: query
          description: Path inside the app to open after sign-in (default `/`).
          schema: { type: string, maxLength: 2048 }
      responses:
        '302':
          description: Redirect to the authorization endpoint of Cenacle ID.
  /api/auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: Finish sign-in (redirect target of Cenacle ID)
      description: |
        Exchanges the authorization code, creates the session and sets the
        session cookie, then redirects to the saved `return_to`. On failure it
        redirects to `/signin?error=<code>`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirect into the app.
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: |
        Ends the session and clears the cookie. The response names the
        Cenacle ID sign-out page, which the browser can open to end the
        single sign-on session too. Without a session it succeeds as well.
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Logout' }
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The current session and its user
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/ws/ticket:
    post:
      tags: [realtime]
      operationId: createWsTicket
      summary: Ticket for opening the WebSocket
      description: |
        Returns a single-use ticket valid for 30 seconds. Open
        `/ws?ticket=<ticket>[&last_event_id=<id>]` with it: browsers cannot send
        an Authorization header on WebSocket connections, and a ticket keeps the
        session token out of URLs and logs.

        WebSocket protocol (JSON text frames, server to client):
        - `{"op":"hello","last_event_id":"<id>","heartbeat_ms":25000}` after connecting;
        - `{"op":"event","id":"<id>","type":"message.created","data":{...}}` for each event,
          in order, starting after `last_event_id` when it was given;
        - `{"op":"resync"}` when the events since `last_event_id` are no longer
          available: reload the data and continue from the id in `hello`.

        Close codes: 4001 invalid ticket, 4003 session ended, 4008 the client
        did not keep up (reconnect and resume).
      responses:
        '201':
          description: Ticket created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WsTicket' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/channels:
    get:
      tags: [chat]
      operationId: listChannels
      summary: Channels the user is a member of
      responses:
        '200':
          description: Mandatory channels first, then by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: createChannel
      summary: Create a channel (administrator only)
      description: |
        The creator becomes a member. A default channel has every user as a
        member, also users who sign in for the first time later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewChannel' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/channels/directory:
    get:
      tags: [chat]
      operationId: listChannelDirectory
      summary: All channels, with membership
      responses:
        '200':
          description: Every channel; `is_member` tells which ones the user belongs to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/join:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: joinChannel
      summary: Join a channel
      responses:
        '200':
          description: Member (also when already a member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/leave:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: leaveChannel
      summary: Leave a channel
      description: Mandatory channels cannot be left (403, code `channel_mandatory`).
      responses:
        '204':
          description: Not a member any more.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/messages:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listMessages
      summary: Messages of a channel, newest page first
      description: |
        Members only (403, code `not_a_member`).

        Cursor pagination: without `before` the newest messages; with `before`
        (a message id) the messages older than it. Each page is in chronological
        order; `has_more` says whether older messages exist.
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: createMessage
      summary: Send a message
      description: |
        Members only. In announcement channels only the administrator can
        send (403, code `read_only_channel`).

        `nonce` is chosen by the client for each message. Sending the same nonce
        again (a retry after a lost response) returns the existing message
        instead of creating a second one. Everyone in the channel receives a
        `message.created` event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMessage' }
      responses:
        '201':
          description: Created (or already created with this nonce).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
security:
  - cookie: []
  - bearer: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: cenacle_session
      description: '`__Host-cenacle_session` when the app is served over https.'
    bearer:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable error code (snake_case).
        request_id: { type: string }
    User:
      type: object
      required: [id, email, email_verified, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        display_name: { type: string }
    Session:
      type: object
      required: [user, permissions, created_at, expires_at, idle_timeout_seconds]
      properties:
        user: { $ref: '#/components/schemas/User' }
        permissions: { $ref: '#/components/schemas/Permissions' }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Absolute end of the session.
        idle_timeout_seconds:
          type: integer
          description: The session also ends after this long without use.
    WsTicket:
      type: object
      required: [ticket, expires_in]
      properties:
        ticket: { type: string }
        expires_in:
          type: integer
          description: Seconds until the ticket expires.
    Channel:
      type: object
      required: [id, name, topic, kind, is_default, is_mandatory, is_member, can_post]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        topic: { type: string }
        kind:
          type: string
          enum: [standard, announcement]
          description: In announcement channels only the administrator can send.
        is_default:
          type: boolean
          description: Every user is a member.
        is_mandatory:
          type: boolean
          description: Members cannot leave.
        is_member: { type: boolean }
        can_post:
          type: boolean
          description: Whether this user can send messages here.
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
    NewChannel:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Display name, unique regardless of case; surrounding spaces are removed.
        topic: { type: string, maxLength: 250 }
        kind:
          type: string
          enum: [standard, announcement]
          default: standard
        is_default:
          type: boolean
          default: false
          description: Make every user, now and later, a member.
    Author:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
    Message:
      type: object
      required: [id, channel_id, author, body, nonce, created_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/Author' }
        body:
          type: string
          description: Message text as typed (Markdown rendering arrives later).
        nonce:
          type: string
          description: The client's nonce, so the sender can match its pending message.
        created_at: { type: string, format: date-time }
    NewMessage:
      type: object
      required: [body, nonce]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        nonce: { type: string, minLength: 8, maxLength: 64 }
    MessagePage:
      type: object
      required: [messages, has_more]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        has_more: { type: boolean }
    Permissions:
      type: object
      required: [create_channels]
      description: What the user may do (roles replace the single administrator later).
      properties:
        create_channels: { type: boolean }
    Logout:
      type: object
      required: [end_session_url]
      properties:
        end_session_url:
          type: string
          description: Sign-out page of Cenacle ID; empty if it is not known.
