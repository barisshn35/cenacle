  /api/workspaces/{workspace_id}/export:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [compliance]
      operationId: exportMessages
      summary: eDiscovery export of messages, deleted ones included (owners)
      description: |
        One JSON object per line (application/x-ndjson), oldest first. Encrypted
        channels export their envelopes. Every export is recorded in the audit log.
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: channel_ids, in: query, style: form, explode: false, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: user_ids, in: query, style: form, explode: false, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: The messages.
          content:
            application/x-ndjson:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
