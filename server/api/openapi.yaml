# SPDX-License-Identifier: AGPL-3.0-only
openapi: 3.0.3
info:
  title: Cenacle chat API
  version: 0.20.0
  description: |
    HTTP API of the Cenacle chat server. Every error is an RFC 9457 problem
    (`application/problem+json`) with a stable `code` and the `request_id`.

    Authentication: the web app uses the `HttpOnly` session cookie set at the end
    of sign-in; other clients send `Authorization: Bearer <session token>`.
    Cookie-authenticated requests that change state must come from the app's own
    origin (`Origin` or `Sec-Fetch-Site: same-origin`).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
tags:
  - name: workspaces
    description: Workspaces, their members and invitations
  - name: auth
    description: Sign-in with Cenacle ID and sessions
  - name: chat
    description: Channels and messages
  - name: realtime
    description: Live events over WebSocket
  - name: files
    description: Files shared in channels (stored in an S3-compatible object store)
  - name: search
    description: Searching messages and files
  - name: notifications
    description: What notifies people, sounds, web push and e-mail
  - name: threads
    description: Replies in threads, followed threads and activity
  - name: saved
    description: Messages saved for later
  - name: community
    description: Polls, events, onboarding, the banner and terms of service
  - name: moderation
    description: Reports, AutoMod, timeouts and slow mode
  - name: playbooks
    description: Checklists teams run again and again
paths:
  /api/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: The user's workspaces, the default one first
      responses:
        '200':
          description: Workspaces with the user's role.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace (the instance administrator)
      description: The creator becomes its owner; a General channel for everyone is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      operationId: renameWorkspace
      summary: Change a workspace's name or description (owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/icon:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [workspaces]
      operationId: setWorkspaceIcon
      summary: Set the workspace's icon (owners and admins)
      description: A PNG, JPEG, GIF or WebP image of at most 5 MB; it is cut to a square.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [workspaces]
      operationId: deleteWorkspaceIcon
      summary: Remove the workspace's icon (owners and admins)
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/members:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workspaces]
      operationId: listWorkspaceMembers
      summary: Members of a workspace with their roles
      responses:
        '200':
          description: Owners first, then admins, then members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceMember' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      operationId: setWorkspaceRole
      summary: Change someone's role
      description: |
        Admins make members admins and back; only owners grant or take the owner
        role. A workspace always keeps at least one owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member, guest] }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMember' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [workspaces]
      operationId: removeWorkspaceMember
      summary: Remove someone from a workspace (owners and admins), or leave it yourself
      description: |
        They leave all its channels too. Nobody leaves the default workspace, and the
        last owner cannot leave.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/conversations:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: openConversation
      summary: Open a direct or group conversation
      description: |
        With one other person a direct conversation, with 2 to 8 a group. The same
        people always get the same conversation back (200); a new one answers 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The existing conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '201':
          description: A new conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/presence:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [realtime]
      operationId: listPresence
      summary: Who of a workspace is online, away or busy
      description: Members not listed are offline. Changes arrive as `presence.changed`.
      responses:
        '200':
          description: Statuses.
          content:
            application/json:
              schema:
                type: object
                required: [presence]
                properties:
                  presence:
                    type: array
                    items: { $ref: '#/components/schemas/Presence' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/profiles:
    get:
      tags: [profiles]
      operationId: getProfiles
      summary: Profiles of people
      description: Up to 100 ids; people the caller may not see are left out.
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/Profile' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/me/profile:
    get:
      tags: [profiles]
      operationId: getMyProfile
      summary: Your profile and its settings
      responses:
        '200':
          description: Your profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [profiles]
      operationId: updateMyProfile
      summary: Change your @username, time zone or who sees when you were last online
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                username:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9._-]{1,29}$'
                  description: Not for accounts whose @username is the directory's.
                timezone:
                  type: string
                  maxLength: 64
                  description: An IANA time zone such as Europe/Istanbul.
                show_last_seen: { type: boolean }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/me/status:
    put:
      tags: [profiles]
      operationId: setCustomStatus
      summary: Set your custom status
      description: An emoji, a text or both; it clears itself at `expires_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomStatus' }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [profiles]
      operationId: clearCustomStatus
      summary: Clear your custom status
      responses:
        '204':
          description: Cleared.
        '401':
          $ref: '#/components/responses/Problem'
  /api/me/avatar:
    put:
      tags: [profiles]
      operationId: setAvatar
      summary: Set your profile picture
      description: |
        A PNG, JPEG, GIF or WebP image of at most 5 MB. It is cut to a square; an
        animated GIF (at most 2 MB) keeps moving, with a still first frame for people
        who reduce motion.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [profiles]
      operationId: deleteAvatar
      summary: Remove your profile picture
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
  /api/pictures/{picture_id}:
    parameters:
      - name: picture_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [profiles]
      operationId: getPicture
      summary: A profile picture or workspace icon
      description: Cached for good (a new picture gets a new id).
      parameters:
        - name: still
          in: query
          description: The first frame of an animated picture.
          schema: { type: boolean }
      responses:
        '200':
          description: PNG or GIF.
          content:
            image/png:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/me/appearance:
    get:
      tags: [appearance]
      operationId: getMyAppearance
      summary: Your appearance settings
      responses:
        '200':
          description: The settings (defaults filled in).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appearance' }
        '401':
          $ref: '#/components/responses/Problem'
    put:
      tags: [appearance]
      operationId: setMyAppearance
      summary: Save your appearance settings (they follow you to every device)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Appearance' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appearance' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/me/fonts:
    get:
      tags: [appearance]
      operationId: listMyFonts
      summary: Fonts you uploaded
      responses:
        '200':
          description: Your fonts.
          content:
            application/json:
              schema:
                type: object
                required: [fonts]
                properties:
                  fonts:
                    type: array
                    items: { $ref: '#/components/schemas/UserFont' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [appearance]
      operationId: uploadFont
      summary: Upload a font for yourself
      description: WOFF2, WOFF, TrueType or OpenType, at most 2 MB; five per person.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 60 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserFont' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/me/fonts/{font_id}:
    parameters:
      - name: font_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [appearance]
      operationId: deleteFont
      summary: Remove a font you uploaded
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/fonts/{font_id}:
    parameters:
      - name: font_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [appearance]
      operationId: getFont
      summary: A font you uploaded (only for you)
      responses:
        '200':
          description: The font file.
          content:
            font/woff2:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/ui-texts:
    get:
      tags: [appearance]
      operationId: getUITexts
      summary: Interface texts the administrators replaced
      description: Public (the sign-in page uses them too). Keys are those of the app's translations.
      security: []
      responses:
        '200':
          description: Texts by language and key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UITexts' }
    put:
      tags: [appearance]
      operationId: setUITexts
      summary: Replace interface texts (instance administrators)
      description: Only the keys in `editable` may be changed; an empty text restores the original.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale, texts]
              properties:
                locale: { type: string, enum: [en, tr] }
                texts:
                  type: object
                  additionalProperties: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UITexts' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/appearance:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [workspaces]
      operationId: setWorkspaceAppearance
      summary: The workspace's default theme preset and font template (owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceAppearance' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/search/messages:
    get:
      tags: [search]
      operationId: searchMessages
      summary: Search the messages of your channels and conversations
      description: |
        Every word must begin a word of the message (accents and case do not matter);
        `-word` leaves out messages with it. Newest first; `before` continues a page.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: channel_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: Only messages of this person., schema: { type: string, format: uuid } }
        - { name: after, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: has, in: query, schema: { type: string, enum: [file, link] } }
        - { name: before, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Matching messages.
          content:
            application/json:
              schema:
                type: object
                required: [results, has_more]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/SearchMessage' }
                  has_more: { type: boolean }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/search/files:
    get:
      tags: [search]
      operationId: searchFiles
      summary: Search files of your channels by name
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: before, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Matching files.
          content:
            application/json:
              schema:
                type: object
                required: [results, has_more]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/SearchFile' }
                  has_more: { type: boolean }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/me/notifications:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: Your notification settings, with muted channels and workspaces
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401':
          $ref: '#/components/responses/Problem'
    put:
      tags: [notifications]
      operationId: setNotificationPrefs
      summary: Save your notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPrefs' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/notifications:
    parameters:
      - { name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [notifications]
      operationId: setChannelNotifications
      summary: What a channel or conversation notifies you of; mute it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelNotificationInput' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelNotification' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/notifications:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [notifications]
      operationId: setWorkspaceNotifications
      summary: Mute or unmute a workspace for you
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted_until]
              properties:
                muted_until: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceNotification' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/me/sounds:
    get:
      tags: [notifications]
      operationId: listMySounds
      summary: Sounds you uploaded
      responses:
        '200':
          description: Your sounds.
          content:
            application/json:
              schema:
                type: object
                required: [sounds]
                properties:
                  sounds:
                    type: array
                    items: { $ref: '#/components/schemas/UserSound' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [notifications]
      operationId: uploadSound
      summary: Upload a notification sound for yourself
      description: MP3, Ogg, WAV or WebM audio, at most 1 MB; five per person.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSound' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/me/sounds/{sound_id}:
    parameters:
      - { name: sound_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [notifications]
      operationId: deleteSound
      summary: Remove a sound you uploaded
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/sounds/{sound_id}:
    parameters:
      - { name: sound_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [notifications]
      operationId: getSound
      summary: A sound you uploaded (only for you)
      responses:
        '200':
          description: The audio.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/me/push-subscriptions:
    post:
      tags: [notifications]
      operationId: addPushSubscription
      summary: Receive web push notifications in this browser
      description: Only when web push is turned on for the installation (`push_public_key` is set).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscription' }
      responses:
        '204':
          description: Subscribed.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [notifications]
      operationId: removePushSubscription
      summary: Stop web push notifications in a browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, maxLength: 2000 }
      responses:
        '204':
          description: Unsubscribed.
        '401':
          $ref: '#/components/responses/Problem'
  /api/presence:
    put:
      tags: [realtime]
      operationId: setPresence
      summary: Set your own status
      description: |
        `away` and `dnd` (do not disturb) hold while you are connected; `online`
        clears them. Without a connection you are offline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [online, away, dnd] }
      responses:
        '204':
          description: Set.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/invites:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workspaces]
      operationId: listInvites
      summary: Invitations that can still be used (owners and admins)
      responses:
        '200':
          description: Invitations.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [workspaces]
      operationId: createInvite
      summary: Create an invitation link (owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
                max_uses: { type: integer, minimum: 1, maximum: 1000, nullable: true }
      responses:
        '201':
          description: |
            Created. The token is shown only now; the link is
            `<app>/invite/<token>`.
          content:
            application/json:
              schema:
                type: object
                required: [invite, token]
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
                  token: { type: string }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/invites/{invite_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: invite_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [workspaces]
      operationId: revokeInvite
      summary: Revoke an invitation (owners and admins)
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
    get:
      tags: [workspaces]
      operationId: getInvite
      summary: What an invitation leads to
      responses:
        '200':
          description: The workspace and whether the invitation can be used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/invites/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
    post:
      tags: [workspaces]
      operationId: acceptInvite
      summary: Join the workspace of an invitation
      responses:
        '200':
          description: Member (also when already one).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
  /api/auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Start sign-in with Cenacle ID
      description: |
        Redirects the browser to Cenacle ID (authorization code flow with PKCE).
        After sign-in the browser returns to `return_to`. If Cenacle ID cannot be
        reached, it redirects to `/signin?error=unavailable` instead.
      security: []
      parameters:
        - name: return_to
          in: query
          description: Path inside the app to open after sign-in (default `/`).
          schema: { type: string, maxLength: 2048 }
      responses:
        '302':
          description: Redirect to the authorization endpoint of Cenacle ID.
  /api/auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: Finish sign-in (redirect target of Cenacle ID)
      description: |
        Exchanges the authorization code, creates the session and sets the
        session cookie, then redirects to the saved `return_to`. On failure it
        redirects to `/signin?error=<code>`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirect into the app.
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: |
        Ends the session and clears the cookie. The response names the
        Cenacle ID sign-out page, which the browser can open to end the
        single sign-on session too. Without a session it succeeds as well.
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Logout' }
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The current session and its user
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: Your signed-in devices
      responses:
        '200':
          description: Usable sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceSession' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [auth]
      operationId: endSession
      summary: Sign out one device
      responses:
        '204':
          description: Ended (open connections of that device close).
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/sessions/end-all:
    post:
      tags: [auth]
      operationId: endAllSessions
      summary: Sign out everywhere
      description: Ends every session of the user, or every other one with `keep_current`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep_current]
              properties:
                keep_current: { type: boolean }
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema:
                type: object
                required: [ended]
                properties:
                  ended: { type: integer }
        '401':
          $ref: '#/components/responses/Problem'
  /api/auth/backchannel-logout:
    post:
      tags: [auth]
      operationId: backchannelLogout
      summary: OpenID Connect Back-Channel Logout (called by Cenacle ID)
      description: |
        Cenacle ID posts a signed logout token when a sign-in ends there; the sessions
        that came from that sign-in (`sid`), or from that identity when the token names
        none, end. Not for browsers.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token: { type: string }
      responses:
        '200':
          description: Accepted.
        '400':
          description: The logout token is invalid.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  error_description: { type: string }
  /api/workspaces/{workspace_id}/audit:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listWorkspaceAudit
      summary: The workspace's audit log (owners and admins)
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
          description: Events older than this one (cursor).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [events, has_more]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  has_more: { type: boolean }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/bots:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listBots
      summary: The workspace's bots (owners and admins)
      responses:
        '200':
          description: Bots.
          content:
            application/json:
              schema:
                type: object
                required: [bots]
                properties:
                  bots:
                    type: array
                    items: { $ref: '#/components/schemas/Bot' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createBot
      summary: Create a bot (owners and admins)
      description: A bot is a member of the workspace that posts through tokens and webhooks; add it to channels like a person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 250 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bot' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [bots]
      operationId: updateBot
      summary: Rename, describe, disable or enable a bot
      description: A disabled bot's tokens and webhooks stop working until it is enabled again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 250 }
                disabled: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bot' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/tokens:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listBotTokens
      summary: The bot's tokens (not their secrets)
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/BotToken' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createBotToken
      summary: Create a token (shown once)
      description: |
        The bot uses it as `Authorization: Bearer cnb_...`. Scopes: `messages:read` (list
        its channels and their messages), `messages:write` (send, react).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: ['messages:read', 'messages:write'] }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [token, secret]
                properties:
                  token: { $ref: '#/components/schemas/BotToken' }
                  secret: { type: string, description: Shown only now. }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/tokens/{token_id}:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: token_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [bots]
      operationId: revokeBotToken
      summary: Revoke a token
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/webhooks:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listWebhooks
      summary: The bot's incoming webhooks
      responses:
        '200':
          description: Webhooks.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createWebhook
      summary: Create an incoming webhook (URL shown once)
      description: The bot joins the channel. `jira` reads Jira's issue and comment events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, channel_id, kind]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                channel_id: { type: string, format: uuid }
                kind: { type: string, enum: [generic, jira, gitlab, alertmanager] }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, url]
                properties:
                  webhook: { $ref: '#/components/schemas/Webhook' }
                  url: { type: string, description: The secret address; shown only now. }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/webhooks/{webhook_id}:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: webhook_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [bots]
      operationId: deleteWebhook
      summary: Delete a webhook (its URL stops working)
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/hooks/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [bots]
      operationId: postWebhook
      summary: Post into a channel through an incoming webhook
      description: |
        No session: the URL is the secret. A `generic` webhook takes
        `{"text": "Markdown", "attachments": [...]}`; a `jira` webhook takes Jira's
        webhook payloads (issue created, updated, deleted; comment created).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Posted (or ignored, for events that say nothing worth posting).
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/commands:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: runCommand
      summary: Run a slash command in a channel
      description: |
        Built-in commands: `/remind`, `/join`, `/leave`, `/topic`, `/shrug`, `/me`. Other
        commands go to the bot that registered them, which answers either only to the
        caller (`ephemeral`) or with a message in the channel (`in_channel`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, description: 'Without the slash, e.g. "remind".' }
                text: { type: string, maxLength: 4000 }
                timezone: { type: string, description: The caller's IANA time zone, for times in /remind. }
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/commands:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listCommands
      summary: Slash commands available in a workspace (for suggestions)
      responses:
        '200':
          description: Commands.
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items: { $ref: '#/components/schemas/CommandInfo' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/commands:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listBotCommands
      summary: A bot's slash commands
      responses:
        '200':
          description: Commands.
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items: { $ref: '#/components/schemas/SlashCommand' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createBotCommand
      summary: Register a slash command (signing secret shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger, url]
