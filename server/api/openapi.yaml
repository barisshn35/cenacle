# SPDX-License-Identifier: Apache-2.0
openapi: 3.0.3
info:
  title: Cenacle chat API
  version: 0.13.0
  description: |
    HTTP API of the Cenacle chat server. Every error is an RFC 9457 problem
    (`application/problem+json`) with a stable `code` and the `request_id`.

    Authentication: the web app uses the `HttpOnly` session cookie set at the end
    of sign-in; other clients send `Authorization: Bearer <session token>`.
    Cookie-authenticated requests that change state must come from the app's own
    origin (`Origin` or `Sec-Fetch-Site: same-origin`).
  license:
    name: Apache-2.0
servers:
  - url: /
tags:
  - name: workspaces
    description: Workspaces, their members and invitations
  - name: auth
    description: Sign-in with Cenacle ID and sessions
  - name: chat
    description: Channels and messages
  - name: realtime
    description: Live events over WebSocket
  - name: files
    description: Files shared in channels (stored in an S3-compatible object store)
paths:
  /api/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: The user's workspaces, the default one first
      responses:
        '200':
          description: Workspaces with the user's role.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace (the instance administrator)
      description: The creator becomes its owner; a General channel for everyone is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      operationId: renameWorkspace
      summary: Rename a workspace (owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/members:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workspaces]
      operationId: listWorkspaceMembers
      summary: Members of a workspace with their roles
      responses:
        '200':
          description: Owners first, then admins, then members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceMember' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      operationId: setWorkspaceRole
      summary: Change someone's role
      description: |
        Admins make members admins and back; only owners grant or take the owner
        role. A workspace always keeps at least one owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member, guest] }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMember' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [workspaces]
      operationId: removeWorkspaceMember
      summary: Remove someone from a workspace (owners and admins), or leave it yourself
      description: |
        They leave all its channels too. Nobody leaves the default workspace, and the
        last owner cannot leave.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/conversations:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: openConversation
      summary: Open a direct or group conversation
      description: |
        With one other person a direct conversation, with 2 to 8 a group. The same
        people always get the same conversation back (200); a new one answers 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The existing conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '201':
          description: A new conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/presence:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [realtime]
      operationId: listPresence
      summary: Who of a workspace is online, away or busy
      description: Members not listed are offline. Changes arrive as `presence.changed`.
      responses:
        '200':
          description: Statuses.
          content:
            application/json:
              schema:
                type: object
                required: [presence]
                properties:
                  presence:
                    type: array
                    items: { $ref: '#/components/schemas/Presence' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/presence:
    put:
      tags: [realtime]
      operationId: setPresence
      summary: Set your own status
      description: |
        `away` and `dnd` (do not disturb) hold while you are connected; `online`
        clears them. Without a connection you are offline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [online, away, dnd] }
      responses:
        '204':
          description: Set.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/invites:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workspaces]
      operationId: listInvites
      summary: Invitations that can still be used (owners and admins)
      responses:
        '200':
          description: Invitations.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [workspaces]
      operationId: createInvite
      summary: Create an invitation link (owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
                max_uses: { type: integer, minimum: 1, maximum: 1000, nullable: true }
      responses:
        '201':
          description: |
            Created. The token is shown only now; the link is
            `<app>/invite/<token>`.
          content:
            application/json:
              schema:
                type: object
                required: [invite, token]
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
                  token: { type: string }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/invites/{invite_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: invite_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [workspaces]
      operationId: revokeInvite
      summary: Revoke an invitation (owners and admins)
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
    get:
      tags: [workspaces]
      operationId: getInvite
      summary: What an invitation leads to
      responses:
        '200':
          description: The workspace and whether the invitation can be used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/invites/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
    post:
      tags: [workspaces]
      operationId: acceptInvite
      summary: Join the workspace of an invitation
      responses:
        '200':
          description: Member (also when already one).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
  /api/auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Start sign-in with Cenacle ID
      description: |
        Redirects the browser to Cenacle ID (authorization code flow with PKCE).
        After sign-in the browser returns to `return_to`. If Cenacle ID cannot be
        reached, it redirects to `/signin?error=unavailable` instead.
      security: []
      parameters:
        - name: return_to
          in: query
          description: Path inside the app to open after sign-in (default `/`).
          schema: { type: string, maxLength: 2048 }
      responses:
        '302':
          description: Redirect to the authorization endpoint of Cenacle ID.
  /api/auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: Finish sign-in (redirect target of Cenacle ID)
      description: |
        Exchanges the authorization code, creates the session and sets the
        session cookie, then redirects to the saved `return_to`. On failure it
        redirects to `/signin?error=<code>`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirect into the app.
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: |
        Ends the session and clears the cookie. The response names the
        Cenacle ID sign-out page, which the browser can open to end the
        single sign-on session too. Without a session it succeeds as well.
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Logout' }
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The current session and its user
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: Your signed-in devices
      responses:
        '200':
          description: Usable sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceSession' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [auth]
      operationId: endSession
      summary: Sign out one device
      responses:
        '204':
          description: Ended (open connections of that device close).
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/sessions/end-all:
    post:
      tags: [auth]
      operationId: endAllSessions
      summary: Sign out everywhere
      description: Ends every session of the user, or every other one with `keep_current`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep_current]
              properties:
                keep_current: { type: boolean }
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema:
                type: object
                required: [ended]
                properties:
                  ended: { type: integer }
        '401':
          $ref: '#/components/responses/Problem'
  /api/auth/backchannel-logout:
    post:
      tags: [auth]
      operationId: backchannelLogout
      summary: OpenID Connect Back-Channel Logout (called by Cenacle ID)
      description: |
        Cenacle ID posts a signed logout token when a sign-in ends there; the sessions
        that came from that sign-in (`sid`), or from that identity when the token names
        none, end. Not for browsers.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token: { type: string }
      responses:
        '200':
          description: Accepted.
        '400':
          description: The logout token is invalid.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  error_description: { type: string }
  /api/workspaces/{workspace_id}/audit:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listWorkspaceAudit
      summary: The workspace's audit log (owners and admins)
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
          description: Events older than this one (cursor).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [events, has_more]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  has_more: { type: boolean }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/bots:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listBots
      summary: The workspace's bots (owners and admins)
      responses:
        '200':
          description: Bots.
          content:
            application/json:
              schema:
                type: object
                required: [bots]
                properties:
                  bots:
                    type: array
                    items: { $ref: '#/components/schemas/Bot' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createBot
      summary: Create a bot (owners and admins)
      description: A bot is a member of the workspace that posts through tokens and webhooks; add it to channels like a person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 250 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bot' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [bots]
      operationId: updateBot
      summary: Rename, describe, disable or enable a bot
      description: A disabled bot's tokens and webhooks stop working until it is enabled again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 250 }
                disabled: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bot' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/tokens:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listBotTokens
      summary: The bot's tokens (not their secrets)
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/BotToken' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createBotToken
      summary: Create a token (shown once)
      description: |
        The bot uses it as `Authorization: Bearer cnb_...`. Scopes: `messages:read` (list
        its channels and their messages), `messages:write` (send, react).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: ['messages:read', 'messages:write'] }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [token, secret]
                properties:
                  token: { $ref: '#/components/schemas/BotToken' }
                  secret: { type: string, description: Shown only now. }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/tokens/{token_id}:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: token_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [bots]
      operationId: revokeBotToken
      summary: Revoke a token
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/webhooks:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [bots]
      operationId: listWebhooks
      summary: The bot's incoming webhooks
      responses:
        '200':
          description: Webhooks.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [bots]
      operationId: createWebhook
      summary: Create an incoming webhook (URL shown once)
      description: The bot joins the channel. `jira` reads Jira's issue and comment events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, channel_id, kind]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                channel_id: { type: string, format: uuid }
                kind: { type: string, enum: [generic, jira, gitlab, alertmanager] }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, url]
                properties:
                  webhook: { $ref: '#/components/schemas/Webhook' }
                  url: { type: string, description: The secret address; shown only now. }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/bots/{bot_id}/webhooks/{webhook_id}:
    parameters:
      - name: bot_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: webhook_id
        in: path
        required: true
        schema: { type: string, format: uuid }
