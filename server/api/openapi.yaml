# SPDX-License-Identifier: Apache-2.0
openapi: 3.0.3
info:
  title: Cenacle chat API
  version: 0.6.0
  description: |
    HTTP API of the Cenacle chat server. Every error is an RFC 9457 problem
    (`application/problem+json`) with a stable `code` and the `request_id`.

    Authentication: the web app uses the `HttpOnly` session cookie set at the end
    of sign-in; other clients send `Authorization: Bearer <session token>`.
    Cookie-authenticated requests that change state must come from the app's own
    origin (`Origin` or `Sec-Fetch-Site: same-origin`).
  license:
    name: Apache-2.0
servers:
  - url: /
tags:
  - name: workspaces
    description: Workspaces, their members and invitations
  - name: auth
    description: Sign-in with Cenacle ID and sessions
  - name: chat
    description: Channels and messages
  - name: realtime
    description: Live events over WebSocket
paths:
  /api/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: The user's workspaces, the default one first
      responses:
        '200':
          description: Workspaces with the user's role.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace (the instance administrator)
      description: The creator becomes its owner; a General channel for everyone is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      operationId: renameWorkspace
      summary: Rename a workspace (owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/members:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workspaces]
      operationId: listWorkspaceMembers
      summary: Members of a workspace with their roles
      responses:
        '200':
          description: Owners first, then admins, then members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceMember' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      operationId: setWorkspaceRole
      summary: Change someone's role
      description: |
        Admins make members admins and back; only owners grant or take the owner
        role. A workspace always keeps at least one owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member] }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMember' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [workspaces]
      operationId: removeWorkspaceMember
      summary: Remove someone from a workspace (owners and admins), or leave it yourself
      description: |
        They leave all its channels too. Nobody leaves the default workspace, and the
        last owner cannot leave.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/invites:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workspaces]
      operationId: listInvites
      summary: Invitations that can still be used (owners and admins)
      responses:
        '200':
          description: Invitations.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [workspaces]
      operationId: createInvite
      summary: Create an invitation link (owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
                max_uses: { type: integer, minimum: 1, maximum: 1000, nullable: true }
      responses:
        '201':
          description: |
            Created. The token is shown only now; the link is
            `<app>/invite/<token>`.
          content:
            application/json:
              schema:
                type: object
                required: [invite, token]
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
                  token: { type: string }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/invites/{invite_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: invite_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [workspaces]
      operationId: revokeInvite
      summary: Revoke an invitation (owners and admins)
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
    get:
      tags: [workspaces]
      operationId: getInvite
      summary: What an invitation leads to
      responses:
        '200':
          description: The workspace and whether the invitation can be used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/invites/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
    post:
      tags: [workspaces]
      operationId: acceptInvite
      summary: Join the workspace of an invitation
      responses:
        '200':
          description: Member (also when already one).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
  /api/auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Start sign-in with Cenacle ID
      description: |
        Redirects the browser to Cenacle ID (authorization code flow with PKCE).
        After sign-in the browser returns to `return_to`. If Cenacle ID cannot be
        reached, it redirects to `/signin?error=unavailable` instead.
      security: []
      parameters:
        - name: return_to
          in: query
          description: Path inside the app to open after sign-in (default `/`).
          schema: { type: string, maxLength: 2048 }
      responses:
        '302':
          description: Redirect to the authorization endpoint of Cenacle ID.
  /api/auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: Finish sign-in (redirect target of Cenacle ID)
      description: |
        Exchanges the authorization code, creates the session and sets the
        session cookie, then redirects to the saved `return_to`. On failure it
        redirects to `/signin?error=<code>`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirect into the app.
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: |
        Ends the session and clears the cookie. The response names the
        Cenacle ID sign-out page, which the browser can open to end the
        single sign-on session too. Without a session it succeeds as well.
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Logout' }
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The current session and its user
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/ws/ticket:
    post:
      tags: [realtime]
      operationId: createWsTicket
      summary: Ticket for opening the WebSocket
      description: |
        Returns a single-use ticket valid for 30 seconds. Open
        `/ws?ticket=<ticket>[&last_event_id=<id>]` with it: browsers cannot send
        an Authorization header on WebSocket connections, and a ticket keeps the
        session token out of URLs and logs.

        WebSocket protocol (JSON text frames, server to client):
        - `{"op":"hello","last_event_id":"<id>","heartbeat_ms":25000}` after connecting;
        - `{"op":"event","id":"<id>","type":"message.created","data":{...}}` for each event,
          in order, starting after `last_event_id` when it was given;
        - `{"op":"resync"}` when the events since `last_event_id` are no longer
          available: reload the data and continue from the id in `hello`.

        Close codes: 4001 invalid ticket, 4003 session ended, 4008 the client
        did not keep up (reconnect and resume).
      responses:
        '201':
          description: Ticket created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WsTicket' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/channels:
    get:
      tags: [chat]
      operationId: listChannels
      summary: Channels the user is a member of
      responses:
        '200':
          description: Mandatory channels first, then by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: createChannel
      summary: Create a channel (workspace owners and admins)
      description: |
        The creator becomes a member. A default channel has every user as a
        member, also users who sign in for the first time later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewChannel' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [chat]
      operationId: updateChannel
      summary: Rename, change visibility or topic (channel managers)
      description: Default channels cannot be private (400); names stay unique (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/archive:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: archiveChannel
      summary: Archive a channel (channel managers)
      description: |
        Archived channels are read-only and leave the sidebar; members find them in
        the directory. Mandatory channels cannot be archived.
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/unarchive:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: unarchiveChannel
      summary: Restore an archived channel (channel managers)
      responses:
        '200':
          description: Active again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/category:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [chat]
      operationId: setChannelCategory
      summary: Put a channel in a category (workspace owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: null takes the channel out of its category.
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/messages/{message_id}:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: message_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [chat]
      operationId: editMessage
      summary: Edit your own message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: Edited; members receive `message.updated`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [chat]
      operationId: deleteMessage
      summary: Delete a message (its author, or a channel manager)
      description: |
        The message disappears for everyone (`message.deleted`) and can be restored
        for 5 minutes; then it is removed for good.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/messages/{message_id}/restore:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: message_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: restoreMessage
      summary: Undo deleting a message (whoever may delete it)
      responses:
        '200':
          description: Restored; members receive `message.created` again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/categories:
    get:
      tags: [chat]
      operationId: listCategories
      summary: Channel categories of a workspace, in order
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: createCategory
      summary: Create a category (workspace owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, name]
              properties:
                workspace_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Created, last in order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [chat]
      operationId: updateCategory
      summary: Rename or move a category (workspace owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                position: { type: integer }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [chat]
      operationId: deleteCategory
      summary: Delete a category (workspace owners and admins); its channels stay
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/members:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listChannelMembers
      summary: Members of a channel (members only)
      responses:
        '200':
          description: Managers first, then by name.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: addChannelMember
      summary: Add someone to a channel (channel managers)
      description: |
        The only way into a private channel. Managers are the channel's creator
        and the administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Member (also when already a member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/members/{user_id}:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [chat]
      operationId: setChannelMemberRole
      summary: Make a member a channel manager, or back (channel managers)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [member, manager] }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [chat]
      operationId: removeChannelMember
      summary: Remove someone from a channel (channel managers)
      description: Not from mandatory channels; to remove yourself, leave the channel.
      responses:
        '204':
          description: Not a member any more.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/users:
    get:
      tags: [chat]
      operationId: searchUsers
      summary: Find members of a workspace by name or e-mail address
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Matching people, by name.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/channels/directory:
    get:
      tags: [chat]
      operationId: listChannelDirectory
      summary: Channels of a workspace the user can see, with membership
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Public channels and the private channels the user belongs to;
            `is_member` tells which ones the user belongs to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/join:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: joinChannel
      summary: Join a public channel
      description: Private channels are joined only when a manager adds you (404 otherwise).
      responses:
        '200':
          description: Member (also when already a member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/leave:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: leaveChannel
      summary: Leave a channel
      description: Mandatory channels cannot be left (403, code `channel_mandatory`).
      responses:
        '204':
          description: Not a member any more.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/messages:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listMessages
      summary: Messages of a channel, newest page first
      description: |
        Members only (403, code `not_a_member`).

        Cursor pagination: without `before` the newest messages; with `before`
        (a message id) the messages older than it. Each page is in chronological
        order; `has_more` says whether older messages exist.
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: createMessage
      summary: Send a message
      description: |
        Members only. In announcement channels only the administrator can
        send (403, code `read_only_channel`).

        `nonce` is chosen by the client for each message. Sending the same nonce
        again (a retry after a lost response) returns the existing message
        instead of creating a second one. Everyone in the channel receives a
        `message.created` event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMessage' }
      responses:
        '201':
          description: Created (or already created with this nonce).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
security:
  - cookie: []
  - bearer: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: cenacle_session
      description: '`__Host-cenacle_session` when the app is served over https.'
    bearer:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable error code (snake_case).
        request_id: { type: string }
    User:
      type: object
      required: [id, email, email_verified, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        display_name: { type: string }
    Session:
      type: object
      required: [user, permissions, created_at, expires_at, idle_timeout_seconds]
      properties:
        user: { $ref: '#/components/schemas/User' }
        permissions: { $ref: '#/components/schemas/Permissions' }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Absolute end of the session.
        idle_timeout_seconds:
          type: integer
          description: The session also ends after this long without use.
    WsTicket:
      type: object
      required: [ticket, expires_in]
      properties:
        ticket: { type: string }
        expires_in:
          type: integer
          description: Seconds until the ticket expires.
    Workspace:
      type: object
      required: [id, name, is_default, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_default:
          type: boolean
          description: Everyone who signs in belongs to the default workspace.
        role: { type: string, enum: [owner, admin, member] }
    WorkspaceMember:
      type: object
      required: [user, role]
      properties:
        user: { $ref: '#/components/schemas/Person' }
        role: { type: string, enum: [owner, admin, member] }
    Invite:
      type: object
      required: [id, created_at, expires_at, max_uses, uses]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        max_uses: { type: integer, nullable: true }
        uses: { type: integer }
    InvitePreview:
      type: object
      required: [workspace_id, workspace_name, valid, is_member]
      properties:
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        valid:
          type: boolean
          description: False when expired, used up or revoked.
        is_member: { type: boolean }
    Channel:
      type: object
      required:
        [
          id,
          workspace_id,
          name,
          topic,
          kind,
          visibility,
          is_default,
          is_mandatory,
          is_member,
          can_post,
          can_manage,
          archived,
          category_id,
        ]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        topic: { type: string }
        kind:
          type: string
          enum: [standard, announcement]
          description: In announcement channels only the administrator can send.
        is_default:
          type: boolean
          description: Every user is a member.
        is_mandatory:
          type: boolean
          description: Members cannot leave.
        visibility:
          type: string
          enum: [public, private]
          description: Private channels are visible to their members only.
        is_member: { type: boolean }
        can_post:
          type: boolean
          description: Whether this user can send messages here.
        can_manage:
          type: boolean
          description: Whether this user can add and remove people and change the channel.
        archived:
          type: boolean
          description: Archived channels are read-only.
        category_id:
          type: string
          format: uuid
          nullable: true
    ChannelUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        visibility:
          type: string
          enum: [public, private]
        topic: { type: string, maxLength: 250 }
    Person:
      type: object
      required: [id, display_name, email]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string }
    Member:
      type: object
      required: [user, role]
      properties:
        user: { $ref: '#/components/schemas/Person' }
        role:
          type: string
          enum: [member, manager]
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
    NewChannel:
      type: object
      required: [workspace_id, name]
      properties:
        workspace_id: { type: string, format: uuid }
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Display name, unique regardless of case; surrounding spaces are removed.
        topic: { type: string, maxLength: 250 }
        kind:
          type: string
          enum: [standard, announcement]
          default: standard
        visibility:
          type: string
          enum: [public, private]
          default: public
        is_default:
          type: boolean
          default: false
          description: Make every user, now and later, a member.
    Author:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
    Message:
      type: object
      required: [id, channel_id, author, body, nonce, created_at, edited_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/Author' }
        body:
          type: string
          description: Message text as typed (Markdown rendering arrives later).
        nonce:
          type: string
          description: The client's nonce, so the sender can match its pending message.
        created_at: { type: string, format: date-time }
        edited_at:
          type: string
          format: date-time
          nullable: true
    Category:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
    NewMessage:
      type: object
      required: [body, nonce]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        nonce: { type: string, minLength: 8, maxLength: 64 }
    MessagePage:
      type: object
      required: [messages, has_more]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        has_more: { type: boolean }
    Permissions:
      type: object
      required: [create_workspaces]
      description: |
        What the user may do across the instance. Rights inside a workspace follow
        the role there (see Workspace).
      properties:
        create_workspaces: { type: boolean }
    Logout:
      type: object
      required: [end_session_url]
      properties:
        end_session_url:
          type: string
          description: Sign-out page of Cenacle ID; empty if it is not known.
