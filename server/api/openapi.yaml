              required: [workspace_id, name]
              properties:
                workspace_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Created, last in order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [chat]
      operationId: updateCategory
      summary: Rename or move a category (workspace owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                position: { type: integer }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [chat]
      operationId: deleteCategory
      summary: Delete a category (workspace owners and admins); its channels stay
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/members:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listChannelMembers
      summary: Members of a channel (members only)
      responses:
        '200':
          description: Managers first, then by name.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: addChannelMember
      summary: Add someone to a channel (channel managers)
      description: |
        The only way into a private channel. Managers are the channel's creator
        and the administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Member (also when already a member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/members/{user_id}:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [chat]
      operationId: setChannelMemberRole
      summary: Make a member a channel manager, or back (channel managers)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [member, manager] }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [chat]
      operationId: removeChannelMember
      summary: Remove someone from a channel (channel managers)
      description: Not from mandatory channels; to remove yourself, leave the channel.
      responses:
        '204':
          description: Not a member any more.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/users:
    get:
      tags: [chat]
      operationId: searchUsers
      summary: Find members of a workspace by name or e-mail address
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Matching people, by name.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/channels/directory:
    get:
      tags: [chat]
      operationId: listChannelDirectory
      summary: Channels of a workspace the user can see, with membership
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Public channels and the private channels the user belongs to;
            `is_member` tells which ones the user belongs to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/join:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: joinChannel
      summary: Join a public channel
      description: Private channels are joined only when a manager adds you (404 otherwise).
      responses:
        '200':
          description: Member (also when already a member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/leave:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: leaveChannel
      summary: Leave a channel
      description: Mandatory channels cannot be left (403, code `channel_mandatory`).
      responses:
        '204':
          description: Not a member any more.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/groups:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workspaces]
      operationId: listWorkspaceGroups
      summary: Directory groups that give membership of the workspace (owners and admins)
      responses:
        '200':
          description: The mappings and the group names people of the instance are in.
          content:
            application/json:
              schema:
                type: object
                required: [mappings, groups]
                properties:
                  mappings:
                    type: array
                    items: { $ref: '#/components/schemas/GroupMapping' }
                  groups:
                    type: array
                    items: { type: string }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [workspaces]
      operationId: setWorkspaceGroup
      summary: Give the members of a directory group membership of the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupMapping' }
      responses:
        '200':
          description: Saved; people of the group join now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMapping' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/groups/{group}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: group
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [workspaces]
      operationId: deleteWorkspaceGroup
      summary: Stop giving membership to a directory group
      description: People who are in the workspace only through this group leave it.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/groups:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: getChannelGroups
      summary: Directory groups of a channel (its managers)
      responses:
        '200':
          description: The channel's groups.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelGroups' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [chat]
      operationId: setChannelGroups
      summary: Set the directory groups of a channel
      description: |
        Members of the groups (in the channel's workspace) join. With `managed`, the
        members are exactly the people of the groups: others are removed and nobody
        is added or leaves by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelGroups' }
      responses:
        '200':
          description: Saved and applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelGroups' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/files:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [files]
      operationId: listChannelFiles
      summary: Files shared in a channel, newest first
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: A page of files.
          content:
            application/json:
              schema:
                type: object
                required: [files, has_more]
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelFile' }
                  has_more: { type: boolean }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [files]
      operationId: createUpload
      summary: Start uploading a file into a channel
      description: |
        Returns a form to POST the file to (multipart, the fields first and the
        file last as `file`); it accepts exactly `size` bytes for 15 minutes. Then
        call `complete`. Files that are not sent with a message within a day are
        removed. 503 `files_disabled` when no object store is configured, 413
        `file_too_large` above the limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                size: { type: integer, format: int64, minimum: 1 }
                content_type: { type: string, maxLength: 255 }
      responses:
        '201':
          description: The file and its upload form.
          content:
            application/json:
              schema:
                type: object
                required: [file, upload]
                properties:
                  file: { $ref: '#/components/schemas/FileInfo' }
                  upload:
                    type: object
                    required: [url, fields]
                    properties:
                      url: { type: string }
                      fields:
                        type: object
                        additionalProperties: { type: string }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/files/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [files]
      operationId: deleteUpload
      summary: Remove an uploaded file that no message carries yet
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/files/{file_id}/complete:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [files]
      operationId: completeUpload
      summary: Check an upload and make the file ready to send
      description: |
        Verifies the stored size, scans it when a virus scanner is configured and
        makes a preview of images. 409 `upload_incomplete` when the object store
        does not have the whole file; 422 `file_blocked` when the scanner rejects it.
      responses:
        '200':
          description: The ready file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfo' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/files/{file_id}/content:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [files]
      operationId: getFileContent
      summary: The file itself
      description: |
        Images, audio and video (and PDFs) are shown in the browser; everything else,
        and anything with `download=true`, is downloaded. Supports ranges.
      parameters:
        - name: download
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: The bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: A range of the bytes.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/files/{file_id}/thumbnail:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [files]
      operationId: getFileThumbnail
      summary: A small preview of an image (at most 480 pixels wide and high)
      responses:
        '200':
          description: JPEG or PNG.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/messages:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listMessages
      summary: Messages of a channel, newest page first
      description: |
        Members only (403, code `not_a_member`).

        Cursor pagination: without `before` the newest messages; with `before`
        (a message id) the messages older than it. Each page is in chronological
        order; `has_more` says whether older messages exist.
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: createMessage
      summary: Send a message
      description: |
        Members only. In announcement channels only the administrator can
        send (403, code `read_only_channel`).

        `nonce` is chosen by the client for each message. Sending the same nonce
        again (a retry after a lost response) returns the existing message
        instead of creating a second one. Everyone in the channel receives a
        `message.created` event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMessage' }
      responses:
        '201':
          description: Created (or already created with this nonce).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
security:
  - cookie: []
  - bearer: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: cenacle_session
      description: '`__Host-cenacle_session` when the app is served over https.'
    bearer:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable error code (snake_case).
        request_id: { type: string }
    User:
      type: object
      required: [id, email, email_verified, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        display_name: { type: string }
    Session:
      type: object
      required: [user, permissions, created_at, expires_at, idle_timeout_seconds, account_url]
      properties:
        account_url:
          type: string
          description: Cenacle ID's account page (two-step verification), returning here.
        user: { $ref: '#/components/schemas/User' }
        permissions: { $ref: '#/components/schemas/Permissions' }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Absolute end of the session.
        idle_timeout_seconds:
          type: integer
          description: The session also ends after this long without use.
    DeviceSession:
      type: object
      required: [id, created_at, last_seen_at, user_agent, ip_address, current]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          description: Recorded at most once a minute.
        user_agent: { type: string }
        ip_address: { type: string }
        current:
          type: boolean
          description: The session of this request.
    AuditEvent:
      type: object
      required: [id, at, actor, action, target_type, target_id, detail]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor:
          type: object
          nullable: true
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        action:
          type: string
          description: E.g. workspace.role_changed, channel.archived, invite.created.
        target_type: { type: string }
        target_id: { type: string }
        detail:
          type: object
          additionalProperties: true
    Bot:
      type: object
      required: [id, user_id, name, description, disabled, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
    BotToken:
      type: object
      required: [id, name, scopes, created_at, last_used_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
    Webhook:
      type: object
      required: [id, name, kind, channel_id, channel_name, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [generic, jira, gitlab, alertmanager] }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    CommandResult:
      type: object
      required: [response_type]
      properties:
        response_type:
          type: string
          enum: [ephemeral, in_channel, none]
          description: ephemeral is shown only to the caller; in_channel was posted as a message.
        text: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        message: { $ref: '#/components/schemas/Message' }
    CommandInfo:
      type: object
      required: [trigger, description, hint, builtin]
      properties:
        trigger: { type: string }
        description: { type: string }
        hint: { type: string }
        builtin: { type: boolean }
    SlashCommand:
      type: object
      required: [id, trigger, url, description, hint, created_at]
      properties:
        id: { type: string, format: uuid }
        trigger: { type: string }
        url: { type: string }
        description: { type: string }
        hint: { type: string }
        created_at: { type: string, format: date-time }
    Subscription:
      type: object
      required: [id, url, events, created_at, disabled]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        events:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        disabled: { type: boolean }
    Delivery:
      type: object
      required: [id, event_type, status, attempts, last_status, last_error, created_at, delivered_at, next_attempt_at]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        attempts: { type: integer }
        last_status: { type: integer, nullable: true }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
        next_attempt_at: { type: string, format: date-time }
    ScheduledMessage:
      type: object
      required: [id, kind, channel_id, channel_name, workspace_id, body, send_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [message, reminder] }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        workspace_id: { type: string, format: uuid }
        body: { type: string }
        send_at: { type: string, format: date-time }
    WsTicket:
      type: object
      required: [ticket, expires_in]
      properties:
        ticket: { type: string }
        expires_in:
          type: integer
          description: Seconds until the ticket expires.
    Workspace:
      type: object
      required: [id, name, is_default, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_default:
          type: boolean
          description: Everyone who signs in belongs to the default workspace.
        role:
          type: string
          enum: [owner, admin, member, guest]
          description: Guests see only the channels they are in and the people in them.
    WorkspaceMember:
      type: object
      required: [user, role]
      properties:
        user: { $ref: '#/components/schemas/Person' }
        role: { type: string, enum: [owner, admin, member, guest] }
    Invite:
      type: object
      required: [id, created_at, expires_at, max_uses, uses]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        max_uses: { type: integer, nullable: true }
        uses: { type: integer }
    InvitePreview:
      type: object
      required: [workspace_id, workspace_name, valid, is_member]
      properties:
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        valid:
          type: boolean
          description: False when expired, used up or revoked.
        is_member: { type: boolean }
    Channel:
      type: object
      required:
        [
          id,
          workspace_id,
          name,
          topic,
          kind,
          visibility,
          is_default,
          is_mandatory,
          is_member,
          can_post,
          can_manage,
          archived,
          group_managed,
          category_id,
          unread_count,
          mention_count,
          last_read_id,
          participants,
        ]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        topic: { type: string }
        kind:
          type: string
          enum: [standard, announcement, direct, group]
          description: |
            In announcement channels only workspace owners and admins send. Direct and
            group conversations have participants instead of a name.
        is_default:
          type: boolean
          description: Every user is a member.
        is_mandatory:
          type: boolean
          description: Members cannot leave.
        visibility:
          type: string
          enum: [public, private]
          description: Private channels are visible to their members only.
        is_member: { type: boolean }
        can_post:
          type: boolean
          description: Whether this user can send messages here.
        can_manage:
          type: boolean
          description: Whether this user can add and remove people and change the channel.
        archived:
          type: boolean
          description: Archived channels are read-only.
        group_managed:
          type: boolean
          description: Members are exactly the people of the channel's directory groups.
        unread_count:
          type: integer
          description: Messages of others after the read position, counted up to 100.
        mention_count:
          type: integer
          description: Unread messages that mention the user, counted up to 100.
        last_read_id:
          type: string
          format: uuid
          nullable: true
        participants:
          type: array
          description: The other people of a direct or group conversation (empty for channels).
          items: { $ref: '#/components/schemas/Person' }
        category_id:
          type: string
          format: uuid
          nullable: true
    ChannelUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        visibility:
          type: string
          enum: [public, private]
        topic: { type: string, maxLength: 250 }
    Presence:
      type: object
      required: [user_id, status]
      properties:
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [online, away, dnd] }
    Person:
      type: object
      required: [id, display_name, email]
      properties:
        is_bot: { type: boolean, description: A bot (shows a badge). }
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string }
    Member:
      type: object
      required: [user, role]
      properties:
        user: { $ref: '#/components/schemas/Person' }
        role:
          type: string
          enum: [member, manager]
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
    NewChannel:
      type: object
      required: [workspace_id, name]
      properties:
        workspace_id: { type: string, format: uuid }
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Display name, unique regardless of case; surrounding spaces are removed.
        topic: { type: string, maxLength: 250 }
        kind:
          type: string
          enum: [standard, announcement]
          default: standard
        visibility:
          type: string
          enum: [public, private]
          default: public
        is_default:
          type: boolean
          default: false
          description: Make every user, now and later, a member.
    Author:
      type: object
      required: [id, display_name]
      properties:
        is_bot: { type: boolean, description: Sent by a bot. }
        id: { type: string, format: uuid }
        display_name: { type: string }
    Message:
      type: object
      required:
        [id, channel_id, author, body, nonce, created_at, edited_at, mentions, reactions, attachments, files]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/Author' }
        body:
          type: string
          description: |
            Markdown (CommonMark with GitHub tables, strikethrough and task lists); clients
            render it without raw HTML. `<@user-id>` mentions a person.
        mentions:
          type: array
          description: The people the message mentions (members of the channel).
          items: { $ref: '#/components/schemas/Author' }
        reactions:
          type: array
          description: Reactions in the order they were first used; `me` is the reader's own.
          items: { $ref: '#/components/schemas/Reaction' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileInfo' }
        nonce:
          type: string
          description: The client's nonce, so the sender can match its pending message.
        created_at: { type: string, format: date-time }
        edited_at:
          type: string
          format: date-time
          nullable: true
    GroupMapping:
      type: object
      required: [group, role]
      properties:
        group: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, enum: [admin, member, guest] }
    ChannelGroups:
      type: object
      required: [groups, managed]
      properties:
        groups:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 200 }
        managed: { type: boolean }
    FileInfo:
      type: object
      required: [id, name, content_type, size, width, height, has_thumbnail]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        has_thumbnail: { type: boolean }
    ChannelFile:
      allOf:
        - $ref: '#/components/schemas/FileInfo'
        - type: object
          required: [message_id, uploader, created_at]
          properties:
            message_id: { type: string, format: uuid }
            uploader: { $ref: '#/components/schemas/Author' }
            created_at: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
    NewMessage:
      type: object
      required: [body, nonce]
      properties:
        body:
          type: string
          maxLength: 4000
          description: Markdown; may be empty when the message has attachments or files.
        nonce: { type: string, minLength: 8, maxLength: 64 }
        attachments:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Attachment' }
        file_ids:
          type: array
          maxItems: 10
          description: Ready files the sender uploaded into this channel (see createUpload).
          items: { type: string, format: uuid }
    Reaction:
      type: object
      required: [emoji, count, me]
      properties:
        emoji: { type: string }
        count: { type: integer }
        me: { type: boolean }
    Attachment:
      type: object
      description: A card under a message, e.g. from a bot (an issue, an alert).
      properties:
        title: { type: string, maxLength: 200 }
        title_link:
          type: string
          maxLength: 2000
          description: An http(s) URL the title links to.
        text: { type: string, maxLength: 2000, description: Markdown. }
        color:
          type: string
          enum: [neutral, info, success, warning, danger]
          description: The stripe on the card's edge (meaning is never the color alone).
        fields:
          type: array
          maxItems: 10
          items:
            type: object
            required: [title, value]
            properties:
              title: { type: string, maxLength: 100 }
              value: { type: string, maxLength: 500 }
              short: { type: boolean, description: Two short fields share a row. }
        footer: { type: string, maxLength: 200 }
    MessagePage:
      type: object
      required: [messages, has_more]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        has_more: { type: boolean }
    Permissions:
      type: object
      required: [create_workspaces, upload_files, max_file_size]
      description: |
        What the user may do across the instance. Rights inside a workspace follow
        the role there (see Workspace).
      properties:
        create_workspaces: { type: boolean }
        upload_files:
          type: boolean
          description: Files can be shared (an object store is configured).
        max_file_size: { type: integer, format: int64 }
    Logout:
      type: object
      required: [end_session_url]
      properties:
        end_session_url:
          type: string
          description: Sign-out page of Cenacle ID; empty if it is not known.
