# SPDX-License-Identifier: Apache-2.0
openapi: 3.0.3
info:
  title: Cenacle chat API
  version: 0.3.0
  description: |
    HTTP API of the Cenacle chat server. Every error is an RFC 9457 problem
    (`application/problem+json`) with a stable `code` and the `request_id`.

    Authentication: the web app uses the `HttpOnly` session cookie set at the end
    of sign-in; other clients send `Authorization: Bearer <session token>`.
    Cookie-authenticated requests that change state must come from the app's own
    origin (`Origin` or `Sec-Fetch-Site: same-origin`).
  license:
    name: Apache-2.0
servers:
  - url: /
tags:
  - name: auth
    description: Sign-in with Cenacle ID and sessions
paths:
  /api/auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Start sign-in with Cenacle ID
      description: |
        Redirects the browser to Cenacle ID (authorization code flow with PKCE).
        After sign-in the browser returns to `return_to`. If Cenacle ID cannot be
        reached, it redirects to `/signin?error=unavailable` instead.
      security: []
      parameters:
        - name: return_to
          in: query
          description: Path inside the app to open after sign-in (default `/`).
          schema: { type: string, maxLength: 2048 }
      responses:
        '302':
          description: Redirect to the authorization endpoint of Cenacle ID.
  /api/auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: Finish sign-in (redirect target of Cenacle ID)
      description: |
        Exchanges the authorization code, creates the session and sets the
        session cookie, then redirects to the saved `return_to`. On failure it
        redirects to `/signin?error=<code>`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirect into the app.
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: |
        Ends the session and clears the cookie. The response names the
        Cenacle ID sign-out page, which the browser can open to end the
        single sign-on session too. Without a session it succeeds as well.
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Logout' }
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The current session and its user
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          $ref: '#/components/responses/Problem'
security:
  - cookie: []
  - bearer: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: cenacle_session
      description: '`__Host-cenacle_session` when the app is served over https.'
    bearer:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable error code (snake_case).
        request_id: { type: string }
    User:
      type: object
      required: [id, email, email_verified, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        display_name: { type: string }
    Session:
      type: object
      required: [user, created_at, expires_at, idle_timeout_seconds]
      properties:
        user: { $ref: '#/components/schemas/User' }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Absolute end of the session.
        idle_timeout_seconds:
          type: integer
          description: The session also ends after this long without use.
    Logout:
      type: object
      required: [end_session_url]
      properties:
        end_session_url:
          type: string
          description: Sign-out page of Cenacle ID; empty if it is not known.
