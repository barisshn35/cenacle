# SPDX-License-Identifier: AGPL-3.0-only
openapi: 3.0.3
info:
  title: Cenacle chat API
  version: 0.99.2
  description: |
    HTTP API of the Cenacle chat server. Every error is an RFC 9457 problem
    (`application/problem+json`) with a stable `code` and the `request_id`.

    Authentication: the web app uses the `HttpOnly` session cookie set at the end
    of sign-in; other clients send `Authorization: Bearer <session token>`.
    Cookie-authenticated requests that change state must come from the app's own
    origin (`Origin` or `Sec-Fetch-Site: same-origin`).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
tags:
  - name: workspaces
    description: Workspaces, their members and invitations
  - name: automation
    description: Workflows, forms and approvals
  - name: collaboration
    description: Channel tabs, canvases and lists
  - name: federation
    description: Channels shared with other Cenacle servers
  - name: ai
    description: Optional AI features with a model the operator runs (off by default)
  - name: compliance
    description: Retention, legal holds, eDiscovery, classifications and access rules
  - name: auth
    description: Sign-in with Cenacle ID and sessions
  - name: chat
    description: Channels and messages
  - name: realtime
    description: Live events over WebSocket
  - name: files
    description: Files shared in channels (stored in an S3-compatible object store)
  - name: search
    description: Searching messages and files
  - name: notifications
    description: What notifies people, sounds, web push and e-mail
  - name: threads
    description: Replies in threads, followed threads and activity
  - name: saved
    description: Messages saved for later
  - name: community
    description: Polls, events, onboarding, the banner and terms of service
  - name: moderation
    description: Reports, AutoMod, timeouts and slow mode
  - name: playbooks
    description: Checklists teams run again and again
paths:
  /api/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: The user's workspaces, the default one first
      responses:
        '200':
          description: Workspaces with the user's role.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace (the instance administrator)
      description: The creator becomes its owner; a General channel for everyone is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      operationId: renameWorkspace
      summary: Change a workspace's name, description or settings (owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                edit_history:
                  type: string
                  enum: [author, everyone]
                  description: Who sees the earlier versions of edited messages.
                persistent_notifications:
                  type: boolean
                  description: Urgent messages may remind the people they mention.
                persistent_every_minutes: { type: integer, minimum: 1, maximum: 60 }
                persistent_times: { type: integer, minimum: 1, maximum: 20 }
                read_receipts:
                  type: boolean
                  description: People see how far others read in conversations (off by default).
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/permissions:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [workspaces]
      operationId: setWorkspacePermissions
      summary: Set which roles may do what in the workspace (owners and admins)
      description: |
        Permissions left out keep their defaults. Owners may always do everything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: object
                  description: Each permission's roles (admin, member, guest).
                  additionalProperties:
                    type: array
                    items: { type: string }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/icon:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [workspaces]
      operationId: setWorkspaceIcon
      summary: Set the workspace's icon (owners and admins)
      description: A PNG, JPEG, GIF or WebP image of at most 5 MB; it is cut to a square.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [workspaces]
      operationId: deleteWorkspaceIcon
      summary: Remove the workspace's icon (owners and admins)
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/members:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workspaces]
      operationId: listWorkspaceMembers
      summary: Members of a workspace with their roles
      responses:
        '200':
          description: Owners first, then admins, then members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceMember' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      operationId: setWorkspaceRole
      summary: Change someone's role
      description: |
        Admins make members admins and back; only owners grant or take the owner
        role. A workspace always keeps at least one owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member, guest] }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMember' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [workspaces]
      operationId: removeWorkspaceMember
      summary: Remove someone from a workspace (owners and admins), or leave it yourself
      description: |
        They leave all its channels too. Nobody leaves the default workspace, and the
        last owner cannot leave.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/conversations:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: openConversation
      summary: Open a direct or group conversation
      description: |
        With one other person a direct conversation, with 2 to 8 a group. The same
        people always get the same conversation back (200); a new one answers 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The existing conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '201':
          description: A new conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/presence:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [realtime]
      operationId: listPresence
      summary: Who of a workspace is online, away or busy
      description: Members not listed are offline. Changes arrive as `presence.changed`.
      responses:
        '200':
          description: Statuses.
          content:
            application/json:
              schema:
                type: object
                required: [presence]
                properties:
                  presence:
                    type: array
                    items: { $ref: '#/components/schemas/Presence' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/profiles:
    get:
      tags: [profiles]
      operationId: getProfiles
      summary: Profiles of people
      description: Up to 100 ids; people the caller may not see are left out.
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/Profile' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/me/export:
    get:
      tags: [account]
      operationId: exportMyData
      summary: Download everything stored about you (NDJSON)
      responses:
        '200':
          description: Your data, one item per line.
          content:
            application/x-ndjson:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/me/profile:
    get:
      tags: [profiles]
      operationId: getMyProfile
      summary: Your profile and its settings
      responses:
        '200':
          description: Your profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [profiles]
      operationId: updateMyProfile
      summary: Change your @username, time zone or who sees when you were last online
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                username:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9._-]{1,29}$'
                  description: Not for accounts whose @username is the directory's.
                timezone:
                  type: string
                  maxLength: 64
                  description: An IANA time zone such as Europe/Istanbul.
                show_last_seen: { type: boolean }
                share_read_receipts:
                  type: boolean
                  description: Others see how far you read conversations (where a workspace turned read receipts on); off, you see theirs neither.
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/me/status:
    put:
      tags: [profiles]
      operationId: setCustomStatus
      summary: Set your custom status
      description: An emoji, a text or both; it clears itself at `expires_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomStatus' }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [profiles]
      operationId: clearCustomStatus
      summary: Clear your custom status
      responses:
        '204':
          description: Cleared.
        '401':
          $ref: '#/components/responses/Problem'
  /api/me/avatar:
    put:
      tags: [profiles]
      operationId: setAvatar
      summary: Set your profile picture
      description: |
        A PNG, JPEG, GIF or WebP image of at most 5 MB. It is cut to a square; an
        animated GIF (at most 2 MB) keeps moving, with a still first frame for people
        who reduce motion.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [profiles]
      operationId: deleteAvatar
      summary: Remove your profile picture
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
  /api/pictures/{picture_id}:
    parameters:
      - name: picture_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [profiles]
      operationId: getPicture
      summary: A profile picture or workspace icon
      description: Cached for good (a new picture gets a new id).
      parameters:
        - name: still
          in: query
          description: The first frame of an animated picture.
          schema: { type: boolean }
      responses:
        '200':
          description: PNG or GIF.
          content:
            image/png:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/me/appearance:
    get:
      tags: [appearance]
      operationId: getMyAppearance
      summary: Your appearance settings
      responses:
        '200':
          description: The settings (defaults filled in).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appearance' }
        '401':
          $ref: '#/components/responses/Problem'
    put:
      tags: [appearance]
      operationId: setMyAppearance
      summary: Save your appearance settings (they follow you to every device)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Appearance' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appearance' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/me/fonts:
    get:
      tags: [appearance]
      operationId: listMyFonts
      summary: Fonts you uploaded
      responses:
        '200':
          description: Your fonts.
          content:
            application/json:
              schema:
                type: object
                required: [fonts]
                properties:
                  fonts:
                    type: array
                    items: { $ref: '#/components/schemas/UserFont' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [appearance]
      operationId: uploadFont
      summary: Upload a font for yourself
      description: WOFF2, WOFF, TrueType or OpenType, at most 2 MB; five per person.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 60 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserFont' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/me/fonts/{font_id}:
    parameters:
      - name: font_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [appearance]
      operationId: deleteFont
      summary: Remove a font you uploaded
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/fonts/{font_id}:
    parameters:
      - name: font_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [appearance]
      operationId: getFont
      summary: A font you uploaded (only for you)
      responses:
        '200':
          description: The font file.
          content:
            font/woff2:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: What the server offers, before signing in
      description: |
        Public. The web app reads it first: when the web app is turned off it
        shows where to get the desktop and mobile apps instead of signing in.
      security: []
      responses:
        '200':
          description: The server's offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
  /api/admin/overview:
    get:
      tags: [admin]
      operationId: adminOverview
      summary: The installation at a glance (instance administrators)
      responses:
        '200':
          description: Version, counts, configuration and background jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: Everyone of the installation, by name (instance administrators)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: after_name, in: query, schema: { type: string } }
        - { name: after_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Up to 50 people; next continues the list.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
                  next:
                    type: object
                    required: [after_name, after_id]
                    properties:
                      after_name: { type: string }
                      after_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/users/{user_id}/sessions:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [admin]
      operationId: adminEndUserSessions
      summary: Sign someone out everywhere (instance administrators)
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/admin/workspaces:
    get:
      tags: [admin]
      operationId: adminListWorkspaces
      summary: Every workspace with its size (instance administrators)
      responses:
        '200':
          description: Workspaces.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/AdminWorkspace' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/bots:
    get:
      tags: [admin]
      operationId: adminListBots
      summary: Every bot of every workspace (instance administrators)
      responses:
        '200':
          description: Bots.
          content:
            application/json:
              schema:
                type: object
                required: [bots]
                properties:
                  bots:
                    type: array
                    items: { $ref: '#/components/schemas/AdminBot' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/bots/{bot_id}:
    parameters:
      - { name: bot_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [admin]
      operationId: adminSetBotDisabled
      summary: Turn a bot off or on (instance administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        '204': { description: Changed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/admin/notification-policy:
    get:
      tags: [admin]
      operationId: getNotificationPolicy
      summary: What notifications outside the app may show (instance administrators)
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPolicy' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [admin]
      operationId: setNotificationPolicy
      summary: Choose what notifications outside the app may show
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPolicy' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPolicy' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/session-policy:
    get:
      tags: [admin]
      operationId: getSessionPolicy
      summary: How long sessions last and which networks may sign in (instance administrators)
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPolicy' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [admin]
      operationId: setSessionPolicy
      summary: Set how long sessions last and which networks may sign in
      description: |
        Shorter limits end existing sessions too. Administration networks must include
        the address the change comes from.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionPolicy' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPolicy' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/federation-policy:
    get:
      tags: [admin]
      operationId: getFederationPolicy
      summary: Which servers workspaces may connect to (instance administrators)
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederationPolicy' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [admin]
      operationId: setFederationPolicy
      summary: Set which servers workspaces may connect to
      description: Connections to servers it leaves out stop sending and receiving.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FederationPolicy' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederationPolicy' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/audit:
    get:
      tags: [admin]
      operationId: listInstanceAudit
      summary: The audit log of the whole installation (instance administrators)
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid }, description: Events older than this one (cursor). }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: prefix, in: query, schema: { type: string, maxLength: 60 }, description: Actions starting with this. }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [events, has_more]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/audit/export:
    get:
      tags: [admin]
      operationId: exportInstanceAudit
      summary: Download the audit log as NDJSON, newest first (instance administrators)
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid }, description: Events older than this one (cursor). }
        - { name: prefix, in: query, schema: { type: string, maxLength: 60 }, description: Actions starting with this. }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: One event per line.
          content:
            application/x-ndjson:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/audit-stream:
    get:
      tags: [admin]
      operationId: getAuditStream
      summary: Where the audit log streams to (instance administrators)
      responses:
        '200':
          description: The stream.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditStream' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [admin]
      operationId: setAuditStream
      summary: Stream the audit log to a SIEM
      description: Streaming starts with the events written after the change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditStream' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditStream' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/users/{user_id}/export:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      operationId: exportUserData
      summary: Everything stored about a person, for a data subject request (instance administrators)
      description: |
        NDJSON: one line per item, each with its kind (profile, workspace, channel,
        message, reaction, file, session, audit). Recorded in the audit log.
      responses:
        '200':
          description: The data.
          content:
            application/x-ndjson:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/admin/users/{user_id}/erase:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      operationId: eraseUser
      summary: Erase a person (right to erasure; instance administrators)
      description: |
        The account is anonymized and can no longer sign in; their messages are deleted
        unless a legal hold keeps them; their reactions, saved items, scheduled
        messages, devices and sessions go. Cannot be undone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: The person's display name, typed to confirm. }
      responses:
        '200':
          description: Erased.
          content:
            application/json:
              schema:
                type: object
                required: [messages_erased, messages_held]
                properties:
                  messages_erased: { type: integer }
                  messages_held: { type: integer, description: Messages a legal hold keeps (erased when it is released). }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/admin/web-app:
    get:
      tags: [meta]
      operationId: getWebApp
      summary: Whether the web app is on (instance administrators)
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAppSetting' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    put:
      tags: [meta]
      operationId: setWebApp
      summary: Turn the web app on or off (instance administrators)
      description: |
        Off: nobody can use Cenacle in a web browser; signed-in browsers are
        signed out at their next request. The desktop and mobile apps keep
        working. Refused while CENACLE_WEB_APP decides it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAppSetting' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/ui-texts:
    get:
      tags: [appearance]
      operationId: getUITexts
      summary: Interface texts the administrators replaced
      description: Public (the sign-in page uses them too). Keys are those of the app's translations.
      security: []
      responses:
        '200':
          description: Texts by language and key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UITexts' }
    put:
      tags: [appearance]
      operationId: setUITexts
      summary: Replace interface texts (instance administrators)
      description: Only the keys in `editable` may be changed; an empty text restores the original.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale, texts]
              properties:
                locale: { type: string, enum: [en, tr] }
                texts:
                  type: object
                  additionalProperties: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UITexts' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/appearance:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [workspaces]
      operationId: setWorkspaceAppearance
      summary: The workspace's default theme preset and font template (owners and admins)
      requestBody:
