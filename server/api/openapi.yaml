      responses:
        '204':
          description: Saved; your other devices see `thread.followed`.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/me/threads/{root_id}/read:
    parameters:
      - name: root_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [threads]
      operationId: markThreadRead
      summary: Move your read position in a followed thread forward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id: { type: string, format: uuid }
      responses:
        '204':
          description: Saved; your other devices see `thread.read`.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/me/saved:
    get:
      tags: [saved]
      operationId: listSaved
      summary: Messages you saved for later, newest first (up to 500)
      responses:
        '200':
          description: Saved messages.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SavedItem' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/me/saved/{message_id}:
    parameters:
      - name: message_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [saved]
      operationId: saveMessage
      summary: Save a message for later, set its reminder or mark it done
      description: |
        A reminder is a message from the system bot at `remind_at` with a link to the
        saved message; changing it or marking the item done cancels the old one. Up to
        500 saved messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remind_at: { type: string, format: date-time, nullable: true }
                done: { type: boolean }
      responses:
        '200':
          description: The saved item; your other devices see `saved.changed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedItem' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [saved]
      operationId: unsaveMessage
      summary: Remove a message from your saved ones
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
  /api/me/activity:
    get:
      tags: [threads]
      operationId: listActivity
      summary: Mentions, replies in your threads and reactions to your messages (30 days)
      parameters:
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: before, in: query, description: The time of the last item of the previous page., schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Activity, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityItem' }
                  has_more: { type: boolean }
        '401':
          $ref: '#/components/responses/Problem'
  /api/me/unreads:
    get:
      tags: [chat]
      operationId: listUnreads
      summary: The unread messages of a workspace's channels (20 latest per channel)
      parameters:
        - { name: workspace_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Channels with unread messages.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items:
                      type: object
                      required: [channel_id, messages]
                      properties:
                        channel_id: { type: string, format: uuid }
                        messages:
                          type: array
                          items: { $ref: '#/components/schemas/Message' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/messages/{message_id}/restore:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: message_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: restoreMessage
      summary: Undo deleting a message (whoever may delete it)
      responses:
        '200':
          description: Restored; members receive `message.created` again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/categories:
    get:
      tags: [chat]
      operationId: listCategories
      summary: Channel categories of a workspace, in order
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: createCategory
      summary: Create a category (workspace owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, name]
              properties:
                workspace_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Created, last in order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [chat]
      operationId: updateCategory
      summary: Rename or move a category (workspace owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                position: { type: integer }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [chat]
      operationId: deleteCategory
      summary: Delete a category (workspace owners and admins); its channels stay
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/members:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listChannelMembers
      summary: Members of a channel (members only)
      responses:
        '200':
          description: Managers first, then by name.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: addChannelMember
      summary: Add someone to a channel (channel managers)
      description: |
        The only way into a private channel. Managers are the channel's creator
        and the administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Member (also when already a member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/members/{user_id}:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [chat]
      operationId: setChannelMemberRole
      summary: Make a member a channel manager, or back (channel managers)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [member, manager] }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [chat]
      operationId: removeChannelMember
      summary: Remove someone from a channel (channel managers)
      description: Not from mandatory channels; to remove yourself, leave the channel.
      responses:
        '204':
          description: Not a member any more.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/users:
    get:
      tags: [chat]
      operationId: searchUsers
      summary: Find members of a workspace by name or e-mail address
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Matching people, by name.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/channels/directory:
    get:
      tags: [chat]
      operationId: listChannelDirectory
      summary: Channels of a workspace the user can see, with membership
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Public channels and the private channels the user belongs to;
            `is_member` tells which ones the user belongs to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/join:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: joinChannel
      summary: Join a public channel
      description: Private channels are joined only when a manager adds you (404 otherwise).
      responses:
        '200':
          description: Member (also when already a member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/leave:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: leaveChannel
      summary: Leave a channel
      description: Mandatory channels cannot be left (403, code `channel_mandatory`).
      responses:
        '204':
          description: Not a member any more.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/groups:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workspaces]
      operationId: listWorkspaceGroups
      summary: Directory groups that give membership of the workspace (owners and admins)
      responses:
        '200':
          description: The mappings and the group names people of the instance are in.
          content:
            application/json:
              schema:
                type: object
                required: [mappings, groups]
                properties:
                  mappings:
                    type: array
                    items: { $ref: '#/components/schemas/GroupMapping' }
                  groups:
                    type: array
                    items: { type: string }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [workspaces]
      operationId: setWorkspaceGroup
      summary: Give the members of a directory group membership of the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupMapping' }
      responses:
        '200':
          description: Saved; people of the group join now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMapping' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/workspaces/{workspace_id}/groups/{group}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: group
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [workspaces]
      operationId: deleteWorkspaceGroup
      summary: Stop giving membership to a directory group
      description: People who are in the workspace only through this group leave it.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/groups:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: getChannelGroups
      summary: Directory groups of a channel (its managers)
      responses:
        '200':
          description: The channel's groups.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelGroups' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [chat]
      operationId: setChannelGroups
      summary: Set the directory groups of a channel
      description: |
        Members of the groups (in the channel's workspace) join. With `managed`, the
        members are exactly the people of the groups: others are removed and nobody
        is added or leaves by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelGroups' }
      responses:
        '200':
          description: Saved and applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelGroups' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/files:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [files]
      operationId: listChannelFiles
      summary: Files shared in a channel, newest first
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: A page of files.
          content:
            application/json:
              schema:
                type: object
                required: [files, has_more]
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelFile' }
                  has_more: { type: boolean }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [files]
      operationId: createUpload
      summary: Start uploading a file into a channel
      description: |
        Returns a form to POST the file to (multipart, the fields first and the
        file last as `file`); it accepts exactly `size` bytes for 15 minutes. Then
        call `complete`. Files that are not sent with a message within a day are
        removed. 503 `files_disabled` when no object store is configured, 413
        `file_too_large` above the limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                size: { type: integer, format: int64, minimum: 1 }
                content_type: { type: string, maxLength: 255 }
                media_kind: { type: string, enum: [voice, clip], description: Recorded in the app. }
                duration_ms: { type: integer, minimum: 0, maximum: 3600000 }
                waveform:
                  type: array
                  maxItems: 64
                  items: { type: integer, minimum: 0, maximum: 255 }
      responses:
        '201':
          description: The file and its upload form.
          content:
            application/json:
              schema:
                type: object
                required: [file, upload]
                properties:
                  file: { $ref: '#/components/schemas/FileInfo' }
                  upload:
                    type: object
                    required: [url, fields]
                    properties:
                      url: { type: string }
                      fields:
                        type: object
                        additionalProperties: { type: string }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/files/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [files]
      operationId: deleteUpload
      summary: Remove an uploaded file that no message carries yet
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/files/{file_id}/complete:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [files]
      operationId: completeUpload
      summary: Check an upload and make the file ready to send
      description: |
        Verifies the stored size, scans it when a virus scanner is configured and
        makes a preview of images. 409 `upload_incomplete` when the object store
        does not have the whole file; 422 `file_blocked` when the scanner rejects it.
      responses:
        '200':
          description: The ready file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfo' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/files/{file_id}/content:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [files]
      operationId: getFileContent
      summary: The file itself
      description: |
        Images, audio and video (and PDFs) are shown in the browser; everything else,
        and anything with `download=true`, is downloaded. Supports ranges.
      parameters:
        - name: download
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: The bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: A range of the bytes.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/files/{file_id}/thumbnail:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [files]
      operationId: getFileThumbnail
      summary: A small preview of an image (at most 480 pixels wide and high)
      responses:
        '200':
          description: JPEG or PNG.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/channels/{channel_id}/messages:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [chat]
      operationId: listMessages
      summary: Messages of a channel, newest page first
      description: |
        Members only (403, code `not_a_member`).

        Cursor pagination: without `before` the newest messages; with `before`
        (a message id) the messages older than it. Each page is in chronological
        order; `has_more` says whether older messages exist.
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: createMessage
      summary: Send a message
      description: |
        Members only. In announcement channels only the administrator can
        send (403, code `read_only_channel`).

        `nonce` is chosen by the client for each message. Sending the same nonce
        again (a retry after a lost response) returns the existing message
        instead of creating a second one. Everyone in the channel receives a
        `message.created` event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMessage' }
      responses:
        '201':
          description: Created (or already created with this nonce).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
