        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/search/messages:
    get:
      tags: [search]
      operationId: searchMessages
      summary: Search the messages of your channels and conversations
      description: |
        Every word must begin a word of the message (accents and case do not matter);
        `-word` leaves out messages with it. Newest first; `before` continues a page.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: channel_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: Only messages of this person., schema: { type: string, format: uuid } }
        - { name: after, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: has, in: query, schema: { type: string, enum: [file, link] } }
        - { name: before, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Matching messages.
          content:
            application/json:
              schema:
                type: object
                required: [results, has_more]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/SearchMessage' }
                  has_more: { type: boolean }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/search/files:
    get:
      tags: [search]
      operationId: searchFiles
      summary: Search files of your channels by name and by the text inside them
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: before, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Matching files.
          content:
            application/json:
              schema:
                type: object
                required: [results, has_more]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/SearchFile' }
                  has_more: { type: boolean }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/search/content:
    get:
      tags: [search]
      operationId: searchContent
      summary: Search the canvases and lists of your channels
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Matching canvases and list rows (20 each at most, newest first).
          content:
            application/json:
              schema:
                type: object
                required: [canvases, items]
                properties:
                  canvases:
                    type: array
                    items:
                      type: object
                      required: [tab_id, title, channel, excerpt, updated_at]
                      properties:
                        tab_id: { type: string, format: uuid }
                        title: { type: string }
                        channel: { $ref: '#/components/schemas/SearchChannel' }
                        excerpt: { type: string, description: 'The matching words, between « and ».' }
                        updated_at: { type: string, format: date-time }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, tab_id, list_title, channel, updated_at]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        tab_id: { type: string, format: uuid }
                        list_title: { type: string }
                        channel: { $ref: '#/components/schemas/SearchChannel' }
                        updated_at: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
