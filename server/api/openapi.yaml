        '429': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /api/workspaces/{workspace_id}/ai/compose:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [ai]
      operationId: composeWithAI
      summary: Rewrite a draft (clearer, shorter, more formal, friendlier, or in another language)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, action]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
                action: { type: string, enum: [improve, shorter, formal, friendly, translate] }
                language: { type: string, maxLength: 10, description: 'translate: the target language (e.g. en, tr).' }
      responses:
        '200':
          description: The rewritten text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIAnswer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /api/workspaces/{workspace_id}/ai/ask:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [ai]
      operationId: askAI
      summary: Answer a question from the messages the asker can read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 3, maxLength: 500 }
                language: { type: string, maxLength: 10 }
      responses:
        '200':
          description: The answer and the messages it used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIAnswer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /api/workspaces/{workspace_id}/federation:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [federation]
      operationId: getFederation
      summary: Connections to other servers and channels they offered (owners and admins)
      responses:
        '200':
          description: Connections and offers.
          content:
            application/json:
              schema:
                type: object
                required: [connections, offers]
                properties:
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/FederationConnection' }
                  offers:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelOffer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/workspaces/{workspace_id}/federation/invites:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [federation]
      operationId: createFederationInvite
      summary: An invitation code for another server's admins (owners and admins; shown once, valid a day)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, description: What the other server is called here. }
      responses:
        '201':
          description: The code.
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at]
                properties:
                  code: { type: string }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/workspaces/{workspace_id}/federation/connections:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [federation]
      operationId: connectFederation
      summary: Connect to another server with its invitation code (owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 2000 }
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: The connection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederationConnection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /api/federation/connections/{connection_id}:
    parameters:
      - { name: connection_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [federation]
      operationId: updateFederationConnection
      summary: Pause or resume a connection, or change what it takes in (owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                enabled: { type: boolean }
                policy: { $ref: '#/components/schemas/ConnectionPolicy' }
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederationConnection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [federation]
      operationId: deleteFederationConnection
      summary: Remove a connection; its channels stop being shared (owners and admins)
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/federation/connections/{connection_id}/accept-v1:
    parameters:
      - { name: connection_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [federation]
      operationId: acceptFederationV1
      summary: Take requests signed only with v1 from the other server again, until it next signs with v2 (owners and admins)
      description: >-
        For a server moved back below 0.99.2 on purpose. Its requests are then
        no longer bound to the connection and the endpoint; the connection
        requires v2 again as soon as the server signs with it.
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederationConnection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/federation/offers/{offer_id}/accept:
    parameters:
      - { name: offer_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [federation]
      operationId: acceptChannelOffer
      summary: Accept a shared channel as a new private channel here (owners and admins)
      responses:
        '201':
          description: The channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/federation/offers/{offer_id}:
    parameters:
      - { name: offer_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [federation]
      operationId: declineChannelOffer
      summary: Decline a shared channel (owners and admins)
      responses:
        '204': { description: Declined. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/channels/{channel_id}/shares:
    parameters:
      - { name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [federation]
      operationId: listChannelShares
      summary: The servers a channel is shared with (members)
      responses:
        '200':
          description: Shares.
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelShare' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [federation]
      operationId: shareChannel
      summary: Offer a channel to a connected server (workspace owners and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id]
              properties:
                connection_id: { type: string, format: uuid }
      responses:
        '201':
          description: The share (offered until the other side accepts).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelShare' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/channels/{channel_id}/shares/{connection_id}:
    parameters:
      - { name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: connection_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [federation]
      operationId: unshareChannel
      summary: Stop sharing a channel with a server (workspace owners and admins)
      responses:
        '204': { description: Stopped. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/federation/v1/connect:
    post:
      tags: [federation]
      operationId: federationConnect
      summary: 'Server to server: accept an invitation (signed with its secret)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: This side's connection.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/federation/v1/events:
    post:
      tags: [federation]
      operationId: federationEvents
      summary: 'Server to server: events of shared channels (signed)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204': { description: Applied. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
security:
  - cookie: []
  - bearer: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: cenacle_session
      description: '`__Host-cenacle_session` when the app is served over https.'
    bearer:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    FederationConnection:
      type: object
      required: [id, name, url, status, last_error, requires_v2, shared]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        status: { type: string, enum: [pending, active, disabled] }
        last_error: { type: string }
        last_seen_at: { type: string, format: date-time, nullable: true }
        requires_v2:
          type: boolean
          description: The other server signs with v2 (0.99.2 and later), so requests signed only with v1 are refused.
        v1_refused_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When a valid request signed only with v1 was last refused: the other
            server looks moved back below 0.99.2 (see acceptFederationV1).
        policy: { $ref: '#/components/schemas/ConnectionPolicy' }
        shared:
          type: array
          items:
            type: object
            required: [channel_id, channel_name, status]
            properties:
              channel_id: { type: string, format: uuid }
              channel_name: { type: string }
              status: { type: string, enum: [offered, active] }
    ConnectionPolicy:
      type: object
      description: What this server takes in from the other one, and how often it may send.
      required: [receive_messages, receive_reactions, receive_edits, requests_per_minute]
      properties:
        receive_messages: { type: boolean, description: New messages of its people. }
        receive_reactions: { type: boolean }
        receive_edits: { type: boolean, description: Edits and deletions of its people's messages. }
        requests_per_minute: { type: integer, minimum: 1, maximum: 6000 }
    FederationPolicy:
      type: object
      required: [mode, servers]
      properties:
        mode:
          type: string
          enum: [open, allow, deny]
          description: Every server, only the listed ones, or all but the listed ones.
        servers:
          type: array
          maxItems: 500
          description: Host names, optionally with a port; *.example.com covers its subdomains.
          items: { type: string }
    ChannelOffer:
      type: object
      required: [id, connection_id, connection_name, name, topic, created_at]
      properties:
        id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        name: { type: string }
        topic: { type: string }
        created_at: { type: string, format: date-time }
    ChannelShare:
      type: object
      required: [connection_id, connection_name, status]
      properties:
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        status: { type: string, enum: [offered, active] }
    AIConsent:
      type: object
      required: [model, host, decision]
      properties:
        model: { type: string, description: The model the operator configured. }
        host: { type: string, description: The server the model runs on (host and port). }
        policy_url: { type: string, description: The operator's page on how the model's server keeps requests; absent when none. }
        decision:
          type: string
          enum: [accepted, declined, undecided]
          description: The person's answer for this model; undecided when they were not asked yet or the model changed.
        decided_at: { type: string, format: date-time }
    AIAnswer:
      type: object
      required: [text, sources]
      properties:
        text: { type: string, description: Markdown written by the model. }
        sources:
          type: array
          description: Messages the answer was made from.
          items: { $ref: '#/components/schemas/AISource' }
    AISource:
      type: object
      required: [message_id, channel_id, channel_name, author_name, created_at]
      properties:
        message_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        author_name: { type: string }
        created_at: { type: string, format: date-time }
    Classification:
      type: object
      required: [name, description, color]
      properties:
        id: { type: string, format: uuid, description: Left out for a new one. }
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 300, description: Shown in the banner. }
        color: { type: string, enum: [neutral, info, success, warning, danger] }
    AttributeDef:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: '^[a-z0-9_]{1,32}$' }
        name: { type: string, minLength: 1, maxLength: 60 }
    Attributes:
      type: object
      description: A member's attributes by key.
      additionalProperties: { type: string, maxLength: 100 }
    AccessRule:
      type: object
      required: [key, values]
      properties:
        key: { type: string }
        values:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
    Compliance:
      type: object
      required: [retention_days, default_classification, classifications, attributes]
      properties:
        retention_days: { type: integer, nullable: true, minimum: 1, maximum: 36500, description: Days messages are kept; null keeps them. }
        default_classification: { type: string, nullable: true, description: 'The name of the classification channels show by default (names are unique).' }
        classifications:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Classification' }
        attributes:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AttributeDef' }
    ChannelCompliance:
      type: object
      required: [retention_days, classification_id, access_rules]
      properties:
        retention_days: { type: integer, nullable: true, minimum: 1, maximum: 36500, description: null follows the workspace. }
        classification_id: { type: string, format: uuid, nullable: true, description: null follows the workspace. }
        access_rules:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/AccessRule' }
    Removed:
      type: object
      required: [removed]
      properties:
        removed: { type: integer, description: Memberships ended by access rules. }
    LegalHoldInput:
      type: object
      required: [name, user_ids, channel_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        user_ids:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
        channel_ids:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
    LegalHold:
      type: object
      required: [id, name, description, user_ids, channel_ids, created_at, message_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        user_ids:
          type: array
          items: { type: string, format: uuid }
        channel_ids:
          type: array
          items: { type: string, format: uuid }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        released_at: { type: string, format: date-time, nullable: true }
        message_count: { type: integer, description: Messages the hold covers now. }
    TabInput:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [canvas, list, link] }
        title: { type: string, minLength: 1, maxLength: 80 }
        url: { type: string, maxLength: 2000, description: 'A link tab: an http(s) address.' }
        columns:
          type: array
          maxItems: 20
          description: 'A list tab: its columns (none: rows with a title only).'
          items: { $ref: '#/components/schemas/ListColumn' }
        board_column: { type: string, description: 'A list tab: a status or select column to group the board by.' }
    Tab:
      type: object
      required: [id, channel_id, kind, title, position, can_delete]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        kind: { type: string, enum: [canvas, list, link] }
        title: { type: string }
        url: { type: string }
        canvas_id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        position: { type: integer }
        can_delete: { type: boolean }
    Canvas:
      type: object
      required: [id, channel_id, title, body, version, updated_at, can_edit]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, description: Markdown. }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: '#/components/schemas/Author' }
        editing_by: { $ref: '#/components/schemas/Author' }
        can_edit: { type: boolean }
    ListColumn:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, pattern: '^[a-z0-9_]{1,32}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, enum: [text, number, select, status, person, date, checkbox] }
        options:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 60 }
    ListInput:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ListColumn' }
        board_column: { type: string, nullable: true, description: 'A status or select column to group the board by.' }
    ListValues:
      type: object
      description: 'Values by column id: text, a number as text, an option, todo/doing/done, a user id, YYYY-MM-DD or "true"/"false". An empty string clears a value.'
      additionalProperties: { type: string, maxLength: 2000 }
    ListItemInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        values: { $ref: '#/components/schemas/ListValues' }
    ListItem:
      type: object
      required: [id, list_id, title, values, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        title: { type: string }
        values: { $ref: '#/components/schemas/ListValues' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ItemList:
      type: object
      required: [id, channel_id, title, columns, items, can_edit]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        title: { type: string }
        columns:
          type: array
          items: { $ref: '#/components/schemas/ListColumn' }
        board_column: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/ListItem' }
        can_edit: { type: boolean }
    AssignedItem:
      type: object
      required: [item, list_title, tab_id, channel_id, channel_name]
      properties:
        item: { $ref: '#/components/schemas/ListItem' }
        list_title: { type: string }
        tab_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        due: { type: string, format: date }
    FormField:
      type: object
      required: [id, label, kind, required]
      properties:
        id: { type: string, pattern: '^[a-z0-9_]{1,32}$', description: 'Used in workflows as {{form.<id>}}.' }
        label: { type: string, minLength: 1, maxLength: 200 }
        kind:
          type: string
          enum: [text, textarea, number, select, multiselect, date, checkbox, person]
        required: { type: boolean }
        options:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 100 }
        help: { type: string, maxLength: 300 }
    FormInput:
      type: object
      required: [name, fields]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        fields:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/FormField' }
    Form:
      type: object
      required: [id, name, description, fields, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FormField' }
        updated_at: { type: string, format: date-time }
    FormValues:
      type: object
      description: 'Answers by field id: text, a number as text, YYYY-MM-DD, "true"/"false", a user id, or a list for multiselect.'
      additionalProperties:
        oneOf:
          - { type: string, maxLength: 4000 }
          - { type: array, items: { type: string, maxLength: 100 } }
    FormAnswer:
      type: object
      required: [id, label, kind, value]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string }
        value: { type: string, description: 'As shown: options joined with commas, a person by name.' }
    Submission:
      type: object
      required: [id, form_name, answers, created_at]
      properties:
        id: { type: string, format: uuid }
        form_id: { type: string, format: uuid, nullable: true }
        form_name: { type: string }
        user: { $ref: '#/components/schemas/Author' }
        answers:
          type: array
          items: { $ref: '#/components/schemas/FormAnswer' }
        created_at: { type: string, format: date-time }
    WorkflowSchedule:
      type: object
      required: [every, time, time_zone]
      properties:
        every: { type: string, enum: [day, weekday, week] }
        weekday: { type: integer, minimum: 0, maximum: 6, description: '0 is Sunday; for every week.' }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        time_zone: { type: string, maxLength: 64 }
    WorkflowTrigger:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [manual, member_joined, reaction, keyword, schedule, webhook]
        channel_id: { type: string, format: uuid, nullable: true }
        emoji: { type: string, maxLength: 64 }
        keyword: { type: string, maxLength: 100 }
        schedule: { $ref: '#/components/schemas/WorkflowSchedule' }
    WorkflowStep:
      type: object
      required: [id, kind]
      properties:
        id: { type: string, pattern: '^[a-z0-9_]{1,32}$' }
        kind:
          type: string
          enum: [message, dm, form, approval, delay, http]
        channel_id: { type: string, format: uuid, nullable: true, description: 'message: where; empty: the trigger''s channel.' }
        to: { type: string, nullable: true, description: 'dm: a user id; empty: the person who started the run.' }
        text: { type: string, maxLength: 4000 }
        form_id: { type: string, format: uuid, nullable: true }
        approvers:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        minutes: { type: integer, minimum: 1, maximum: 10080 }
        url: { type: string, maxLength: 2048 }
    WorkflowInput:
      type: object
      required: [name, trigger, steps]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        enabled: { type: boolean, default: true }
        trigger: { $ref: '#/components/schemas/WorkflowTrigger' }
        steps:
          type: array
          minItems: 1
          maxItems: 25
          items: { $ref: '#/components/schemas/WorkflowStep' }
    Workflow:
      type: object
      required: [id, name, description, enabled, trigger, steps, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        trigger: { $ref: '#/components/schemas/WorkflowTrigger' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStep' }
        next_run_at: { type: string, format: date-time, nullable: true }
        webhook_url: { type: string, description: 'Only when created or rotated.' }
        secret: { type: string, description: 'Signs its outgoing requests; only when created.' }
        updated_at: { type: string, format: date-time }
    WorkflowShortcut:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
    WorkflowRun:
      type: object
      required: [id, workflow_name, status, step, steps, error, created_at]
      properties:
        id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid, nullable: true }
        workflow_name: { type: string }
        status: { type: string, enum: [running, waiting, done, failed, cancelled] }
        step: { type: integer, description: 'Steps done so far.' }
        steps: { type: integer }
        error: { type: string }
        trigger_user: { $ref: '#/components/schemas/Author' }
        channel_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    Task:
      type: object
      required: [id, kind, title, status, assignees, comment, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [form, approval] }
        title: { type: string }
        status: { type: string, enum: [open, done, approved, rejected, cancelled] }
        assignees:
          type: array
          items: { type: string, format: uuid }
        form: { $ref: '#/components/schemas/Form' }
        done_by: { $ref: '#/components/schemas/Author' }
        done_at: { type: string, format: date-time, nullable: true }
        comment: { type: string }
        created_at: { type: string, format: date-time }
    LinkPreview:
      type: object
      required: [url, title, description, site_name, image_url]
      properties:
        url: { type: string }
        title: { type: string }
        description: { type: string }
        site_name: { type: string }
        image_url: { type: string, nullable: true, description: Served by Cenacle (never the original site). }
    ForwardInfo:
      type: object
      required: [message_id, channel_id, channel_name, author, body, created_at]
      properties:
        message_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        author: { $ref: '#/components/schemas/Author' }
        body: { type: string }
        created_at: { type: string, format: date-time }
    BurnInfo:
      type: object
      required: [seconds, revealed_at, hidden]
      properties:
        seconds: { type: integer }
        revealed_at: { type: string, format: date-time, nullable: true, description: When the reader revealed it. }
        hidden: { type: boolean, description: The text is left out (not revealed yet, or expired). }
    CustomEmoji:
      type: object
      required: [id, name, url, created_by]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        created_by: { type: string, format: uuid, nullable: true }
    Sticker:
      type: object
      required: [id, name, url, created_by]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        created_by: { type: string, format: uuid, nullable: true }
    Poll:
      type: object
      required: [options, multiple, anonymous, closes_at, closed, voters]
      properties:
        options:
          type: array
          items: { $ref: '#/components/schemas/PollOption' }
        multiple: { type: boolean, description: More than one option may be chosen. }
        anonymous: { type: boolean }
        closes_at: { type: string, format: date-time, nullable: true }
        closed: { type: boolean }
        voters: { type: integer, description: People who voted. }
    PollOption:
      type: object
      required: [id, text, votes, me]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        votes: { type: integer }
        me: { type: boolean, description: The reader chose it. }
        voters:
          type: array
          description: Who chose it (not in anonymous polls).
          items: { $ref: '#/components/schemas/Author' }
    NewPoll:
      type: object
      required: [options]
      properties:
        options:
          type: array
          minItems: 2
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 200 }
        multiple: { type: boolean }
        anonymous: { type: boolean }
        closes_at: { type: string, format: date-time }
    Report:
      type: object
      required: [id, message, channel, reporter, rule_name, reason, status, action, created_at, reports]
      properties:
        id: { type: string, format: uuid }
        message: { $ref: '#/components/schemas/Message' }
        channel: { $ref: '#/components/schemas/SearchChannel' }
        reporter:
          description: Who reported it; null for AutoMod (see rule_name).
          allOf: [{ $ref: '#/components/schemas/Author' }]
          nullable: true
        rule_name: { type: string }
        reason: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        action: { type: string, enum: ['', deleted, timeout, none] }
        created_at: { type: string, format: date-time }
        reports: { type: integer, description: Open reports of the same message. }
    AutomodRuleInput:
      type: object
      required: [name, kind, action]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind:
          type: string
          enum: [keywords, mentions, links]
          description: |
            keywords: any of `words` (a trailing `*` matches a word's beginning; case and
            accents do not matter); mentions: more than `max_mentions` people mentioned;
            links: links to domains not in `allowed_domains`.
        words:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 60 }
        max_mentions: { type: integer, minimum: 1, maximum: 100 }
        allowed_domains:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 253 }
        action: { type: string, enum: [block, flag], description: 'block: the message is not sent; flag: it is sent and reported.' }
        exempt_roles:
          type: array
          items: { type: string, enum: [owner, admin, member, guest] }
        enabled: { type: boolean }
    AutomodRule:
      allOf:
        - $ref: '#/components/schemas/AutomodRuleInput'
        - type: object
          required: [id, words, max_mentions, allowed_domains, exempt_roles, enabled]
          properties:
            id: { type: string, format: uuid }
    EventInput:
      type: object
      required: [title, starts_at, ends_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        location: { type: string, maxLength: 300 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        channel_id: { type: string, format: uuid, nullable: true }
    Event:
      type: object
      required: [id, workspace_id, channel_id, title, description, location, starts_at, ends_at, created_by, canceled, going, maybe, me, can_edit]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        created_by:
          allOf: [{ $ref: '#/components/schemas/Author' }]
          nullable: true
        canceled: { type: boolean }
        going:
          type: array
          items: { $ref: '#/components/schemas/Author' }
        maybe: { type: integer }
        me: { type: string, enum: [going, maybe, declined], nullable: true }
        can_edit: { type: boolean }
    Welcome:
      type: object
      required: [message, rules, channel_ids]
      properties:
        message: { type: string, maxLength: 4000, description: Markdown. }
        rules:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        channel_ids:
          type: array
          maxItems: 20
          description: Channels suggested to join.
          items: { type: string, format: uuid }
    BannerInput:
      type: object
      required: [text, level]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        level: { type: string, enum: [info, warning, critical] }
        dismissible: { type: boolean, default: true }
    Banner:
      allOf:
        - $ref: '#/components/schemas/BannerInput'
        - type: object
          required: [dismissible, updated_at]
          properties:
            updated_at: { type: string, format: date-time }
    Terms:
      type: object
      required: [id, text, created_at]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, description: Markdown. }
        created_at: { type: string, format: date-time }
    PlaybookChecklist:
      type: object
      required: [title, items]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [title]
            properties:
              title: { type: string, minLength: 1, maxLength: 200 }
              description: { type: string, maxLength: 1000 }
    PlaybookInput:
      type: object
      required: [name, checklists]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        checklists:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/PlaybookChecklist' }
    Playbook:
      allOf:
        - $ref: '#/components/schemas/PlaybookInput'
        - type: object
          required: [id, description, updated_at, runs_active]
          properties:
            id: { type: string, format: uuid }
            updated_at: { type: string, format: date-time }
            runs_active: { type: integer }
    Run:
      type: object
      required: [id, playbook_id, channel_id, name, owner, status, checklists, created_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        playbook_id: { type: string, format: uuid, nullable: true }
        channel_id: { type: string, format: uuid }
        name: { type: string }
        owner:
          allOf: [{ $ref: '#/components/schemas/Author' }]
          nullable: true
        status: { type: string, enum: [active, finished] }
        checklists:
          type: array
          items: { $ref: '#/components/schemas/RunChecklist' }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    RunChecklist:
      type: object
      required: [title, items]
      properties:
        title: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/RunItem' }
    RunItem:
      type: object
      required: [title, description, done_at, done_by, skipped, assignee_id]
      properties:
        title: { type: string }
        description: { type: string }
        done_at: { type: string, format: date-time, nullable: true }
        done_by: { type: string, format: uuid, nullable: true }
        skipped: { type: boolean }
        assignee_id: { type: string, format: uuid, nullable: true }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable error code (snake_case).
        request_id: { type: string }
    User:
      type: object
      required: [id, email, email_verified, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        display_name: { type: string }
    Session:
      type: object
      required: [user, permissions, created_at, expires_at, idle_timeout_seconds, account_url]
      properties:
        account_url:
          type: string
          description: Cenacle ID's account page (two-step verification), returning here.
        user: { $ref: '#/components/schemas/User' }
        permissions: { $ref: '#/components/schemas/Permissions' }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Absolute end of the session.
        idle_timeout_seconds:
          type: integer
          description: The session also ends after this long without use.
    DeviceSession:
      type: object
      required: [id, created_at, last_seen_at, user_agent, ip_address, current]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          description: Recorded at most once a minute.
        user_agent: { type: string }
        ip_address: { type: string }
        current:
          type: boolean
          description: The session of this request.
    AuditEvent:
      type: object
      required: [id, at, actor, action, target_type, target_id, detail]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor:
          type: object
          nullable: true
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        action:
          type: string
          description: E.g. workspace.role_changed, channel.archived, invite.created.
        target_type: { type: string }
        target_id: { type: string }
        detail:
          type: object
          additionalProperties: true
        workspace:
          type: object
          nullable: true
          description: The workspace of the event (the installation's audit log; null for account and instance events).
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        ip_address: { type: string, description: "Where it came from (the installation's audit log)." }
    AuditStream:
      type: object
      required: [kind, address, tls]
      properties:
        kind:
          type: string
          enum: [none, http, syslog]
          description: Off, signed NDJSON posted to an HTTPS endpoint, or RFC 5424 syslog over TCP.
        address:
          type: string
          maxLength: 500
          description: An https URL (http) or host:port (syslog).
        tls: { type: boolean, description: 'Syslog over TLS (RFC 5425).' }
        secret:
          type: string
          writeOnly: true
          maxLength: 200
          description: HTTP only; signs each request (X-Cenacle-Signature). Empty keeps the saved one.
        has_secret: { type: boolean, readOnly: true }
        last_error: { type: string, readOnly: true }
        last_sent_at: { type: string, format: date-time, nullable: true, readOnly: true }
    Bot:
      type: object
      required: [id, user_id, name, description, disabled, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        interactions_url:
          type: string
          nullable: true
          description: Where the bot receives button presses, menu choices and dialog submissions.
    BotToken:
      type: object
      required: [id, name, scopes, created_at, last_used_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
    Webhook:
      type: object
      required: [id, name, kind, channel_id, channel_name, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [generic, jira, gitlab, alertmanager, github, email] }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    CommandResult:
      type: object
      required: [response_type]
      properties:
        response_type:
          type: string
          enum: [ephemeral, in_channel, none]
          description: ephemeral is shown only to the caller; in_channel was posted as a message.
        text: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        message: { $ref: '#/components/schemas/Message' }
        dialog: { $ref: '#/components/schemas/Dialog' }
    InteractionResult:
      type: object
      description: What a bot answered to a button, a menu choice or a dialog.
      properties:
        text: { type: string, description: A note for the person only. }
        dialog: { $ref: '#/components/schemas/Dialog' }
        errors:
          type: object
          description: A dialog's fields the bot refused, with why (the dialog stays open).
          additionalProperties: { type: string }
    Dialog:
      type: object
      description: A form a bot opened for the person.
      required: [id, title, submit_label, elements]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        submit_label: { type: string }
        elements:
          type: array
          items: { $ref: '#/components/schemas/DialogElement' }
    DialogElement:
      type: object
      required: [name, label, type]
      properties:
        name: { type: string, pattern: '^[a-z0-9_-]{1,64}$' }
        label: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [text, textarea, select, checkbox, date] }
        placeholder: { type: string, maxLength: 150 }
        help: { type: string, maxLength: 300 }
        optional: { type: boolean }
        value: { type: string, maxLength: 3000 }
        max_length: { type: integer, minimum: 1, maximum: 3000 }
        options:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ActionOption' }
    AttachmentAction:
      type: object
      description: A button or a menu on a bot's card.
      required: [id, type, text]
      properties:
        id: { type: string, pattern: '^[a-z0-9_-]{1,64}$' }
        type: { type: string, enum: [button, select] }
        text: { type: string, minLength: 1, maxLength: 80, description: "A button's label, a menu's placeholder." }
        style: { type: string, enum: [default, primary, danger] }
        value: { type: string, maxLength: 200, description: "Sent back when the button is pressed." }
        options:
          type: array
          maxItems: 25
          items: { $ref: '#/components/schemas/ActionOption' }
    ActionOption:
      type: object
      required: [text, value]
      properties:
        text: { type: string, minLength: 1, maxLength: 80 }
        value: { type: string, minLength: 1, maxLength: 200 }
    CommandInfo:
      type: object
      required: [trigger, description, hint, builtin]
      properties:
        trigger: { type: string }
        description: { type: string }
        hint: { type: string }
        builtin: { type: boolean }
    SlashCommand:
      type: object
      required: [id, trigger, url, description, hint, created_at]
      properties:
        id: { type: string, format: uuid }
        trigger: { type: string }
        url: { type: string }
        description: { type: string }
        hint: { type: string }
        created_at: { type: string, format: date-time }
    Subscription:
      type: object
      required: [id, url, events, created_at, disabled]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        events:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        disabled: { type: boolean }
    Delivery:
      type: object
      required: [id, event_type, status, attempts, last_status, last_error, created_at, delivered_at, next_attempt_at]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        attempts: { type: integer }
        last_status: { type: integer, nullable: true }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
        next_attempt_at: { type: string, format: date-time }
    ScheduledMessage:
      type: object
      required: [id, kind, channel_id, channel_name, workspace_id, body, send_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [message, reminder] }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        workspace_id: { type: string, format: uuid }
        body: { type: string }
        send_at: { type: string, format: date-time }
    WsTicket:
      type: object
      required: [ticket, expires_in]
      properties:
        ticket: { type: string }
        expires_in:
          type: integer
          description: Seconds until the ticket expires.
    Workspace:
      type: object
      required: [id, name, description, icon_url, appearance, is_default, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        icon_url:
          type: string
          nullable: true
          description: The workspace's icon, or null (the app shows its initials).
        appearance: { $ref: '#/components/schemas/WorkspaceAppearance' }
        is_default:
          type: boolean
          description: Everyone who signs in belongs to the default workspace.
        ai_enabled: { type: boolean, description: The workspace turned on the AI features. }
        role:
          type: string
          enum: [owner, admin, member, guest]
          description: Guests see only the channels they are in and the people in them.
        timeout_until:
          type: string
          format: date-time
          nullable: true
          description: Until then you may not post or react here (a moderator's timeout).
        needs_onboarding:
          type: boolean
          description: The workspace has a welcome you have not seen yet.
        edit_history:
          type: string
          enum: [author, everyone]
          description: Who sees the earlier versions of edited messages (their author, or everyone who sees them).
        persistent_notifications:
          type: boolean
          description: Urgent messages may remind the people they mention until they acknowledge them.
        persistent_every_minutes: { type: integer, description: How often they are reminded. }
        persistent_times: { type: integer, description: How many times at most. }
        read_receipts:
          type: boolean
          description: Read receipts in conversations are on (administrators turn them on).
        spillage_reviewers:
          type: array
          description: Who reviews spillage reports (empty, the owners).
          items: { type: string, format: uuid }
        permissions:
          type: object
          description: |
            The workspace's permission scheme: each permission's roles (owners may
            always). Permissions are create_channels, invite_people,
            manage_categories, custom_emoji, broadcast_mentions, group_mentions and
            guest_links.
          additionalProperties:
            type: array
            items: { type: string }
        can:
          type: array
          description: The permissions of your role here.
          items: { type: string }
    WorkspaceMember:
      type: object
      required: [user, role]
      properties:
        user: { $ref: '#/components/schemas/Person' }
        role: { type: string, enum: [owner, admin, member, guest] }
    Invite:
      type: object
      required: [id, created_at, expires_at, max_uses, uses]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        max_uses: { type: integer, nullable: true }
        uses: { type: integer }
    ArchiveFormat:
      type: string
      enum: [csv, actiance, eml]
      description: CSV, Actiance XML (Vantage, Smarsh), or EML files in a ZIP (Global Relay, Proofpoint and mail archives).
    ArchiveSchedule:
      type: object
      required: [format, available, exports]
      properties:
        format: { type: string, enum: [off, csv, actiance, eml] }
        available: { type: boolean, description: The object store is set up (daily exports need it). }
        exports:
          type: array
          items:
            type: object
            required: [id, format, day, size, messages, created_at]
            properties:
              id: { type: string, format: uuid }
              format: { $ref: '#/components/schemas/ArchiveFormat' }
              day: { type: string, format: date }
              size: { type: integer, format: int64 }
              messages: { type: integer }
              created_at: { type: string, format: date-time }
    SpillageReport:
      type: object
      required: [id, channel_id, channel_name, message_id, reason, status, reported_by, created_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid, nullable: true }
        channel_name: { type: string }
        message_id: { type: string, format: uuid, nullable: true }
        author_name: { type: string, description: Who wrote the message (while the report is open). }
        body: { type: string, description: The message (while the report is open, for the reviewers). }
        reason: { type: string }
        status: { type: string, enum: [open, removed, dismissed] }
        reported_by: { type: string, description: Who reported it. }
        created_at: { type: string, format: date-time }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time, nullable: true }
        note: { type: string }
    E2EDevice:
      type: object
      required: [id, user_id, name, signature_key, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        signature_key: { type: string, format: byte, description: The Ed25519 public key of the device's MLS credential. }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, description: Only for one's own devices. }
        revoked_at: { type: string, format: date-time, nullable: true, description: 'Removed: its earlier messages still verify, it joins no group.' }
    MLSGroup:
      type: object
      required: [epoch, group_info, members]
      properties:
        epoch: { type: integer, format: int64 }
        group_info: { type: string, format: byte, description: The GroupInfo of the current epoch (for joining). }
        members:
          type: array
          items:
            type: object
            required: [device_id, user_id, joined_epoch, stale]
            properties:
              device_id: { type: string, format: uuid }
              user_id: { type: string, format: uuid }
              joined_epoch: { type: integer, format: int64 }
              stale: { type: boolean, description: 'Removed or no longer in the channel: the next commit removes it.' }
    MLSCommit:
      type: object
      required: [epoch, data]
      properties:
        epoch: { type: integer, format: int64, description: The epoch the commit leaves. }
        device_id: { type: string, format: uuid, nullable: true }
        data: { type: string, format: byte }
    E2ERecovery:
      type: object
      required: [set]
      properties:
        set: { type: boolean }
        verifier: { type: string, format: byte }
        escrow_key: { $ref: '#/components/schemas/E2EEscrowKey' }
        escrowed: { type: boolean, description: The recovery key is sealed for the current escrow key. }
    E2EEscrowKey:
      type: object
      required: [key_id, public_key]
      properties:
        key_id: { type: string }
        public_key: { type: string, format: byte }
    GuestLink:
      type: object
      required: [id, name, created_at, expires_at, max_uses, uses, guests]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        max_uses: { type: integer, nullable: true }
        uses: { type: integer }
        guests: { type: integer, description: People in the channel through this link. }
    GuestLinkPreview:
      type: object
      required: [channel_name, workspace_name, valid, expires_at]
      properties:
        channel_name: { type: string }
        workspace_name: { type: string }
        valid: { type: boolean, description: False when expired, used up or revoked. }
        expires_at: { type: string, format: date-time }
    InvitePreview:
      type: object
      required: [workspace_id, workspace_name, valid, is_member]
      properties:
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        valid:
          type: boolean
          description: False when expired, used up or revoked.
        is_member: { type: boolean }
    Channel:
      type: object
      required:
        [
          id,
          workspace_id,
          name,
          topic,
          kind,
          visibility,
          is_default,
          is_mandatory,
          is_member,
          can_post,
          can_manage,
          archived,
          group_managed,
          category_id,
          unread_count,
          mention_count,
          last_read_id,
          participants,
        ]
      properties:
        encrypted: { type: boolean, description: End-to-end encrypted; bodies are envelopes only members can open. }
        mls: { type: boolean, description: 'Encrypted with device keys (MLS): bodies are "mls:v1:…" envelopes.' }
        key_check: { type: string, description: 'Encrypted channels: lets members check their passphrase.' }
        classification_id: { type: string, format: uuid, nullable: true, description: The channel's own classification (null follows the workspace). }
        retention_days: { type: integer, nullable: true, description: The channel's own retention (null follows the workspace). }
        access_rules:
          type: array
          items: { $ref: '#/components/schemas/AccessRule' }
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        topic: { type: string }
        kind:
          type: string
          enum: [standard, announcement, direct, group, forum]
          description: |
            In announcement channels only workspace owners and admins send. Direct and
            group conversations have participants instead of a name. A forum's messages
            are posts with titles; people answer in their threads.
        forum_tags:
          type: array
          description: Tags a forum's posts may carry.
          items: { type: string }
        slow_mode_seconds:
          type: integer
          description: Seconds a member waits between messages (0 off; managers are exempt).
        is_default:
          type: boolean
          description: Every user is a member.
        is_mandatory:
          type: boolean
          description: Members cannot leave.
        visibility:
          type: string
          enum: [public, private]
          description: Private channels are visible to their members only.
        is_member: { type: boolean }
        can_post:
          type: boolean
          description: Whether this user can send messages here.
        can_manage:
          type: boolean
          description: Whether this user can add and remove people and change the channel.
        can_reply: { type: boolean, description: Whether this user can answer in threads here. }
        can_react: { type: boolean, description: Whether this user can react here. }
        can_broadcast: { type: boolean, description: 'Whether this user can mention @channel, @here and @all here.' }
        moderation: { $ref: '#/components/schemas/ChannelModeration' }
        archived:
          type: boolean
          description: Archived channels are read-only.
        member_count:
          type: integer
          description: How many people are in the channel (the channel directory only).
        group_managed:
          type: boolean
          description: Members are exactly the people of the channel's directory groups.
        unread_count:
          type: integer
          description: Messages of others after the read position, counted up to 100.
        mention_count:
          type: integer
          description: Unread messages that mention the user, counted up to 100.
        last_read_id:
          type: string
          format: uuid
          nullable: true
        participants:
          type: array
          description: The other people of a direct or group conversation (empty for channels).
          items: { $ref: '#/components/schemas/Person' }
        category_id:
          type: string
          format: uuid
          nullable: true
    ChannelUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        visibility:
          type: string
          enum: [public, private]
        topic: { type: string, maxLength: 250 }
        slow_mode_seconds: { type: integer, minimum: 0, maximum: 21600 }
        forum_tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 40 }
        moderation: { $ref: '#/components/schemas/ChannelModeration' }
    ModerationRule:
      type: string
      enum: [everyone, managers]
      description: Everyone who may post, or only the channel's managers and the workspace's admins.
    ChannelModeration:
      type: object
      description: Who may post, answer in threads, react and mention everyone in a channel.
      required: [post, reply, react, broadcast]
      properties:
        post: { $ref: '#/components/schemas/ModerationRule' }
        reply: { $ref: '#/components/schemas/ModerationRule' }
        react: { $ref: '#/components/schemas/ModerationRule' }
        broadcast: { $ref: '#/components/schemas/ModerationRule' }
    Presence:
      type: object
      required: [user_id, status]
      properties:
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [online, away, dnd] }
    ThemePreset:
      type: string
      enum: [cenacle, graphite, ocean, forest, sunset, rose, contrast]
    FontTemplate:
      type: string
      enum: [corporate, classic, modern, product, reading, legible]
    WorkspaceAppearance:
      type: object
      required: [preset, font_template]
      properties:
        preset: { $ref: '#/components/schemas/ThemePreset' }
        font_template: { $ref: '#/components/schemas/FontTemplate' }
    Appearance:
      type: object
      required: [theme, preset, density, fonts, font_size, line_height, code]
      properties:
        theme: { type: string, enum: [system, light, dark] }
        preset:
          type: string
          description: "A ThemePreset, or 'workspace' for the workspace's."
          enum: [workspace, cenacle, graphite, ocean, forest, sunset, rose, contrast]
        density: { type: string, enum: [auto, compact, comfortable] }
        fonts:
          type: object
          required: [template, text, code]
          properties:
            template:
              type: string
              description: "A FontTemplate, 'workspace' for the workspace's, or 'custom' (text and code below)."
              enum: [workspace, corporate, classic, modern, product, reading, legible, custom]
            text:
              type: string
              maxLength: 64
              description: "A library font id, or 'user:<font id>' for one you uploaded."
            code: { type: string, maxLength: 64 }
        font_size: { type: integer, minimum: 12, maximum: 20 }
        line_height: { type: string, enum: [compact, normal, relaxed] }
        code:
          type: object
          required: [theme, line_numbers, wrap, ligatures]
          properties:
            theme: { type: string, enum: [github, github-soft, one, solarized, catppuccin, vitesse] }
            line_numbers: { type: boolean }
            wrap: { type: boolean }
            ligatures: { type: boolean }
    UserFont:
      type: object
      required: [id, name, format, size, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        format: { type: string, enum: [woff2, woff, truetype, opentype] }
        size: { type: integer }
        created_at: { type: string, format: date-time }
    MessageEdit:
      type: object
      required: [body, written_at, replaced_at]
      properties:
        body: { type: string, description: The text as it was (sealed in encrypted channels). }
        written_at: { type: string, format: date-time }
        replaced_at: { type: string, format: date-time }
    MentionGroup:
      type: object
      required: [id, handle, name, description, directory_group, member_count, is_member, can_manage, archived]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string, description: 'Mentioned as @handle.' }
        name: { type: string }
        description: { type: string }
        directory_group:
          type: string
          nullable: true
          description: The directory group whose people it has, if it follows one.
        member_count: { type: integer }
        is_member: { type: boolean }
        can_manage: { type: boolean }
        archived: { type: boolean, description: Archived groups cannot be mentioned. }
    MentionGroupMember:
      type: object
      required: [person, manager]
      properties:
        person: { $ref: '#/components/schemas/Person' }
        manager: { type: boolean }
    SidebarLayout:
      type: object
      description: |
        Sections are named by key: `favorites`, `channels` (channels without a
        category), `direct` (conversations), a category's id or a section's id.
      required: [order, sections, placements, group_unreads, collapsed]
      properties:
        order:
          type: array
          description: Sections from the top; the ones missing follow in their usual order.
          maxItems: 200
          items: { type: string, maxLength: 64 }
        sections:
          type: array
          description: The person's own sections.
          maxItems: 30
          items: { $ref: '#/components/schemas/SidebarSection' }
        placements:
          type: object
          description: Channel or conversation id → `favorites` or a section's id.
          additionalProperties: { type: string, maxLength: 64 }
        group_unreads:
          type: boolean
          description: Unread channels and conversations gather in a section at the top.
        collapsed:
          type: array
          description: Sections folded away.
          maxItems: 200
          items: { type: string, maxLength: 64 }
    SidebarSection:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
    Meta:
      type: object
      required: [web_app, desktop_min_version]
      properties:
        web_app:
          type: boolean
          description: People may use Cenacle in web browsers.
        desktop_min_version:
          type: string
          description: |
            The oldest desktop app this server accepts ("" for any); older apps ask
            to update before signing in. CENACLE_DESKTOP_MIN_VERSION.
        push_contents:
          type: string
          enum: [full, sender, none]
          description: What the apps' own notifications may show (the notification policy).
        privacy_url:
          type: string
          description: The operator's privacy policy (CENACLE_PRIVACY_URL); absent when none.
        source_url:
          type: string
          description: |
            The source code of this server (CENACLE_SOURCE_URL, AGPL-3.0 section 13); Cenacle's
            own repository unless the operator changed it.
    NotificationPolicy:
      type: object
      required: [push_contents, email_contents]
      properties:
        push_contents:
          type: string
          enum: [full, sender, none]
          description: |
            Web push and the apps' own notifications: the text, the sender and channel
            only, or only that something came (lock screens show them).
        email_contents:
          type: string
          enum: [full, sender]
          description: "Notification e-mails: the text, or the sender and channel only."
    SessionPolicy:
      type: object
      required:
        [session_max_hours, session_idle_minutes, guest_session_max_hours, guest_idle_minutes, admin_networks, signin_networks]
      properties:
        session_max_hours: { type: integer, minimum: 0, maximum: 87600, description: 'Sessions end this long after sign-in (0: no limit).' }
        session_idle_minutes: { type: integer, minimum: 0, maximum: 525600, description: 'Sessions end after this long unused (0: no limit).' }
        guest_session_max_hours: { type: integer, minimum: 0, maximum: 87600, description: 'Guests: a shorter lifetime (0: as everyone).' }
        guest_idle_minutes: { type: integer, minimum: 0, maximum: 525600, description: 'Guests: a shorter idle time (0: as everyone).' }
        admin_networks:
          type: array
          maxItems: 100
          description: Addresses and CIDR ranges that may use the administration (empty, every network).
          items: { type: string }
        signin_networks:
          type: array
          maxItems: 100
          description: Addresses and CIDR ranges that may sign in (empty, every network).
          items: { type: string }
        operator_max_hours: { type: integer, readOnly: true, description: "The operator's limit (CENACLE_SESSION_MAX_AGE; 0, none)." }
        operator_idle_minutes: { type: integer, readOnly: true, description: "The operator's limit (CENACLE_SESSION_IDLE_TIMEOUT; 0, none)." }
        your_address: { type: string, readOnly: true, description: The address this request came from. }
    AdminOverview:
      type: object
      required: [version, counts, config, jobs, failures]
      properties:
        version: { type: string }
        counts:
          type: object
          required: [users, active_users, bots, workspaces, channels, messages, files, file_bytes]
          properties:
            users: { type: integer, format: int64 }
            active_users: { type: integer, format: int64, description: Seen in the last 30 days. }
            bots: { type: integer, format: int64 }
            workspaces: { type: integer, format: int64 }
            channels: { type: integer, format: int64 }
            messages: { type: integer, format: int64 }
            files: { type: integer, format: int64 }
            file_bytes: { type: integer, format: int64 }
        config:
          type: array
          description: Settings from the environment (read only here; secrets show as "set").
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
        jobs:
          type: array
          description: Background jobs by kind and state.
          items:
            type: object
            required: [kind, available, running, retryable, discarded, completed]
            properties:
              kind: { type: string }
              available: { type: integer }
              running: { type: integer }
              retryable: { type: integer }
              discarded: { type: integer }
              completed: { type: integer }
        failures:
          type: array
          description: The latest failed attempts of background jobs.
          items:
            type: object
            required: [kind, state, attempt, error, at]
            properties:
              kind: { type: string }
              state: { type: string }
              attempt: { type: integer }
              error: { type: string }
              at: { type: string, format: date-time }
    AdminUser:
      type: object
      required: [id, display_name, email, username, is_admin, guest, deactivated, last_seen_at, created_at, workspaces, sessions]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string }
        username: { type: string }
        is_admin: { type: boolean }
        guest: { type: boolean }
        deactivated: { type: boolean }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        workspaces: { type: integer }
        sessions: { type: integer }
        erased: { type: boolean, description: Erased at a data subject request. }
    AdminWorkspace:
      type: object
      required: [id, name, is_default, members, channels, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_default: { type: boolean }
        members: { type: integer }
        channels: { type: integer }
        created_at: { type: string, format: date-time }
    AdminBot:
      type: object
      required: [id, name, workspace_id, workspace_name, disabled, interactions, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        disabled: { type: boolean }
        interactions: { type: boolean }
        created_at: { type: string, format: date-time }
    WebAppSetting:
      type: object
      required: [enabled, forced]
      properties:
        enabled: { type: boolean }
        forced:
          type: boolean
          description: CENACLE_WEB_APP sets it; the administrators cannot change it here.
    UITexts:
      type: object
      required: [texts, editable]
      properties:
        texts:
          type: object
          description: Replaced texts, by language and key.
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        editable:
          type: array
          items: { type: string }
          description: The keys administrators may replace.
    SearchMessage:
      type: object
      required: [id, channel, author, body, created_at, has_files]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/SearchChannel' }
        author: { $ref: '#/components/schemas/Author' }
        body: { type: string }
        created_at: { type: string, format: date-time }
        has_files: { type: boolean }
        root_id: { type: string, format: uuid, nullable: true }
    SearchFile:
      type: object
      required: [id, channel, message_id, name, content_type, size, has_thumbnail, created_at, uploader]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/SearchChannel' }
        message_id: { type: string, format: uuid }
        name: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        has_thumbnail: { type: boolean }
        created_at: { type: string, format: date-time }
        uploader: { $ref: '#/components/schemas/Author' }
        excerpt: { type: string, description: 'Where the text inside the file matches, the words between « and » (empty when the name matched).' }
    SearchChannel:
      type: object
      required: [id, name, kind, workspace_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [standard, announcement, direct, group, forum] }
        workspace_id: { type: string, format: uuid }
    NotificationSound:
      type: string
      description: "A built-in sound, 'none', or 'user:<sound id>' for one you uploaded."
      maxLength: 64
    NotificationPrefs:
      type: object
      required: [desktop, push, sounds, volume, default_level, email, paused_until, quiet_hours]
      properties:
        desktop: { type: boolean, description: Notifications of the browser or desktop app. }
        push: { type: boolean, description: Web push when no Cenacle tab is open. }
        sounds:
          type: object
          required: [mention, direct, message]
          properties:
            mention: { $ref: '#/components/schemas/NotificationSound' }
            direct: { $ref: '#/components/schemas/NotificationSound' }
            message: { $ref: '#/components/schemas/NotificationSound' }
        volume: { type: integer, minimum: 0, maximum: 100 }
        default_level:
          type: string
          enum: [all, mentions, none]
          description: What channels notify of unless set per channel (conversations always notify).
        email:
          type: object
          required: [enabled, delay_minutes]
          properties:
            enabled: { type: boolean }
            delay_minutes: { type: integer, enum: [5, 15, 60] }
        paused_until:
          type: string
          format: date-time
          nullable: true
          description: All notifications paused until then.
        quiet_hours:
          type: object
          required: [enabled, start, end, days]
          properties:
            enabled: { type: boolean }
            start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            days:
              type: array
              description: Days of the week (0 Sunday) the quiet hours start on.
              items: { type: integer, minimum: 0, maximum: 6 }
              maxItems: 7
    ChannelNotificationInput:
      type: object
      required: [level, muted_until, sound]
      properties:
        level: { type: string, enum: [default, all, mentions, none] }
        muted_until:
          type: string
          format: date-time
          nullable: true
          description: Muted until then; far in the future for good; null to unmute.
        sound: { type: string, maxLength: 64, description: "'' for the default sound." }
    ChannelNotification:
      allOf:
        - $ref: '#/components/schemas/ChannelNotificationInput'
        - type: object
          required: [channel_id]
          properties:
            channel_id: { type: string, format: uuid }
    WorkspaceNotification:
      type: object
      required: [workspace_id, muted_until]
      properties:
        workspace_id: { type: string, format: uuid }
        muted_until: { type: string, format: date-time, nullable: true }
    NotificationSettings:
      type: object
      required: [prefs, channels, workspaces, push_public_key, email_available]
      properties:
        prefs: { $ref: '#/components/schemas/NotificationPrefs' }
        channels:
          type: array
          items: { $ref: '#/components/schemas/ChannelNotification' }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceNotification' }
        push_public_key:
          type: string
          nullable: true
          description: The VAPID public key (base64url) when web push is on, else null.
        email_available: { type: boolean, description: The installation can send e-mail. }
    UserSound:
      type: object
      required: [id, name, content_type, size, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        content_type: { type: string }
        size: { type: integer }
        created_at: { type: string, format: date-time }
    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 2000 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, maxLength: 200 }
            auth: { type: string, maxLength: 100 }
    CustomStatus:
      type: object
      required: [emoji, text]
      properties:
        emoji: { type: string, maxLength: 64, description: 'One emoji, or empty.' }
        text: { type: string, maxLength: 100 }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When it clears itself; null keeps it until cleared.
    Profile:
      type: object
      required:
        [id, display_name, username, email, is_bot, avatar_url, avatar_still_url, timezone,
         status, last_seen_at, deactivated, guest]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        username: { type: string, description: 'Shown as @username.' }
        email: { type: string }
        is_bot: { type: boolean }
        avatar_url: { type: string, nullable: true }
        avatar_still_url:
          type: string
          nullable: true
          description: The first frame of an animated picture (for reduced motion).
        timezone: { type: string, description: "IANA time zone, '' when unknown." }
        status:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/CustomStatus' }]
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: When they were last online (null when unknown or hidden by them).
        deactivated: { type: boolean, description: Left the organisation; messages stay. }
        guest: { type: boolean }
    MyProfile:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          required: [username_editable, show_last_seen, recent_statuses, account_url]
          properties:
            username_editable:
              type: boolean
              description: False when the @username is the directory's sign-in name.
            show_last_seen: { type: boolean }
            share_read_receipts: { type: boolean }
            recent_statuses:
              type: array
              items: { $ref: '#/components/schemas/CustomStatus' }
            account_url:
              type: string
              description: Where to change the name (Cenacle ID's account page).
    Person:
      type: object
      required: [id, display_name, email]
      properties:
        is_bot: { type: boolean, description: A bot (shows a badge). }
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string }
    Member:
      type: object
      required: [user, role]
      properties:
        user: { $ref: '#/components/schemas/Person' }
        role:
          type: string
          enum: [member, manager]
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
    NewChannel:
      type: object
      required: [workspace_id, name]
      properties:
        workspace_id: { type: string, format: uuid }
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Display name, unique regardless of case; surrounding spaces are removed.
        topic: { type: string, maxLength: 250 }
        kind:
          type: string
          enum: [standard, announcement, forum]
          default: standard
        visibility:
          type: string
          enum: [public, private]
          default: public
        is_default:
          type: boolean
          default: false
          description: Make every user, now and later, a member.
        encrypted:
          type: boolean
          default: false
          description: End-to-end encrypted with a passphrase its members share; cannot change later.
        key_check: { type: string, maxLength: 400, description: 'Encrypted channels: the key''s salt and a known text sealed with the key ("s:<salt>:e2e:v1:…").' }
    Author:
      type: object
      required: [id, display_name]
      properties:
        is_bot: { type: boolean, description: Sent by a bot. }
        id: { type: string, format: uuid }
        display_name: { type: string }
    Message:
      type: object
      required:
        [id, channel_id, author, body, nonce, created_at, edited_at, mentions, reactions, attachments, files]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/Author' }
        priority:
          type: string
          enum: [important, urgent]
          description: The message's priority (none when standard).
        ack:
          $ref: '#/components/schemas/MessageAck'
        persistent:
          type: boolean
          description: The people it mentions are reminded until they acknowledge it.
        body:
          type: string
          description: |
            Markdown (CommonMark with GitHub tables, strikethrough and task lists); clients
            render it without raw HTML. `<@user-id>` mentions a person.
        mentions:
          type: array
          description: The people the message mentions (members of the channel).
          items: { $ref: '#/components/schemas/Author' }
        reactions:
          type: array
          description: Reactions in the order they were first used; `me` is the reader's own.
          items: { $ref: '#/components/schemas/Reaction' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileInfo' }
        nonce:
          type: string
          description: The client's nonce, so the sender can match its pending message.
        created_at: { type: string, format: date-time }
        edited_at:
          type: string
          format: date-time
          nullable: true
        root_id:
          type: string
          format: uuid
          nullable: true
          description: The thread's first message when this is a reply.
        also_in_channel:
          type: boolean
          description: A reply its author also sent to the channel.
        pinned_at: { type: string, format: date-time, nullable: true }
        pinned_by: { type: string, format: uuid, nullable: true }
        thread: { $ref: '#/components/schemas/ThreadSummary' }
        title: { type: string, nullable: true, description: A forum post's title. }
        tags:
          type: array
          items: { type: string }
        poll: { $ref: '#/components/schemas/Poll' }
        link_preview: { $ref: '#/components/schemas/LinkPreview' }
        forward: { $ref: '#/components/schemas/ForwardInfo' }
        sticker: { $ref: '#/components/schemas/Sticker' }
        burn: { $ref: '#/components/schemas/BurnInfo' }
        task: { $ref: '#/components/schemas/Task' }
        submission: { $ref: '#/components/schemas/Submission' }
        broadcast:
          type: array
          description: 'Mentions of many: channel (also @everyone), here, or role:owner / role:admin.'
          items: { type: string }
    ThreadSummary:
      type: object
      description: The replies of a message (absent when it has none).
      required: [reply_count, last_reply_at, participants]
      properties:
        reply_count: { type: integer }
        last_reply_at: { type: string, format: date-time }
        participants:
          type: array
          description: The latest repliers, newest first (up to three).
          items: { $ref: '#/components/schemas/Author' }
    FollowedThread:
      type: object
      required: [root, channel, unread_count, mention_count, last_reply_id]
      properties:
        root: { $ref: '#/components/schemas/Message' }
        last_reply_id: { type: string, format: uuid, description: The paging cursor (before). }
        channel: { $ref: '#/components/schemas/SearchChannel' }
        unread_count: { type: integer }
        mention_count: { type: integer }
    SavedItem:
      type: object
      required: [message, channel, saved_at, remind_at, done_at]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        channel: { $ref: '#/components/schemas/SearchChannel' }
        saved_at: { type: string, format: date-time }
        remind_at: { type: string, format: date-time, nullable: true }
        done_at: { type: string, format: date-time, nullable: true }
    ActivityItem:
      type: object
      required: [kind, at, actor, emoji, message, channel]
      properties:
        kind: { type: string, enum: [mention, reply, reaction] }
        at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/Author' }
        emoji: { type: string, description: The reaction (reactions only). }
        message: { $ref: '#/components/schemas/Message' }
        channel: { $ref: '#/components/schemas/SearchChannel' }
    GroupMapping:
      type: object
      required: [group, role]
      properties:
        group: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, enum: [admin, member, guest] }
        candidates:
          type: array
          readOnly: true
          items: { type: string }
          description: >-
            Set when the mapping needs review: the group's name changed at Cenacle ID, but
            several groups had it (ADR 0046). The new names it may mean; the mapping matches
            none of them until an administrator saves it (keeps it as it is), maps one of them
            instead or removes it.
    GroupReview:
      type: object
      required: [group, candidates]
      properties:
        group: { type: string }
        candidates: { type: array, items: { type: string } }
    ChannelGroups:
      type: object
      required: [groups, managed]
      properties:
        groups:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 200 }
        managed: { type: boolean }
        reviews:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/GroupReview' }
          description: >-
            Groups of the channel that need review, with the new names they may mean (see
            GroupMapping.candidates). A group still listed keeps its review unless named in
            `reviewed`.
        reviewed:
          type: array
          writeOnly: true
          maxItems: 50
          items: { type: string, maxLength: 200 }
          description: Groups whose review is done; they stay as they are.
    FileInfo:
      type: object
      required: [id, name, content_type, size, width, height, has_thumbnail]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        has_thumbnail: { type: boolean }
        encrypted: { type: boolean, description: Encrypted in the browser; the key is in the message. }
        media_kind: { type: string, enum: [voice, clip], nullable: true }
        duration_ms: { type: integer, nullable: true }
        waveform:
          type: array
          description: Up to 64 levels (0–255) of a voice message.
          items: { type: integer }
    ChannelFile:
      allOf:
        - $ref: '#/components/schemas/FileInfo'
        - type: object
          required: [message_id, uploader, created_at]
          properties:
            message_id: { type: string, format: uuid }
            uploader: { $ref: '#/components/schemas/Author' }
            created_at: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
    NewMessage:
      type: object
      required: [body, nonce]
      properties:
        body:
          type: string
          maxLength: 4000
          description: Markdown; may be empty when the message has attachments or files.
        nonce: { type: string, minLength: 8, maxLength: 64 }
        attachments:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Attachment' }
        file_ids:
          type: array
          maxItems: 10
          description: Ready files the sender uploaded into this channel (see createUpload).
          items: { type: string, format: uuid }
        root_id:
          type: string
          format: uuid
          description: Reply in this message's thread (a reply's thread when it is a reply).
        also_in_channel:
          type: boolean
          description: Show the reply in the channel too.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Required for posts in forums (not for replies).
        tags:
          type: array
          maxItems: 5
          items: { type: string }
        poll: { $ref: '#/components/schemas/NewPoll' }
        sticker_id: { type: string, format: uuid, description: Send a sticker (the text may be empty). }
        burn_seconds:
          type: integer
          minimum: 10
          maximum: 86400
          description: Burn-on-read (conversations only)—each recipient sees the text once, for this long.
        priority:
          type: string
          enum: [important, urgent]
          description: Mark the message important or urgent (not replies).
        request_ack:
          type: boolean
          description: Ask readers to acknowledge the message (not replies).
        persistent:
          type: boolean
          description: |
            Remind the people it mentions until they acknowledge it (urgent messages with
            mentions, where the workspace allows it).
    MessageAck:
      type: object
      description: Acknowledgements, when the message asks for them.
      required: [count, me, people]
      properties:
        count: { type: integer }
        me: { type: boolean, description: The reader acknowledged it. }
        people:
          type: array
          description: Who acknowledged it, first first (up to 50).
          items: { $ref: '#/components/schemas/Author' }
    Reaction:
      type: object
      required: [emoji, count, me]
      properties:
        emoji: { type: string }
        count: { type: integer }
        me: { type: boolean }
    Attachment:
      type: object
      description: A card under a message, e.g. from a bot (an issue, an alert).
      properties:
        title: { type: string, maxLength: 200 }
        title_link:
          type: string
          maxLength: 2000
          description: An http(s) URL the title links to.
        text: { type: string, maxLength: 2000, description: Markdown. }
        color:
          type: string
          enum: [neutral, info, success, warning, danger]
          description: The stripe on the card's edge (meaning is never the color alone).
        fields:
          type: array
          maxItems: 10
          items:
            type: object
            required: [title, value]
            properties:
              title: { type: string, maxLength: 100 }
              value: { type: string, maxLength: 500 }
              short: { type: boolean, description: Two short fields share a row. }
        footer: { type: string, maxLength: 200 }
        actions:
          type: array
          maxItems: 5
          description: Buttons and menus (bots with an interactions address).
          items: { $ref: '#/components/schemas/AttachmentAction' }
    MessagePage:
      type: object
      required: [messages, has_more]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        has_more: { type: boolean }
    Permissions:
      type: object
      required: [create_workspaces, upload_files, max_file_size]
      description: |
        What the user may do across the instance. Rights inside a workspace follow
        the role there (see Workspace).
      properties:
        create_workspaces: { type: boolean }
        upload_files:
          type: boolean
          description: Files can be shared (an object store is configured).
        max_file_size: { type: integer, format: int64 }
        ai: { type: boolean, description: The operator configured a model (workspaces can turn AI on). }
    Logout:
      type: object
      required: [end_session_url]
      properties:
        end_session_url:
          type: string
          description: Sign-out page of Cenacle ID; empty if it is not known.
