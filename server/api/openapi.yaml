  /api/channels/{channel_id}/unread:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: markUnread
      summary: Mark a channel or thread unread from a message
      description: |
        Moves the read position back to just before the message, so it and the
        ones after it count as unread again. Without a message, the newest
        message of someone else in the channel becomes unread. A reply marks its thread unread
        (and the channel, when it was also sent there). The user's other devices
        get `channel.unread` or `thread.read`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id: { type: string, format: uuid }
      responses:
        '204':
          description: Marked.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
