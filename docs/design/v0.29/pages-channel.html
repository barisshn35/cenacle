<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cenacle</title>
<link rel="stylesheet" href="app.css">
<style>
/* ---- shared ---- */
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.tabs span.on svg { color: var(--accent); }
.btn svg { color: var(--ink-2); }
.btn.p svg { color: var(--accent-fg); }
.btn.sq { width: 32px; padding: 0; justify-content: center; }
.btn[aria-disabled="true"] { color: var(--ink-2); background: var(--panel); }
.sel-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; padding: 0 10px 0 12px; border: 1px solid var(--rule-strong); border-radius: 7px; background: var(--sheet); font-size: 13.5px; }
.sel-btn svg { color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 8px; padding: 2px; gap: 2px; background: var(--sheet); }
.seg span { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.seg span.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.seg span.on svg { color: var(--accent); }
.tbar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--rule); }
.tbar h2 { font-size: 15px; font-weight: 600; }
.tbar .sp { flex: 1; }
.lbl { font-size: 12.5px; color: var(--ink-2); }
.fchip { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--rule-strong); font-size: 13px; font-weight: 500; background: var(--sheet); color: var(--ink); }
.fchip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.fchip small { color: var(--ink-2); font: 12px var(--mono); }
.tagc { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; background: var(--well); font-size: 12px; font-weight: 500; color: var(--ink); }

/* ---- canvas ---- */
.cv-wrap { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.cv-status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.cv-status .live { width: 7px; height: 7px; border-radius: 50%; background: var(--online); }
.cv-status b { font-weight: 600; }
.cv-note { display: flex; align-items: center; gap: 8px; margin: 14px 24px 0; padding: 8px 12px; border-radius: 8px; background: var(--well); font-size: 13px; }
.cv-note svg { color: var(--ink-2); }
.doc { padding: 26px 260px 0 64px; overflow: hidden; flex: 1; }
.doc > * { max-width: 72ch; }
.doc h1 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; }
.doc .sub { margin-top: 4px; font-size: 13px; color: var(--ink-2); line-height: 18px; }
.doc h2 { font-size: 17px; font-weight: 600; margin-top: 22px; letter-spacing: -0.01em; }
.doc p, .doc li { font-size: 15px; line-height: 1.55; }
.doc p { margin-top: 8px; }
.doc ul, .doc ol { margin-top: 8px; padding-left: 22px; }
.doc li + li { margin-top: 3px; }
.doc ul.todo { list-style: none; padding-left: 0; }
.doc ul.todo li { display: flex; gap: 10px; align-items: flex-start; }
.cb { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--rule-strong); background: var(--sheet); flex: none; margin-top: 4px; display: grid; place-items: center; }
.cb.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.cb svg { width: 12px; height: 12px; stroke-width: 2.5; }
.doc ul.todo li.done span:last-child { color: var(--ink-2); text-decoration: line-through; }
.dtable { margin-top: 10px; border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.dtable th { text-align: left; font-weight: 600; background: var(--panel); padding: 8px 12px; border-bottom: 1px solid var(--rule-strong); }
.dtable td { padding: 8px 12px; border-top: 1px solid var(--rule); vertical-align: top; }
.dtable tr:nth-child(2) td { border-top: 0; }
.dtable td.mono { font-size: 13px; }
.doc a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
.cv-aside { position: absolute; right: 24px; top: 22px; width: 216px; display: grid; gap: 10px; }
.cv-card { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; background: var(--sheet); font-size: 13px; }
.cv-card h4 { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
.cv-card .r { display: flex; justify-content: space-between; gap: 8px; line-height: 22px; }
.cv-card .r span:first-child { color: var(--ink-2); }

/* ---- list: board ---- */
.lanes { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 16px 24px 16px; overflow: hidden; }
.lane { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
.lane-h { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--rule); font-size: 13.5px; font-weight: 600; }
.lane-h .n { font: 400 12px var(--mono); color: var(--ink-2); }
.lane-h .sp { flex: 1; }
.lane-h svg.k { color: var(--ink-2); }
.lane-b { padding: 10px; display: grid; gap: 8px; align-content: start; }
.card { background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.card .ct { font-size: 14px; font-weight: 500; line-height: 20px; }
.card .cm { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.card .cm .who { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 12.5px; font-weight: 400; }
.card .cm .sp { flex: 1; }
.card .due { display: inline-flex; align-items: center; gap: 4px; font: 12px var(--mono); }
.card .due svg { width: 14px; height: 14px; }
.card .due.late { color: var(--ink); font-weight: 600; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pri { font-size: 12px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.pri.hi { color: var(--ink); font-weight: 600; }
.addc { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 7px; font-size: 13px; color: var(--ink-2); }
.card.done .ct { color: var(--ink-2); }

/* ---- list: table ---- */
.ltable-wrap { flex: 1; min-height: 0; padding: 16px 24px; overflow: hidden; }
.lt { border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; background: var(--sheet); }
.lr { display: grid; grid-template-columns: 40px minmax(0, 1fr) 172px 164px 132px 104px 44px; align-items: center; min-height: 44px; border-top: 1px solid var(--rule); font-size: 13.5px; }
.lr > div { padding: 0 12px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr > div:first-child { padding: 0 0 0 14px; }
.lr.h { background: var(--forest); color: var(--bone); border-top: 0; min-height: 40px; font-size: 13px; font-weight: 500; }
.dark .lr.h { background: #1d3d32; }
.lr.h > div { display: flex; align-items: center; gap: 6px; }
.lr.h svg { width: 14px; height: 14px; opacity: .8; }
.lr .tt { font-weight: 500; }
.lr .pp { display: flex; align-items: center; gap: 8px; }
.lr.sel { background: var(--accent-soft); }
.lr .cb { margin-top: 0; }
.stv { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.stv svg { width: 15px; height: 15px; color: var(--ink-2); }
.lr.add { color: var(--ink-2); font-size: 13px; }
.lr.add > div:nth-child(2) { display: flex; align-items: center; gap: 6px; }
.lr .mono { font-size: 13px; }
.lr.done .tt { color: var(--ink-2); }
.lfoot { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); display: flex; justify-content: space-between; }

/* ---- forum ---- */
.fhead { padding: 16px 24px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.fhead .sp { flex: 1; }
.posts { flex: 1; min-height: 0; overflow: hidden; }
.post { display: grid; grid-template-columns: minmax(0, 1fr) 96px 104px; gap: 0 16px; padding: 12px 24px; border-bottom: 1px solid var(--rule); align-items: center; }
.post .pt { font-size: 15px; font-weight: 600; line-height: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.post .pm { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12.5px; color: var(--ink-2); flex-wrap: nowrap; white-space: nowrap; }
.post .pm .a { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.post .rc { text-align: right; font-size: 13px; }
.post .rc b { font: 500 14px var(--mono); display: block; }
.post .rc span { color: var(--ink-2); font-size: 12px; }
.post .la { text-align: right; font: 13px var(--mono); }
.post .la span { display: block; font: 12px var(--font); color: var(--ink-2); }
.post.sel { background: var(--accent-soft); }
.post.read .pt { font-weight: 500; }
.colh { display: grid; grid-template-columns: minmax(0, 1fr) 96px 104px; gap: 0 16px; padding: 8px 24px; font-size: 12px; color: var(--ink-2); border-bottom: 1px solid var(--rule); background: var(--panel); }
.colh span:not(:first-child) { text-align: right; }
.ptitle { font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: -0.01em; }
.ptags { display: flex; gap: 6px; margin-top: 8px; }

/* ---- rich messages ---- */
.poll { border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--sheet); padding: 12px 14px; max-width: 460px; }
.poll .q { font-size: 15px; font-weight: 600; line-height: 21px; }
.poll .qm { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.popt { margin-top: 8px; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 14px; }
.popt .rad { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--rule-strong); display: grid; place-items: center; }
.popt.mine .rad { border: 5px solid var(--accent); }
.popt .pc { font: 13px var(--mono); }
.popt.mine .pc, .popt.mine .on { font-weight: 600; }
.popt .trk { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; }
.popt .trk i { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
.popt.mine .trk i { background: var(--accent); }
.poll .pf { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); }
.poll .pf button { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--rule-strong); font-size: 12.5px; font-weight: 500; color: var(--ink); }
.lp { display: grid; grid-template-columns: minmax(0, 1fr) 112px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; max-width: 520px; background: var(--sheet); }
.lp .lt2 { padding: 10px 14px; }
.lp .site { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.lp .site svg { width: 14px; height: 14px; }
.lp b { display: block; font-size: 14px; font-weight: 600; margin-top: 2px; line-height: 20px; }
.lp p { font-size: 13px; color: var(--ink-2); line-height: 18px; margin-top: 2px; }
.lp .thumb { background: var(--well); border-left: 1px solid var(--rule); display: grid; place-items: center; color: var(--ink-2); }
.voice { display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px 0 8px; border: 1px solid var(--rule-strong); border-radius: 24px; background: var(--sheet); }
.voice .play { width: 32px; height: 32px; border-radius: 16px; background: var(--well); color: var(--ink); display: grid; place-items: center; }
.voice .play svg { width: 16px; height: 16px; fill: currentColor; }
.wave { display: flex; align-items: center; gap: 2px; height: 28px; }
.wave i { width: 3px; border-radius: 2px; background: var(--rule-strong); }
.wave i.p { background: var(--ink); }
.voice .dur { font: 13px var(--mono); color: var(--ink-2); }
.voice .dur b { color: var(--ink); font-weight: 500; }
.fwd { border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); padding: 10px 14px; max-width: 560px; }
.fwd .fh { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.fwd .fh svg { width: 14px; height: 14px; }
.fwd .fb { margin-top: 6px; display: flex; gap: 10px; }
.fwd .fb b { font-size: 13px; font-weight: 600; }
.fwd .fb p { font-size: 14.5px; line-height: 1.5; }
.fwd .open { margin-top: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink); display: inline-flex; align-items: center; gap: 4px; }
.fwd .open svg { width: 14px; height: 14px; color: var(--ink-2); }
.cemo { width: 18px; height: 18px; display: block; }
.tx .cemo { display: inline-block; vertical-align: -3px; }

/* ---- dialog ---- */
.stage { position: relative; height: 100vh; }
.scrim2 { position: absolute; inset: 0; background: rgba(12, 26, 22, .45); }
.dlg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 640px; background: var(--sheet); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.dlg-h { padding: 20px 24px 0; display: flex; align-items: flex-start; gap: 12px; }
.dlg-h h2 { font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.dlg-h h2 svg { color: var(--ink-2); }
.dlg-h p { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.dlg-h .sp { flex: 1; }
.dlg .itabs { margin: 14px 0 0; padding: 0 16px; }
.dlg-b { padding: 18px 24px 4px; display: grid; gap: 16px; }
.fld { display: grid; gap: 6px; align-content: start; }
.fld > label, .fld > .lab2 { font-size: 13px; font-weight: 600; }
.fld .hint { font-size: 12.5px; color: var(--ink-2); }
.inp { height: 36px; border: 1px solid var(--rule-strong); border-radius: 8px; padding: 0 12px; display: flex; align-items: center; font-size: 14px; background: var(--sheet); }
.inp.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp .caret { width: 1px; height: 18px; background: var(--ink); margin-left: 1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.vis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vopt { border: 1px solid var(--rule-strong); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 18px 1fr; gap: 2px 10px; }
.vopt .rad { grid-column: 1; grid-row: 1 / span 2; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--rule-strong); margin-top: 2px; }
.vopt.on { border-color: var(--accent); background: var(--accent-soft); }
.vopt.on .rad { border: 5px solid var(--accent); }
.vopt b { grid-column: 2; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.vopt b svg { color: var(--ink-2); width: 15px; height: 15px; }
.vopt span { grid-column: 2; font-size: 12.5px; color: var(--ink-2); line-height: 17px; }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; }
.danger { margin: 8px 24px 0; padding: 14px 0 0; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 16px; }
.danger div { flex: 1; }
.danger b { font-size: 13.5px; font-weight: 600; display: block; }
.danger p { font-size: 12.5px; color: var(--ink-2); line-height: 17px; margin-top: 2px; }
.btn.d { color: var(--mention); border-color: var(--mention); }
.btn.d svg { color: var(--mention); }
.dlg .itab { font-size: 13.5px; height: 38px; }

/* ---- files panel ---- */
.fl-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.imgs .im { aspect-ratio: 4 / 3; border-radius: 8px; border: 1px solid var(--rule); overflow: hidden; background: var(--well); }
.imgs .im svg { width: 100%; height: 100%; display: block; }
.frow { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--rule); }
.frow .fi { width: 32px; height: 32px; border-radius: 6px; background: var(--well); display: grid; place-items: center; color: var(--ink-2); }
.frow b { font-size: 13.5px; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow small { font-size: 12px; color: var(--ink-2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .iconbtn { width: 30px; height: 30px; }
.psec2 h3 { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 8px; }
.psec2 h3 span { font-weight: 400; color: var(--ink-2); font-family: var(--mono); font-size: 12px; }

/* ---- lightbox ---- */
.lb { position: absolute; inset: 0; background: rgba(8, 14, 12, .94); display: grid; grid-template-rows: 64px 1fr 72px; color: #ece8dd; }
.lb-top { display: flex; align-items: center; gap: 12px; padding: 0 16px 0 24px; border-bottom: 1px solid rgba(236, 232, 221, .12); }
.lb-top .nm { font-size: 14.5px; font-weight: 600; }
.lb-top .mt { font-size: 12.5px; color: #b9c3bd; }
.lb-top .sp { flex: 1; }
.lb-btn { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #ece8dd; border: 1px solid rgba(236, 232, 221, .18); }
.lb-btn.t { width: auto; padding: 0 14px; gap: 8px; display: flex; align-items: center; font-size: 13.5px; font-weight: 500; }
.lb-mid { display: grid; grid-template-columns: 88px minmax(0, 1fr) 88px; align-items: center; min-height: 0; }
.lb-nav { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; background: rgba(236, 232, 221, .1); color: #ece8dd; margin: 0 auto; border: 1px solid rgba(236, 232, 221, .18); }
.lb-img { justify-self: center; height: 640px; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.lb-img svg { width: 100%; height: 100%; display: block; }
.lb-bot { display: flex; align-items: center; justify-content: center; gap: 8px; }
.lb-th { width: 64px; height: 48px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(236, 232, 221, .2); opacity: .7; }
.lb-th.on { opacity: 1; box-shadow: 0 0 0 2px #c9a24b; border-color: transparent; }
.lb-th svg { width: 100%; height: 100%; display: block; }
.lb-pos { font: 13px var(--mono); color: #b9c3bd; margin-left: 12px; }
</style>
</head>
