<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cenacle Minutes</title>
<script src="icons.js"></script>
<style>
@font-face { font-family: Geist; src: url(geist-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: Geist; src: url(geist-latin-ext-wght-normal.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0100-024F, U+1E00-1EFF; }
@font-face { font-family: 'Geist Mono'; src: url(geist-mono-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }

/* The record: paper, Forest ink, a speaker margin. Brass only for selection, focus, send. */
:root {
  --night: #0c1a16; --forest: #14342b; --bone: #f3eee2; --paper: #faf7f0; --brass: #c9a24b; --brass-ink: #8f6b1f;
  --sheet: #ffffff; --panel: #faf7f0; --ink: #16201d; --ink-2: #55605b; --rule: #e4ddcf; --rule-strong: #cfc6b3;
  --well: #f1ebdd; --hover: #faf6ec;
  --accent: var(--brass-ink); --accent-fg: #ffffff; --accent-soft: #f4ecd9;
  --side: var(--forest); --side-ink: #f3eee2; --side-ink-2: #c3cfc7; --side-rule: #22493c; --side-sel: #22503f; --side-hover: #1b4135;
  --mention: #b42318; --mention-bg: #fcebe8; --badge: #b42318;
  --online: #2f8a5b; --away: #b08420;
  --shadow: 0 6px 20px rgba(20, 52, 43, .10), 0 0 0 1px rgba(20, 52, 43, .10);
  --margin: 152px;
  --font: Geist, system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace;
}
.dark {
  --sheet: #111c18; --panel: #14221d; --ink: #ece8dd; --ink-2: #a9b5ae; --rule: #24352e; --rule-strong: #34483f;
  --well: #1b2b25; --hover: #16251f;
  --accent: var(--brass); --accent-fg: #1b1507; --accent-soft: #2a2a1c;
  --side: #0f231d; --side-ink: #ece8dd; --side-ink-2: #a9b5ae; --side-rule: #1e3a30; --side-sel: #1d3d32; --side-hover: #173129;
  --mention: #ff8a80; --mention-bg: #3a1f1d; --badge: #d93a2b;
  --online: #5cc48d; --away: #d9a93a;
  --shadow: 0 8px 24px rgba(0, 0, 0, .45), 0 0 0 1px #34483f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font: 400 14px/20px var(--font); color: var(--ink); background: var(--sheet); -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent-soft); color: var(--ink); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.s { width: 16px; height: 16px; }
.tab { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
.iconbtn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.iconbtn.on { background: var(--accent-soft); color: var(--accent); }

.app { display: grid; grid-template-columns: 64px 256px minmax(0, 1fr) auto; height: 100vh; overflow: hidden; }

/* Rail: workspaces */
.rail { background: var(--night); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; }
.ws { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #c3cfc7; font-weight: 600; font-size: 14px; background: #15271f; }
.ws.on { background: var(--forest); box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--brass); }
.ws.on svg { width: 26px; height: 26px; }
.ws.add { background: none; border: 1px dashed #3a4f46; }
.rail .grow { flex: 1; }

/* Sidebar */
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; min-height: 0; }
.wsname { height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 16px; border-bottom: 1px solid var(--side-rule); }
.wsname b { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.side .iconbtn { color: var(--side-ink-2); }
.jump { margin: 12px 10px 4px; height: 32px; border-radius: 8px; border: 1px solid var(--side-rule); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; color: var(--side-ink-2); }
.jump kbd { margin-left: auto; font: 500 12px var(--mono); }
.nav { padding: 6px 8px; flex: 1; overflow: hidden; }
.row { height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 7px; color: var(--side-ink-2); position: relative; white-space: nowrap; }
.row .n { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.row.unread { color: var(--side-ink); font-weight: 600; }
.row.sel { background: var(--side-sel); color: var(--side-ink); font-weight: 600; }
.row.sel svg { color: var(--brass); }
.meta { font-size: 12px; color: var(--side-ink-2); font-weight: 400; }
.badge { min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--badge); color: #fff; font: 600 11px/18px var(--font); text-align: center; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sec { display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 4px; font-size: 12.5px; font-weight: 600; color: var(--side-ink-2); }
.sec span { display: flex; align-items: center; gap: 6px; }
.draft { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; color: var(--side-ink-2); }
.conn { display: flex; align-items: center; gap: 6px; padding: 0 18px 8px; font-size: 12px; color: var(--side-ink-2); }
.conn i { width: 6px; height: 6px; border-radius: 50%; background: var(--online); }
.me { border-top: 1px solid var(--side-rule); padding: 10px 12px 12px 16px; display: flex; align-items: center; gap: 10px; flex: none; }
.me b { font-size: 13.5px; font-weight: 600; display: block; line-height: 18px; }

/* Avatars: quiet tints from the paper world */
.av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; position: relative; color: #1e2b26; }
.av.l { width: 32px; height: 32px; font-size: 12px; }
.a1 { background: #e3d9c4; } .a2 { background: #d4e0d9; } .a3 { background: #e6d6d0; } .a4 { background: #d9dce6; } .a5 { background: #dfe3cf; }
.pr { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--side); }
.pr.on { background: var(--online); } .pr.away { background: var(--side); box-shadow: inset 0 0 0 2px var(--away); }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--sheet); }
.head { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 24px; border-bottom: 1px solid var(--rule); }
.head h1 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 6px; letter-spacing: -0.01em; }
.head h1 svg { color: var(--ink-2); }
.topic { color: var(--ink-2); font-size: 13.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gov { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--rule-strong); border-radius: 6px; font-size: 12.5px; color: var(--ink); white-space: nowrap; }
.gov svg { color: var(--ink-2); }
.mem { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border-radius: 8px; font-size: 13px; color: var(--ink-2); }
.tabs { height: 40px; flex: none; display: flex; gap: 22px; padding: 0 24px; border-bottom: 1px solid var(--rule); font-size: 13.5px; color: var(--ink-2); }
.tabs span { display: flex; align-items: center; gap: 6px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs .on { color: var(--ink); font-weight: 600; border-color: var(--accent); }
.log { flex: 1; min-height: 0; overflow: hidden; padding: 8px 24px 0; display: flex; flex-direction: column; justify-content: flex-end; }

/* The speaker margin (signature) */
.turn { display: grid; grid-template-columns: var(--margin) minmax(0, 1fr); column-gap: 20px; padding: 6px 8px 6px 0; position: relative; border-radius: 8px; }
.mg { display: flex; justify-content: flex-end; gap: 8px; text-align: right; padding-top: 2px; }
.who { font-size: 13px; font-weight: 600; line-height: 18px; }
.mg time { display: block; font-size: 12px; color: var(--ink-2); line-height: 16px; font-variant-numeric: tabular-nums; }
.tx { font-size: 15px; line-height: 1.55; max-width: 72ch; }
.tx p, .what p, .mrow p, .pin b { text-wrap: pretty; }
.tx > * + * { margin-top: 6px; }
.cont { padding-top: 0; margin-top: -8px; }
.cont .mg time { opacity: 0; }
.turn.hover { background: var(--hover); }
.turn.hover.cont .mg time { opacity: 1; }
.heading { display: grid; grid-template-columns: var(--margin) minmax(0, 1fr); column-gap: 20px; align-items: baseline; padding: 16px 0 6px; }
.heading .l { text-align: right; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.heading h2 { font-size: 13.5px; font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.newline { display: grid; grid-template-columns: var(--margin) minmax(0, 1fr); column-gap: 20px; align-items: center; margin: 8px 0 2px; }
.newline span { text-align: right; font-size: 12px; font-weight: 600; }
.newline i { height: 1px; background: var(--ink); }
code { font: 13px var(--mono); background: var(--well); padding: 1px 5px; border-radius: 4px; }
pre { font: 13px/1.6 var(--mono); background: var(--well); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; }
ol { padding-left: 22px; }
.file { display: inline-flex; align-items: center; gap: 12px; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 14px 8px 10px; background: var(--sheet); }
.file .fi { width: 32px; height: 32px; border-radius: 6px; background: var(--well); display: grid; place-items: center; color: var(--ink-2); }
.file b { font-size: 13.5px; font-weight: 600; display: block; } .file small { font-size: 12px; color: var(--ink-2); }
.rec { font: 12px var(--mono); color: var(--ink-2); }
.chip { font-weight: 600; background: var(--well); border-radius: 4px; padding: 0 4px; }
.chip.you { background: var(--mention-bg); color: var(--mention); }
.mention .who::before { content: '@ '; color: var(--mention); }
.mention .mg time { color: var(--mention); font-weight: 600; }
.thr { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); height: 28px; }
.thr .stack { display: flex; gap: 2px; }
.thr b { color: var(--ink); font-weight: 600; }
.thr.open { background: var(--accent-soft); border-radius: 6px; padding: 0 8px 0 4px; width: max-content; }
.reacts { display: flex; gap: 6px; }
.re { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--rule-strong); border-radius: 14px; font-size: 13px; font-weight: 500; background: var(--sheet); }
.re.mine { border-color: var(--accent); background: var(--accent-soft); }
.sending .tx { color: var(--ink-2); }
.sending .mg time::after { content: ' · sending'; }
.bar { position: absolute; right: 8px; top: -16px; display: flex; gap: 2px; padding: 3px; background: var(--sheet); border-radius: 8px; box-shadow: var(--shadow); }
.bar .iconbtn { width: 30px; height: 30px; }

/* Composer */
.foot { padding: 0 24px 14px; flex: none; }
.typing { height: 24px; display: grid; grid-template-columns: var(--margin) 1fr; column-gap: 20px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.typing .r { display: flex; justify-content: space-between; }
.comp { margin-left: calc(var(--margin) + 20px); border: 1px solid var(--rule-strong); border-radius: 10px; display: flex; align-items: center; gap: 2px; padding: 6px 6px 6px 14px; background: var(--sheet); }
.comp.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.comp .ph { flex: 1; font-size: 15px; color: var(--ink-2); }
.comp .ph.typed { color: var(--ink); }
.aa { font-size: 13px; font-weight: 600; }
.send { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; margin-left: 4px; }

/* Right panels */
.panel { width: 400px; border-left: 1px solid var(--rule); display: flex; flex-direction: column; background: var(--panel); min-height: 0; }
.ph2 { height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 20px; border-bottom: 1px solid var(--rule); }
.ph2 b { font-size: 15px; font-weight: 600; } .ph2 span { flex: 1; color: var(--ink-2); font-size: 13px; }
.pbody { flex: 1; min-height: 0; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 18px; }
.panel .turn, .panel .heading { grid-template-columns: 96px minmax(0, 1fr); column-gap: 14px; }
.panel .tx { font-size: 14.5px; }
.panel .foot { padding: 0 20px 14px; }
.panel .comp { margin-left: 0; }
.follow { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); padding: 0 0 8px; }

/* Title block (from the drawing) */
.tblock { border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; background: var(--sheet); }
.tblock .c { padding: 8px 12px 9px; border-top: 1px solid var(--rule-strong); display: grid; gap: 2px; text-align: left; }
.tblock .c:nth-child(2n) { border-left: 1px solid var(--rule-strong); }
.tblock .c.wide { grid-column: 1 / -1; border-top: 0; padding: 10px 12px 12px; }
.tblock .c.wide + .c { border-top: 1px solid var(--rule-strong); }
.tblock .lab { font-size: 11.5px; color: var(--ink-2); line-height: 16px; }
.tblock .val { font: 13.5px/18px var(--font); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.tblock .val.num { font: 13px/18px var(--mono); font-variant-numeric: tabular-nums; }
.tblock .c .ed { margin-left: auto; color: var(--ink-2); }
.tblock .c { display: grid; grid-template-columns: 1fr auto; }
.tblock .c .lab, .tblock .c .val { grid-column: 1; }
.tblock .c .ed { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.tblock .wide .val { font: 600 22px/28px var(--font); letter-spacing: -0.01em; }
.tblock .val .cls { font-family: var(--font); font-weight: 600; font-size: 12px; background: var(--well); border-radius: 4px; padding: 1px 7px; }
.tblock .note { grid-column: 1 / -1; border-top: 1px solid var(--rule-strong); padding: 8px 12px; font-size: 12.5px; color: var(--ink-2); }
.psec h3 { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 8px; }
.psec h3 span { font-weight: 400; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.psec p { font-size: 14px; }
.plist { display: grid; gap: 8px; }
.pin { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; background: var(--sheet); }
.pin b { font-weight: 500; display: block; font-size: 13.5px; } .pin small { color: var(--ink-2); font-size: 12px; }
.prow { display: flex; align-items: center; gap: 10px; height: 32px; font-size: 13.5px; }
.prow .pr { border-color: var(--panel); }
.prow small { margin-left: auto; color: var(--ink-2); font-size: 12px; }
.setrow { display: flex; align-items: center; justify-content: space-between; height: 36px; font-size: 13.5px; border-top: 1px solid var(--rule); }
.setrow span:last-child { color: var(--ink-2); display: flex; align-items: center; gap: 4px; }

/* Inbox board (from the departures board) */
.ibx { flex: 1; min-height: 0; overflow: hidden; padding: 24px 32px 0; display: flex; flex-direction: column; }
.ihead { display: flex; align-items: flex-end; gap: 16px; }
.ihead h1 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; }
.ihead p { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.ihead .acts { margin-left: auto; display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--rule-strong); background: var(--sheet); font-size: 13px; font-weight: 500; }
.btn.p { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.itabs { display: flex; gap: 4px; margin: 18px 0 12px; border-bottom: 1px solid var(--rule); }
.itab { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; font-size: 14px; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.itab.on { color: var(--ink); font-weight: 600; border-color: var(--accent); }
.itabs .note { margin-left: auto; align-self: center; font-size: 12px; color: var(--ink-2); }
.board { border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; background: var(--sheet); }
.brow { display: grid; grid-template-columns: 72px 188px 168px minmax(0, 1fr) 104px 176px; align-items: center; position: relative; }
.brow > div { padding: 0 12px; min-width: 0; }
.bh { background: var(--forest); color: var(--bone); height: 40px; font-size: 13px; font-weight: 500; }
.dark .bh { background: #1d3d32; }
.bh > div { display: flex; align-items: center; gap: 4px; }
.grp { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--rule); font-size: 13px; font-weight: 600; }
.grp span { font-weight: 400; color: var(--ink-2); }
.br { min-height: 62px; padding: 10px 0; border-top: 1px solid var(--rule); }
.br .t { font: 500 15px/20px var(--mono); }
.wh { display: flex; align-items: flex-start; gap: 6px; } .wh svg { margin-top: 2px; color: var(--ink-2); }
.wh b { font-weight: 600; display: block; } .sub { display: block; font-size: 12px; line-height: 16px; color: var(--ink-2); }
.fr { display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; }
.what b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.what p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.st { font-size: 13px; line-height: 18px; } .st .w { font-weight: 600; } .st .q { color: var(--ink-2); }
.mv { display: inline-flex; align-items: center; gap: 3px; margin-top: 2px; font-size: 12.5px; color: var(--ink-2); }
.mv svg { width: 14px; height: 14px; }
.ra { display: flex; gap: 4px; justify-content: flex-end; }
.ra button { height: 28px; padding: 0 9px; border-radius: 6px; font-size: 13px; font-weight: 500; border: 1px solid var(--rule-strong); background: var(--sheet); }
.ra button.p { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.br.lit { background: var(--well); }
.br.old .what b, .br.old .wh b, .br.old .t { font-weight: 400; }
.ifoot { margin-top: 12px; font-size: 13px; color: var(--ink-2); }

/* Phone */
.phones { display: flex; gap: 36px; padding: 24px 36px 52px; background: #dfe3dc; height: 100vh; align-items: center; justify-content: center; }
.dark .phones, .phones.d { background: #1a201e; }
.phone { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: var(--sheet); box-shadow: 0 0 0 10px #050605, 0 30px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; position: relative; }
.status { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 14px; font-weight: 600; }
.phead { height: 52px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 6px; border-bottom: 1px solid var(--rule); }
.phead .t { flex: 1; min-width: 0; line-height: 1.2; }
.phead .t b { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.phead .t span { font-size: 12px; color: var(--ink-2); }
.tap { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); border-radius: 10px; position: relative; }
.tap.back { width: auto; padding: 0 8px 0 6px; gap: 2px; display: flex; align-items: center; }
.tap.back .badge { position: static; }
.phone .log { padding: 0 16px; }
.pturn { padding: 8px 0; position: relative; }
.pturn .ln { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.pturn .ln b { font-size: 13.5px; font-weight: 600; }
.pturn .ln time { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pturn .tx { font-size: 16px; }
.pturn.mention .ln b::before { content: '@ '; color: var(--mention); }
.pturn.mention .ln time { color: var(--mention); font-weight: 600; }
.phone .heading { grid-template-columns: 1fr; padding: 12px 0 4px; }
.phone .heading .l { display: none; }
.phone .newline { grid-template-columns: auto 1fr; column-gap: 10px; }
.pcomp { display: flex; align-items: center; gap: 6px; padding: 8px 10px 28px; border-top: 1px solid var(--rule); flex: none; }
.pcomp .field { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 1px solid var(--rule-strong); display: flex; align-items: center; padding: 0 2px 0 14px; color: var(--ink-2); font-size: 16px; white-space: nowrap; }
.pcomp .field span:first-child { overflow: hidden; text-overflow: ellipsis; }
.pcomp .field span { flex: 1; }
.round { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.round.send { background: var(--accent); color: var(--accent-fg); }
.scrim { position: absolute; inset: 0; background: rgba(12, 26, 22, .45); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet); border-radius: 20px 20px 0 0; padding: 8px 0 30px; box-shadow: 0 -10px 30px rgba(0,0,0,.25); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--rule-strong); margin: 0 auto 10px; }
.sprev { margin: 0 16px 10px; padding: 10px 12px; border-radius: 12px; background: var(--well); font-size: 14px; color: var(--ink-2); }
.sprev b { color: var(--ink); }
.opt { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 22px; font-size: 16px; border-top: 1px solid var(--rule); }
.opt svg { color: var(--ink-2); }
.quick { display: flex; justify-content: space-between; padding: 10px 18px 12px; }
.quick span { width: 48px; height: 48px; border-radius: 24px; background: var(--well); display: grid; place-items: center; font-size: 22px; }
.mrow { display: grid; grid-template-columns: 52px 1fr 44px; gap: 0 6px; padding: 12px 16px; border-bottom: 1px solid var(--rule); position: relative; }
.mrow .t { font: 500 14px/20px var(--mono); }
.mrow .w { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
.mrow p { font-size: 15px; line-height: 1.45; margin-top: 2px; }
.mrow.lit { background: var(--well); }
.mrow .more { grid-row: 1 / span 2; grid-column: 3; align-self: center; }
.mrow .st { grid-column: 2; margin-top: 4px; font-size: 12.5px; }
.cap { position: absolute; bottom: -36px; left: 0; right: 0; text-align: center; font-size: 13px; color: #55605b; }
.dark .cap { color: #a9b5ae; }
.pwrap { position: relative; }

/* Sign-in: a cover sheet for the record. Where you are signing in is stated, in the title block's voice. */
.si { min-height: 100vh; background: var(--panel); display: grid; grid-template-rows: auto 1fr auto; }
.si-top { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; }
.lockup { display: flex; align-items: center; gap: 10px; font: 600 19px var(--font); letter-spacing: -0.01em; }
.lockup span.l { width: 30px; height: 30px; display: block; }
.si-tools { display: flex; gap: 8px; }
.si-main { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 420px); gap: 96px; justify-content: center; align-items: center; padding: 0 40px 40px; }
.si h1 { font: 600 40px/1.12 var(--font); letter-spacing: -0.02em; text-wrap: balance; }
.si .lede { margin-top: 12px; font-size: 16px; line-height: 1.55; color: var(--ink-2); max-width: 42ch; }
.notice { margin-top: 24px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--well); font-size: 14px; line-height: 1.5; }
.notice svg { margin-top: 1px; color: var(--ink-2); }
.primary { height: 44px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.si .primary { margin-top: 28px; width: 100%; height: 48px; font-size: 15.5px; }
.si .primary:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.si .after { margin-top: 12px; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.si .help { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--ink-2); }
.si .help b { color: var(--ink); font-weight: 600; }
.record { background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; }
.record h2 { font-size: 13px; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--rule-strong); display: flex; align-items: center; gap: 8px; }
.record h2 svg { color: var(--ink-2); }
.record dl { display: grid; grid-template-columns: 1fr 1fr; }
.record .c { padding: 10px 16px 11px; border-top: 1px solid var(--rule); display: grid; gap: 2px; min-width: 0; }
.record .c.first { border-top: 0; }
.record .c.right { border-left: 1px solid var(--rule); }
.record dt { font-size: 11.5px; color: var(--ink-2); }
.record dd { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.record dd.num { font: 13.5px var(--mono); }
.record .c.wide { grid-column: 1 / -1; }
.record .note { border-top: 1px solid var(--rule-strong); padding: 10px 16px; font-size: 13px; color: var(--ink-2); line-height: 1.5; display: flex; gap: 8px; }
.record .note svg { flex: none; margin-top: 1px; }
.si-foot { display: flex; justify-content: space-between; padding: 16px 40px 20px; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--rule); }
.si.phone-si .si-top { padding: 12px 16px; }
.si.phone-si .si-main { grid-template-columns: 1fr; gap: 28px; padding: 8px 20px 24px; align-items: start; }
.si.phone-si h1 { font-size: 30px; }
.si.phone-si .si-foot { padding: 12px 20px 28px; flex-direction: column; gap: 4px; }
</style>
</head>

<script>

    ${pturn('Zeynep Ak', '09:52', '<p>That is the command if anyone wants to try:</p><pre>make load LOAD_USERS=200</pre><div class="reacts"><span class="re mine" style="height:36px">👍 3</span><span class="re" style="height:36px">🎉 1</span></div>')}
    ${pturn('Mert Demir', '10:05', '<p><span class="chip you">@Deniz Kaya</span> the release notes tab is ready for a read.</p>', 'mention')}
  </section>
  <div class="pcomp"><span class="round" title="Attach">${I('plus')}</span><div class="field"><span>Message General</span></div><span class="round" title="Emoji">${I('smile')}</span><span class="round send" title="Send">${I('send-horizontal')}</span></div>
</div><div class="cap">Channel: name and time above the text</div></div>`;
const phoneSheet = () => `<div class="pwrap"><div class="phone">
  <div class="status"><span>9:41</span><span class="tab">100%</span></div>
  <div class="phead"><span class="tap">${I('arrow-left')}</span><div class="t"><b>${I('channel', 's')}General</b><span>24 members</span></div><span class="tap">${I('search')}</span><span class="tap">${I('ellipsis')}</span></div>
  <section class="log">${pturn('Zeynep Ak', '09:52', '<p>That is the command if anyone wants to try:</p><pre>make load LOAD_USERS=200</pre>')}${pturn('Mert Demir', '10:05', '<p>The release notes tab is ready for a read.</p>')}</section>
  <div class="scrim"></div>
  <div class="sheet"><div class="grab"></div>
    <div class="sprev"><b>Zeynep Ak</b> · That is the command if anyone wants to try…</div>
    <div class="opt">${I('message-circle-reply')}Reply in thread</div><div class="opt">${I('forward')}Forward</div><div class="opt">${I('bookmark')}Save</div><div class="opt">${I('copy')}Copy text</div><div class="opt">${I('link')}Copy link</div><div class="opt">${I('circle')}Mark unread</div>
    <div class="quick" style="border-top:1px solid var(--rule)"><span>👍</span><span>❤️</span><span>🎉</span><span>👀</span><span>✅</span><span style="color:var(--ink-2)">${I('smile-plus')}</span></div>

</div><div class="cap">Press and hold: actions first, reactions below</div></div>`;
const phoneInbox = () => `<div class="pwrap"><div class="phone">
  <div class="status"><span>9:41</span><span class="tab">100%</span></div>
  <div class="phead"><span class="tap">${I('arrow-left')}</span><div class="t"><b>${I('inbox', 's')}Inbox</b><span>3 new · updated 10:05</span></div><span class="tap">${I('check')}</span></div>
  <div class="itabs" style="margin:0;padding:0 8px"><button class="itab on" style="height:44px">All</button><button class="itab" style="height:44px">Mentions <span class="badge">3</span></button><button class="itab" style="height:44px">Direct <span class="badge">1</span></button></div>
  <div style="flex:1;overflow:hidden">
    <div class="mrow lit"><span class="t">10:05</span><div><span class="w">${I('lock', 's')}release-rc · Mention</span><p><b>Mert Demir:</b> <span class="chip you">@Deniz Kaya</span> can you approve the release notes before 15:00?</p></div><span class="round more" title="Done, Later">${I('ellipsis')}</span><span class="st"><b>New</b></span></div>
    <div class="mrow"><span class="t">10:02</span><div><span class="w">${I('channel', 's')}General · Thread</span><p><b>Design review moved to 14:00</b> · 4 new replies</p></div><span class="round more" title="Done, Later">${I('ellipsis')}</span><span class="st"><b>New</b> · <span class="mv" style="margin:0">${I('arrow-up')}moved</span></span></div>

const signinBody = (notice, phone) => `<div class="si ${phone ? 'phone-si' : ''}">
  <header class="si-top"><span class="lockup"><span class="l">${LOGO(document.body.classList.contains('dark') ? '#F3EEE2' : '#14342B')}</span>Cenacle</span>
    ${phone ? `<span class="tap" title="Language and theme">${I('languages')}</span>` : `<div class="si-tools"><button class="btn">${I('moon', 's')}Theme: System</button><button class="btn">${I('languages', 's')}English</button><button class="btn">Help</button></div>`}</header>
  <main class="si-main">
    <section>
      <h1>Sign in to Cenacle</h1>
      <p class="lede">Use your Cenacle ID account. After signing in you come back here, to your conversations.</p>
      ${notice ? `<div class="notice" role="status">${I('clock', 's')}<span>You were signed out because your session ended after 7 days without use. Sign in again to continue; your drafts are kept.</span></div>` : ''}
      <button class="primary">${I('lock-keyhole', 's')}Continue with Cenacle ID</button>
      <p class="after">Passkeys, two-step verification and your directory account are offered on the next page.</p>
      <p class="help"><b>No account yet?</b> Ask your administrator to create one.</p>
    </section>
    <aside class="record" aria-label="Where you are signing in">
      <h2>${I('shield-check', 's')}You are signing in to</h2>
      <dl>
        <div class="c wide first"><dt>Server</dt><dd class="num">chat.example.com</dd></div>
        <div class="c"><dt>Organization</dt><dd>Example Organization</dd></div>
        <div class="c right"><dt>Version</dt><dd class="num">0.29.0</dd></div>
        <div class="c wide"><dt>Identity server</dt><dd class="num">id.example.com</dd></div>
      </dl>
      <p class="note">${I('lock', 's')}<span>Enter your password only on id.example.com. Messages and files stay on this organization's servers.</span></p>
    </aside>
  </main>
  <footer class="si-foot"><span>Cenacle, open source and self-hosted</span><span>Need help? Contact your IT department.</span></footer>
</div>`;
const signin = () => signinBody(q.get('notice') === '1', false);
const phoneSignin = () => `<div class="phones"><div class="pwrap"><div class="phone" style="overflow:auto"><div class="status"><span>9:41</span><span class="tab">100%</span></div>${signinBody(false, true)}</div><div class="cap">Sign in on a phone</div></div><div class="pwrap"><div class="phone"><div class="status"><span>9:41</span><span class="tab">100%</span></div>${signinBody(true, true)}</div><div class="cap">After the session ended</div></div></div>`;

const root = document.getElementById('root');
if (S === 'chat') root.innerHTML = `<div class="app">${rail()}${side('general')}<main class="main">${head(true)}${conversation(false)}</main>${details()}</div>`;
if (S === 'thread') root.innerHTML = `<div class="app">${rail()}${side('general')}<main class="main">${head(false)}${conversation(true)}</main>${thread()}</div>`;
if (S === 'inbox') root.innerHTML = `<div class="app" style="grid-template-columns:64px 256px minmax(0,1fr)">${rail()}${side('inbox')}${inbox()}</div>`;
if (S === 'phone') root.innerHTML = `<div class="phones">${phoneChat()}${phoneSheet()}${phoneInbox()}</div>`;
if (S === 'signin') root.innerHTML = signin();
if (S === 'signin-phone') root.innerHTML = phoneSignin();
</script>
</body>
