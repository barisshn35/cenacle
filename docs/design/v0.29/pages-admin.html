<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cenacle</title>
<link rel="stylesheet" href="app.css">
<style>
/* Workspace settings area */
.wsh { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 24px; border-bottom: 1px solid var(--rule); }
.wsh h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.wsh h1 svg { color: var(--ink-2); }
.wsh .crumb { color: var(--ink-2); font-size: 13.5px; }
.wsh .sp { flex: 1; }
.wsx { flex: 1; min-height: 0; display: grid; grid-template-columns: 216px minmax(0, 1fr); }
.snav { border-right: 1px solid var(--rule); background: var(--panel); padding: 12px 10px; display: flex; flex-direction: column; gap: 1px; }
.snav h4 { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 12px 10px 4px; }
.snav h4:first-child { padding-top: 2px; }
.snav a { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; font-size: 13.5px; color: var(--ink); text-decoration: none; }
.snav a svg { color: var(--ink-2); }
.snav a.on { background: var(--accent-soft); font-weight: 600; }
.snav a.on svg { color: var(--accent); }
.snav a .m { margin-left: auto; font: 12px var(--mono); color: var(--ink-2); }
.cnt { min-height: 0; overflow: hidden; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; }
.ptitle { display: flex; align-items: flex-end; gap: 16px; }
.ptitle h2 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; }
.ptitle p { font-size: 14px; color: var(--ink-2); margin-top: 2px; max-width: 70ch; }
.ptitle .acts { margin-left: auto; display: flex; gap: 8px; flex: none; }
.sx h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sx h3 .c { font: 12px var(--mono); color: var(--ink-2); font-weight: 400; }
.sx h3 .r { margin-left: auto; display: flex; gap: 8px; }
.sx > .hint { font-size: 13px; color: var(--ink-2); margin: 2px 0 10px; max-width: 78ch; }
.fr2 { border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--sheet); overflow: hidden; }
.cols { display: grid; gap: 24px; min-height: 0; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* Tables */
.tb { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tb th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); height: 34px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--rule); white-space: nowrap; }
.tb td { padding: 8px 12px; border-top: 1px solid var(--rule); vertical-align: middle; height: 50px; }
.tb tr:first-child td { border-top: 0; }
.tb .pp { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb .pp b { font-weight: 600; display: block; line-height: 18px; white-space: nowrap; }
.tb .pp small, .tb small { font-size: 12px; color: var(--ink-2); display: block; line-height: 16px; }
.tb .num, .mono { font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.tb .end { text-align: right; white-space: nowrap; }
.tb tr.lit td { background: var(--well); }
.av.l { width: 32px; height: 32px; font-size: 12px; }

/* Controls */
.sb { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; border: 1px solid var(--rule-strong); border-radius: 7px; background: var(--sheet); font-size: 13px; font-weight: 500; white-space: nowrap; }
.sb svg { color: var(--ink-2); margin-left: auto; }
.sb.w { min-width: 120px; }
.sb.ro { border-color: transparent; background: none; padding-left: 0; color: var(--ink-2); font-weight: 400; }
.inp { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--rule-strong); border-radius: 7px; background: var(--sheet); font-size: 13.5px; color: var(--ink); min-width: 0; white-space: nowrap; overflow: hidden; }
.inp.ph { color: var(--ink-2); }
.inp.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.err { border-color: var(--mention); }
.ta { border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--sheet); padding: 8px 10px; font-size: 13.5px; line-height: 20px; color: var(--ink); }
.ta.mono { font: 12.5px/19px var(--mono); }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > label, .lab2 { font-size: 12.5px; font-weight: 600; }
.fld .h { font-size: 12px; color: var(--ink-2); }
.frow { display: flex; gap: 12px; align-items: flex-end; }
.frow > .fld { flex: 1; }
.btn.d { color: var(--mention); }
.btn.s { height: 28px; padding: 0 9px; border-radius: 6px; }
.btn.g { border-color: transparent; background: none; }
.btn svg { width: 16px; height: 16px; }
.sw { width: 36px; height: 22px; border-radius: 11px; background: var(--rule-strong); position: relative; flex: none; display: inline-block; vertical-align: middle; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.sw.on { background: var(--accent); } .sw.on::after { left: 17px; }
.dark .sw.on::after { background: var(--accent-fg); }
.swl { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; background: var(--well); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.tag.o { background: none; border: 1px solid var(--rule-strong); font-weight: 500; }
.st2 { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.st2 svg { width: 16px; height: 16px; color: var(--ink-2); }
.st2.bad, .st2.bad svg { color: var(--mention); font-weight: 600; }
.err { color: var(--mention); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.line { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--rule); font-size: 13.5px; }
.line:first-child { border-top: 0; }
.line .gr { flex: 1; min-width: 0; }
.line .gr b { font-weight: 600; display: block; }
.line .gr small { font-size: 12px; color: var(--ink-2); display: block; line-height: 17px; }
.inset { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.ok { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--well); font-size: 13px; }
.ok svg { color: var(--ink-2); margin-top: 1px; }
.dotc { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); }
.subtabs span { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.subtabs span.on { color: var(--ink); font-weight: 600; border-color: var(--accent); }
.subtabs .m { font: 12px var(--mono); color: var(--ink-2); font-weight: 400; }

/* Bots */
.bots { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; min-height: 0; flex: 1; }
.blist { display: flex; flex-direction: column; gap: 2px; }
.bitem { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; }
.bitem.on { background: var(--accent-soft); }
.bitem .bi { width: 32px; height: 32px; border-radius: 8px; background: var(--well); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.bitem.on .bi { color: var(--accent); }
.bitem b { font-size: 13.5px; font-weight: 600; display: block; line-height: 18px; }
.bitem small { font-size: 12px; color: var(--ink-2); display: block; line-height: 16px; }
.botbadge { font-size: 11px; font-weight: 600; border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 5px; color: var(--ink-2); line-height: 16px; }
.dv { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* Ask AI */
.ask { flex: 1; min-height: 0; overflow: hidden; padding: 32px; display: flex; justify-content: center; }
.ask .col { width: 760px; display: flex; flex-direction: column; gap: 18px; }
.ans { border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--sheet); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.ans .by { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.ans .tx p + p { margin-top: 8px; }
.ans ul { padding-left: 20px; } .ans li { margin-top: 4px; }
.ans sup { font: 600 11px var(--mono); color: var(--accent); }
.srcs { border-top: 1px solid var(--rule); padding-top: 12px; }
.srcs h4 { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.src { display: grid; grid-template-columns: 22px 150px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 13.5px; }
.src:first-of-type { border-top: 0; }
.src .n { font: 12px var(--mono); color: var(--ink-2); }
.src a { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
.src .w { color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 4px; }
.src .w svg { width: 14px; height: 14px; }
.src p { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src time { font: 12px var(--mono); color: var(--ink-2); }

/* Cenacle ID admin */
.idp { height: 100vh; background: var(--panel); display: grid; grid-template-rows: 72px 1fr; }
.idp .top { display: flex; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid var(--rule); }
.idlock { display: flex; align-items: center; gap: 10px; font: 600 19px var(--font); letter-spacing: -0.01em; }
.idlock svg { width: 30px; height: 30px; }
.idlock small { font: 500 12px var(--mono); color: var(--ink-2); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 1px 6px; letter-spacing: 0; }
.idp .body { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 0; }
.idp .snav { background: none; border-right: 1px solid var(--rule); padding: 20px 14px; }
.idp .main2 { padding: 28px 40px; overflow: hidden; display: flex; flex-direction: column; gap: 18px; }

/* States and empty */
.quad { height: 100vh; background: var(--well); display: grid; grid-template-columns: 700px 700px; grid-template-rows: 430px 430px; gap: 14px; padding: 13px 13px; justify-content: center; align-content: center; }
.pane { position: relative; background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.pane .lbl { position: absolute; left: 12px; top: 10px; font: 500 11.5px var(--mono); color: var(--ink-2); }
.pane .ph3 { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid var(--rule); font-size: 15px; font-weight: 600; }
.pane .ph3 svg { color: var(--ink-2); }
.pane .ph3 .t2 { font-weight: 400; color: var(--ink-2); font-size: 13px; }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 24px; }
.center h2 { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
.center p { font-size: 14px; color: var(--ink-2); max-width: 44ch; }
.glyph { width: 44px; height: 44px; border-radius: 12px; background: var(--well); display: grid; place-items: center; color: var(--ink-2); }
.glyph svg { width: 22px; height: 22px; }
.halves { height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.halves > .main { border-left: 1px solid var(--rule); }
.halves > .main:first-child { border-left: 0; }
.scrim { position: absolute; inset: 0; background: rgba(12, 26, 22, .45); }
</style>
<style>.line .gr small.sl { display: flex; align-items: center; gap: 5px; color: var(--ink); margin-top: 2px; } .line .gr small.sl svg { color: var(--ink-2); width: 14px; height: 14px; } .line .gr small.mono { font: 12px var(--mono); }</style>
<style>.btn{white-space:nowrap;flex:none}</style>
<style>.tb td .btn{vertical-align:middle}</style>
</head>
