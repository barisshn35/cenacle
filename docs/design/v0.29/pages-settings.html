<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cenacle settings</title>
<link rel="stylesheet" href="app.css">
<style>
/* Settings: a large dialog over the dimmed app. Section list left (Paper), the section right (sheet). */
.scrim { position: fixed; inset: 0; background: rgba(12, 26, 22, .45); }
.dlg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1120px; height: 812px; background: var(--sheet); border-radius: 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 236px minmax(0, 1fr); overflow: hidden; }
.snav { background: var(--panel); border-right: 1px solid var(--rule); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.snav .t { padding: 0 10px 14px; }
.snav .t b { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; display: block; line-height: 22px; }
.snav .t span { font-size: 12px; color: var(--ink-2); }
.snav .g { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 14px 10px 4px; }
.it { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; font-size: 13.5px; color: var(--ink); }
.it svg { color: var(--ink-2); }
.it.sel { background: var(--accent-soft); font-weight: 600; }
.it.sel svg { color: var(--accent); }
.it .ext { margin-left: auto; width: 14px; height: 14px; }
.snav .grow { flex: 1; }
.snav .host { font: 12px var(--mono); color: var(--ink-2); padding: 0 10px; }

.smain { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.shd { height: 72px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 32px; border-bottom: 1px solid var(--rule); }
.shd div { flex: 1; min-width: 0; }
.shd h1 { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.015em; }
.shd p { font-size: 13.5px; color: var(--ink-2); }
.sbd { flex: 1; min-height: 0; overflow: hidden; padding: 6px 32px 24px; }
.sft { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 24px 12px 32px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-2); }
.sft .sp { flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 40px; }

/* Rows: label + hint on the left, control on the right, hairline between */
.sx { padding-top: 18px; }
.sx > h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.sx > h3 small { font-weight: 400; color: var(--ink-2); font-size: 12.5px; }
.sr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 11px 0; border-top: 1px solid var(--rule); }
.sr.top { align-items: start; }
.sr .l b { font-size: 13.5px; font-weight: 500; display: block; line-height: 18px; }
.sr .l p, .hint { font-size: 12.5px; line-height: 17px; color: var(--ink-2); margin-top: 2px; }
.sr .r { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.lab { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }

/* Controls (shadcn on Base UI: Input, Select trigger, Switch, RadioGroup, Checkbox, Slider, ToggleGroup) */
.inp { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--rule-strong); border-radius: 7px; background: var(--sheet); font-size: 13.5px; min-width: 0; }
.inp.ro { background: var(--well); border-color: var(--rule); color: var(--ink); }
.inp.ro svg { color: var(--ink-2); margin-left: auto; }
.inp.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp .m, .m { font-family: var(--mono); font-size: 13px; }
.selb { height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; border: 1px solid var(--rule-strong); border-radius: 7px; background: var(--sheet); font-size: 13.5px; white-space: nowrap; }
.selb svg { color: var(--ink-2); margin-left: auto; width: 16px; height: 16px; }
.sw { width: 40px; height: 24px; border-radius: 12px; background: var(--rule-strong); position: relative; flex: none; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
.sw.on { background: var(--accent); } .sw.on::after { left: 19px; }
.dark .sw::after { background: #ece8dd; } .dark .sw.on::after { background: #1b1507; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--sheet); gap: 2px; }
.seg span { height: 28px; display: flex; align-items: center; padding: 0 12px; border-radius: 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.seg span.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.rad { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; }
.rad i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--sheet); flex: none; margin-top: 1px; }
.rad.on i { border: 5px solid var(--accent); }
.rad b { font-size: 13.5px; font-weight: 500; display: block; line-height: 20px; }
.rad p { font-size: 12.5px; color: var(--ink-2); line-height: 17px; }
.ck { display: flex; align-items: center; gap: 10px; font-size: 13.5px; height: 30px; }
.ck i { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--rule-strong); display: grid; place-items: center; background: var(--sheet); flex: none; }
.ck.on i { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.ck i svg { width: 13px; height: 13px; stroke-width: 2.5; }
.days { display: flex; gap: 4px; }
.days span { width: 40px; height: 30px; border-radius: 7px; border: 1px solid var(--rule-strong); display: grid; place-items: center; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.days span.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.slider { display: flex; align-items: center; gap: 12px; }
.slider .tr { width: 180px; height: 4px; border-radius: 2px; background: var(--rule-strong); position: relative; }
.slider .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--accent); }
.slider .tr b { position: absolute; top: -7px; width: 18px; height: 18px; border-radius: 50%; background: var(--sheet); border: 1px solid var(--accent); margin-left: -9px; box-shadow: 0 1px 2px rgba(20, 52, 43, .15); }
.btn.sm { height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; }
.btn.danger { color: var(--mention); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.iconbtn.b { border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); width: 32px; height: 32px; border-radius: 7px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 4px; background: var(--well); font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.lnk { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.lnk svg { width: 14px; height: 14px; color: var(--ink-2); }

/* Profile */
.pic { display: flex; align-items: center; gap: 18px; }
.av.xl { width: 72px; height: 72px; font-size: 22px; }
.av.xl .pr { width: 18px; height: 18px; border: 3px solid var(--sheet); right: 0; bottom: 0; }
.cstat { display: flex; align-items: center; gap: 12px; border: 1px solid var(--rule-strong); border-radius: 10px; padding: 10px 10px 10px 14px; }
.cstat .e { font-size: 20px; width: 28px; text-align: center; }
.cstat div { flex: 1; min-width: 0; }
.cstat b { font-size: 13.5px; font-weight: 500; display: block; }
.cstat small { font-size: 12px; color: var(--ink-2); }
.prev2 { border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; background: var(--panel); }
.prev2 .k { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.card { display: flex; gap: 12px; align-items: center; }
.card b { font-size: 15px; font-weight: 600; display: block; }
.card > div > span { font-size: 12.5px; color: var(--ink-2); display: block; }
.card .stl { color: var(--ink); font-size: 13px; }

/* Appearance */
.themes { display: flex; gap: 12px; }
.th { width: 156px; }
.th .pv { height: 92px; border-radius: 10px; border: 1px solid var(--rule-strong); overflow: hidden; display: grid; grid-template-columns: 12px 40px 1fr; position: relative; }
.th.on .pv { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.th .cap2 { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-top: 8px; }
.th .cap2 i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--rule-strong); }
.th.on .cap2 { font-weight: 600; } .th.on .cap2 i { border: 5px solid var(--accent); }
.pv .r1 { background: #0c1a16; } .pv .s1 { background: #14342b; padding: 8px 5px; display: grid; gap: 4px; align-content: start; }
.pv .s1 u { height: 4px; border-radius: 2px; background: #c3cfc7; opacity: .55; display: block; }
.pv .s1 u.k { background: #c9a24b; opacity: 1; }
.pv .w { padding: 10px 10px; display: grid; gap: 6px; align-content: start; }
.pv .w u { height: 5px; border-radius: 3px; display: block; }
.pv.l .w { background: #fff; } .pv.l .w u { background: #e4ddcf; } .pv.l .w u.k { background: #16201d; width: 40%; }
.pv.d .s1 { background: #0f231d; } .pv.d .w { background: #111c18; } .pv.d .w u { background: #34483f; } .pv.d .w u.k { background: #ece8dd; width: 40%; }
.pv.sys .half { position: absolute; inset: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); display: grid; grid-template-columns: 12px 40px 1fr; }
.sws { display: flex; flex-wrap: wrap; gap: 6px; }
.swc { height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; border: 1px solid var(--rule-strong); border-radius: 16px; font-size: 13px; background: var(--sheet); }
.swc i { width: 20px; height: 20px; border-radius: 50%; display: block; }
.swc.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.fontrow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 6px 6px 12px; font-size: 13.5px; }
.fontrow b { font-weight: 500; } .fontrow small { color: var(--ink-2); font-size: 12px; }
.fontrow .sp { flex: 1; }
.preview { border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); padding: 6px 0; }
.preview .turn { grid-template-columns: 96px minmax(0, 1fr); column-gap: 14px; }
.preview .tx { font-size: 14px; }
.preview pre { margin-top: 6px; font-size: 12.5px; display: grid; grid-template-columns: 18px 1fr; column-gap: 10px; padding: 8px 12px; }
.preview pre .n { color: var(--ink-2); text-align: right; }
.preview pre .kw { color: var(--accent); font-weight: 600; }

/* Notifications */
.snd { display: grid; grid-template-columns: 1fr 156px 32px; gap: 8px; align-items: center; padding: 6px 0; font-size: 13.5px; }
.snd .selb { width: 156px; }
.ovr { border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; }
.ovr .h, .ovr .o { display: grid; grid-template-columns: minmax(0, 1fr) 168px 68px; align-items: center; }
.ovr .h { height: 34px; background: var(--panel); font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.ovr .h > div, .ovr .o > div { padding: 0 12px; }
.ovr .o { height: 38px; border-top: 1px solid var(--rule); font-size: 13.5px; }
.ovr .o .n { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.ovr .o .n svg { color: var(--ink-2); }
.ovr .q { color: var(--ink-2); }

/* Devices */
.dev { border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; }
.dev .h, .dev .d { display: grid; grid-template-columns: minmax(0, 1fr) 124px 136px 120px 96px; align-items: center; }
.dev .h { height: 36px; background: var(--panel); font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.dev .h > div, .dev .d > div { padding: 0 12px; min-width: 0; }
.dev .d { min-height: 64px; border-top: 1px solid var(--rule); }
.dev .nm { display: flex; align-items: center; gap: 12px; }
.dev .nm .ic { width: 36px; height: 36px; border-radius: 8px; background: var(--well); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.dev .nm b { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.dev .nm span { font-size: 12px; color: var(--ink-2); }
.dev .v { font: 13px var(--mono); }
.dev .v small { display: block; font: 12px var(--font); color: var(--ink-2); }
.dev .act { display: flex; justify-content: flex-end; }
.dev .d.gone { background: var(--well); }
.dev .d.gone .nm b, .dev .d.gone .v { color: var(--ink-2); }
.keep { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--well); font-size: 13.5px; line-height: 1.5; }
.keep svg { color: var(--ink-2); margin-top: 1px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--sheet); box-shadow: var(--shadow); border-radius: 10px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 12px; font-size: 13.5px; }

/* Language */
.lang { display: grid; grid-template-columns: repeat(2, 220px); gap: 10px; }
.lc { border: 1px solid var(--rule-strong); border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.lc i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--rule-strong); flex: none; margin-top: 1px; }
.lc.on { border-color: var(--accent); background: var(--accent-soft); } .lc.on i { border: 5px solid var(--accent); }
.lc b { display: block; font-size: 14px; font-weight: 600; } .lc span { font-size: 12.5px; color: var(--ink-2); }
.sample { border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; background: var(--sheet); }
.sample > div { padding: 10px 14px; border-top: 1px solid var(--rule); }
.sample > div:nth-child(2n) { border-left: 1px solid var(--rule); }
.sample > div:nth-child(-n+2) { border-top: 0; }
.sample .k { font-size: 11.5px; color: var(--ink-2); display: block; }
.sample .v { font: 13.5px var(--mono); }

/* Cenacle ID account page (separate site) */
.idp { min-height: 100vh; background: var(--panel); display: grid; grid-template-rows: auto 1fr auto; }
.idp .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; border-bottom: 1px solid var(--rule); }
.idp .lockup svg { width: 30px; height: 30px; }
.idp .tools { display: flex; gap: 8px; }
.idp .wrap { width: 1080px; margin: 0 auto; padding: 28px 0 24px; }
.idp h1 { font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; }
.idp .lede { font-size: 14.5px; color: var(--ink-2); margin-top: 4px; }
.idp .grid2 { display: grid; grid-template-columns: 470px minmax(0, 1fr); gap: 28px; margin-top: 22px; align-items: start; }
.idp .record dl { grid-template-columns: 1fr 1fr; }
.idp .record dd { white-space: normal; }
.idp .record dd .tag { margin-left: 6px; }
.box { background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; }
.box h2 { font-size: 13.5px; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--rule-strong); display: flex; align-items: center; gap: 8px; }
.box h2 svg { color: var(--ink-2); }
.box h2 .rt { margin-left: auto; font-weight: 400; font-size: 12.5px; color: var(--ink-2); }
.box .in { padding: 14px 16px; }
.state { display: flex; align-items: center; gap: 10px; }
.state .ok { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.state .ok svg { color: var(--online); }
.kv { display: grid; grid-template-columns: 140px 1fr; row-gap: 8px; margin-top: 12px; font-size: 13.5px; }
.kv dt { color: var(--ink-2); font-size: 12.5px; padding-top: 1px; }
.kv dd .m { font-size: 13px; }
.box .acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--rule); }
.act-t .h, .act-t .r { display: grid; grid-template-columns: 170px minmax(0, 1fr) 136px; align-items: center; }
.act-t .h { height: 34px; background: var(--panel); font-size: 12.5px; color: var(--ink-2); font-weight: 500; border-bottom: 1px solid var(--rule); }
.act-t .h > div, .act-t .r > div { padding: 0 16px; }
.act-t .r { height: 40px; border-top: 1px solid var(--rule); font-size: 13.5px; }
.act-t .r:nth-child(2) { border-top: 0; }
.act-t .t, .act-t .ip { font: 13px var(--mono); }
.act-t .ip { color: var(--ink-2); }
.act-t .fail { color: var(--mention); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.act-t .fail svg { width: 15px; height: 15px; }
.idp .foot { display: flex; justify-content: space-between; padding: 14px 40px 18px; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--rule); }
</style>
</head>
<body><script src="icons.js"></script><script src="app-kit.js"></script><script src="pages-settings-icons.js"></script><div id="root"></div><script>
const S = q.get('s') ?? 'profile';
const ck = I('check');
const sel = (txt, w = '') => `<span class="selb" ${w ? `style="width:${w}"` : ''}>${txt}${I('chevron-down', 's')}</span>`;

/* The app behind the dialog: General, read-only and dimmed */
const behind = () => shell('general', `<header class="head"><h1>${I('channel')}General</h1><span class="topic">Anything and everything for the whole team</span><span class="gov">${I('shield-check', 's')}Internal · kept 2 years</span></header>
  <div class="tabs"><span class="on">${I('message-square', 's')}Messages</span><span>${I('file-text', 's')}Release notes</span></div>
  <div class="log">
    <div class="heading"><span class="l">Today</span><h2>Friday 23 October 2026</h2></div>
    <div class="turn"><div class="mg"><div><span class="who">Ayşe Yılmaz</span><time>09:12</time></div>${av('Ayşe Yılmaz')}</div><div class="tx"><p>Good morning! The staging deploy from last night looks healthy.</p></div></div>
    <div class="turn"><div class="mg"><div><span class="who">Mert Demir</span><time>09:31</time></div>${av('Mert Demir')}</div><div class="tx"><p>Release checklist is pinned. Freeze starts at 14:00.</p></div></div>
    <div class="turn"><div class="mg"><div><span class="who">Zeynep Ak</span><time>09:52</time></div>${av('Zeynep Ak')}</div><div class="tx"><p>Load test numbers are in the thread.</p></div></div>
  </div>
  <div class="foot"><div class="typing"><span></span><span></span></div><div class="comp"><span class="ph">Message General</span><span class="iconbtn">${I('paperclip')}</span><span class="iconbtn aa">Aa</span><span class="iconbtn">${I('smile')}</span><span class="iconbtn">${I('at-sign')}</span><span class="send">${I('send-horizontal')}</span></div></div>`);

const NAV = [
  ['profile', 'user-round', 'Profile'],
  ['appearance', 'palette', 'Appearance'],
  ['notifications', 'bell', 'Notifications'],
  ['devices', 'laptop', 'Signed-in devices'],
  ['language', 'languages', 'Language and region'],
];
const nav = (cur) => `<nav class="snav" aria-label="Settings sections">
  <div class="t"><b>Settings</b><span>Deniz Kaya · Cenacle</span></div>
  ${NAV.map(([k, ic, l]) => `<div class="it ${k === cur ? 'sel' : ''}" ${k === cur ? 'aria-current="page"' : ''}>${I(ic)}${l}</div>`).join('')}
  <div class="g">Workspace · admin</div>
  <div class="it">${I('type')}Interface texts</div>
  <div class="it">${I('megaphone')}Announcements</div>
  <div class="g">Security</div>
  <div class="it">${I('shield-check')}Cenacle ID account${I('external-link', 'ext')}</div>
  <div class="grow"></div>
  <div class="host">chat.alanadi.com</div>
</nav>`;
const dialog = (cur, title, desc, body, foot = '') => behind() + `<div class="scrim"></div>
<div class="dlg" role="dialog" aria-modal="true" aria-label="Settings">${nav(cur)}
  <section class="smain"><header class="shd"><div><h1>${title}</h1><p>${desc}</p></div><span class="iconbtn" title="Close (Esc)">${I('x')}</span></header>
  <div class="sbd">${body}</div>${foot}</section></div>`;
const saved = (t = 'Changes save as you make them.') => `<footer class="sft">${I('circle-check', 's')}<span>${t}</span></footer>`;

/* 1. Profile */
const profile = () => dialog('profile', 'Profile', 'How others see you in Cenacle.', `<div class="cols">
  <div>
    <div class="sx"><h3>Picture</h3>
      <div class="pic"><span class="av a4 xl">DK<i class="pr on"></i></span><div><div style="display:flex;gap:8px"><span class="btn">${I('upload', 's')}Change picture</span><span class="btn ghost">Remove</span></div><p class="hint" style="margin-top:8px">PNG, JPEG, WebP or GIF up to 5 MB. Animated GIFs stand still for people who reduce motion.</p></div></div>
    </div>
