packages:
  - web
  - idp
  - desktop
  - mobile
  - packages/*
saveExact: true
allowBuilds:
  electron: true
  '@electron/fuses': false
  electron-winstaller: false
  '@parcel/watcher': false
  esbuild: true
# Install native binaries (e.g. @node-rs/argon2) for every platform the
# container images target, so a build on amd64 can produce arm64 images too.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, x64, arm64]
  libc: [current, glibc, musl]
# Security fixes of transitive dependencies (until their parents update).
overrides:
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  fast-uri@>=4.0.0 <4.2.3: 4.2.3
