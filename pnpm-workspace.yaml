packages:
  - web
  - idp
  - desktop
  - mobile
  - packages/*
saveExact: true
# Supply chain: a version must be a day old before it is installed (most
# malicious releases are taken down within hours; Dependabot waits a week for
# routine updates), a package may not lose the trust evidence (provenance,
# trusted publishing) its earlier versions had, and dependencies of
# dependencies come from the registry only (no git or tarball addresses).
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Old majors published by the same maintainers before npm had provenance.
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
blockExoticSubdeps: true
allowBuilds:
  electron: true
  '@electron/fuses': false
  electron-winstaller: false
  '@parcel/watcher': false
  esbuild: true
# Install native binaries (e.g. @node-rs/argon2) for every platform the
# container images target, so a build on amd64 can produce arm64 images too.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, x64, arm64]
  libc: [current, glibc, musl]
# Security fixes of transitive dependencies (until their parents update).
overrides:
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  fast-uri@>=4.0.0 <4.2.3: 4.2.3
