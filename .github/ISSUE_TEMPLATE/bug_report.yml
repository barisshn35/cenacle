name: Bug report
description: Something does not work as expected.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Cenacle version or commit.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [server, idp, web, deployment, docs, other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and request IDs
      description: Relevant log lines. Include the `request_id` from error responses if available.
      render: text
