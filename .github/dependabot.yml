version: 2
updates:
  - package-ecosystem: gomod
    directories: [/server, /deploy/caddy]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Matches pnpm's minimum release age (pnpm-workspace.yaml): no brand-new releases.
    cooldown: { default-days: 7 }
    ignore:
      # Types follow the Node runtime (.nvmrc, Node 26 LTS; desktop/: Electron's Node 24);
      # upgrade together on purpose.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/server, /idp, /web, /deploy/compose/caddy, /deploy/compose/ldap, /ci/image]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      # Go and Node lines are pinned with go.mod (toolchain) and .nvmrc and upgraded
      # deliberately; base images only take patch updates automatically.
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major, version-update:semver-minor]
  # The images of the Compose files (pinned by digest, like the Dockerfiles').
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
