version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: gomod
    directories: [/server, /deploy/caddy]
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Matches pnpm's minimum release age policy: no brand-new releases.
    cooldown: { default-days: 3 }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/server, /idp, /web, /deploy/compose/caddy, /deploy/compose/ldap]
    schedule: { interval: weekly }
